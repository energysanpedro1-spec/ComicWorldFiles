<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Leer historieta - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #181a1f;

    color: white;
}

header {

    background: #222;

    padding: 18px;

    text-align: center;

    border-bottom: 1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 24px;
}

.container {

    width: 94%;

    max-width: 900px;

    margin: 25px auto;
}

.card {

    background: #24272d;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.25);
}

.cover {

    width: 100%;

    max-height: 500px;

    object-fit: contain;

    display: block;

    margin: 0 auto 20px;

    border-radius: 8px;

    background: #111;
}

.story-title {

    font-size: 28px;

    margin: 0 0 10px;
}

.story-description {

    color: #ccc;

    line-height: 1.6;
}

.story-info {

    color: #aaa;

    font-size: 14px;

    margin-top: 10px;
}

.chapter-header {

    text-align: center;

    margin-bottom: 25px;
}

.chapter-header h2 {

    margin: 0;

    font-size: 25px;
}

.chapter-number {

    color: #aaa;

    margin-top: 7px;
}

.chapter-content {

    line-height: 1.7;

    color: #ddd;

    white-space: pre-wrap;

    margin-bottom: 30px;
}

.page {

    margin: 0 auto 25px;

    text-align: center;
}

.page img {

    display: block;

    width: auto;

    max-width: 100%;

    height: auto;

    margin: 0 auto;

    border-radius: 5px;

    background: #111;
}

.page-name {

    color: #777;

    font-size: 12px;

    margin-top: 5px;
}

.navigation {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-top: 30px;
}

button {

    border: none;

    border-radius: 7px;

    padding: 12px 18px;

    font-size: 15px;

    cursor: pointer;

    background: #333;

    color: white;
}

button:hover {

    background: #444;
}

button:disabled {

    background: #555;

    color: #999;

    cursor: not-allowed;
}

.chapter-list {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 15px;
}

.chapter-button {

    background: #333;

    padding: 9px 12px;

    border-radius: 6px;

    cursor: pointer;

    color: white;

    border: none;
}

.chapter-button.active {

    background: #666;
}

.error {

    background: #3a2020;

    border: 1px solid #8a4444;

    color: #ffb0b0;

    padding: 15px;

    border-radius: 7px;

    margin-top: 15px;
}

.loading {

    text-align: center;

    color: #aaa;

    padding: 30px;
}

.back {

    display: inline-block;

    margin-top: 10px;

    color: #ccc;

    text-decoration: none;

    font-weight: bold;
}

.back:hover {

    color: white;
}

.hidden {

    display: none !important;
}

</style>

</head>

<body>

<header>

<h1>ComicWorldFiles</h1>

</header>

<div class="container">

<!-- =====================================================
     INFORMACIÓN DE LA HISTORIETA
====================================================== -->

<div id="storyCard" class="card hidden">

```
<img
    id="cover"
    class="cover"
    alt="Portada"
>

<h2
    id="storyTitle"
    class="story-title">
</h2>

<div
    id="storyDescription"
    class="story-description">
</div>

<div
    id="storyInfo"
    class="story-info">
</div>
```

</div>

<!-- =====================================================
     CAPÍTULOS
====================================================== -->

<div
    id="chaptersCard"
    class="card hidden">

```
<strong>
    Capítulos
</strong>

<div
    id="chapterList"
    class="chapter-list">
</div>
```

</div>

<!-- =====================================================
     LECTOR
====================================================== -->

<div
    id="readerCard"
    class="card hidden">

```
<div class="chapter-header">

    <h2 id="chapterTitle">
    </h2>

    <div
        id="chapterNumber"
        class="chapter-number">
    </div>

</div>


<div
    id="chapterContent"
    class="chapter-content">
</div>


<div
    id="pagesContainer">
</div>


<div class="navigation">

    <button
        id="previousButton"
        onclick="capituloAnterior()">

        ← Capítulo anterior

    </button>

    <button
        id="nextButton"
        onclick="capituloSiguiente()">

        Capítulo siguiente →

    </button>

</div>
```

</div>

</div>

====================================================== -->

<div
    id="error"
    class="error hidden">
</div>

<a
 href="index.html"
 class="back">

```
← Volver
```

</a>

</div>

<script>

// ========================================================
// VARIABLES
// ========================================================

let storyId = null;

let chapters = [];

let currentChapterIndex = -1;


// ========================================================
// OBTENER ID DE LA HISTORIETA
// ========================================================

function obtenerStoryId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        Number(
            params.get("id")
        );

    if (!id || id <= 0) {

        return null;

    }

    return id;

}


// ========================================================
// OBTENER CAPÍTULO INDICADO
// ========================================================

function obtenerChapterId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const chapter =
        Number(
            params.get("chapter")
        );

    if (!chapter || chapter <= 0) {

        return null;

    }

    return chapter;

}


// ========================================================
// ERROR
// ========================================================

function mostrarError(mensaje) {

    document
        .getElementById("loading")
        .classList.add("hidden");

    const error =
        document.getElementById("error");

    error.textContent =
        mensaje;

    error.classList.remove(
        "hidden"
    );

}


// ========================================================
// CARGAR HISTORIETA
// ========================================================

async function cargarHistorieta() {

    storyId =
        obtenerStoryId();

    if (!storyId) {

        mostrarError(
            "No se indicó qué historieta quieres leer."
        );

        return;

    }


    try {

        // -------------------------------------------------
        // OBTENER HISTORIETA
        // -------------------------------------------------

        const storyResponse =
            await fetch(
                "/api/stories/" +
                storyId
            );


        const storyData =
            await storyResponse.json();


        if (!storyResponse.ok) {

            throw new Error(
                storyData.error ||
                "No se pudo cargar la historieta."
            );

        }


        const story =
            storyData.story;


        // -------------------------------------------------
        // INFORMACIÓN
        // -------------------------------------------------

        document
            .getElementById("storyTitle")
            .textContent =
                story.title;


        document
            .getElementById("storyDescription")
            .textContent =
                story.description;


        document
            .getElementById("storyInfo")
            .textContent =
                "Género: " +
                story.genre +
                " · Autor: " +
                story.author;


        if (story.cover_url) {

            const cover =
                document.getElementById(
                    "cover"
                );

            cover.src =
                story.cover_url;

            cover.classList.remove(
                "hidden"
            );

        } else {

            document
                .getElementById("cover")
                .classList.add(
                    "hidden"
                );

        }


        document
            .getElementById("storyCard")
            .classList.remove(
                "hidden"
            );


        // -------------------------------------------------
        // OBTENER CAPÍTULOS
        // -------------------------------------------------

        const chaptersResponse =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters"
            );


        const chaptersData =
            await chaptersResponse.json();


        if (!chaptersResponse.ok) {

            throw new Error(
                chaptersData.error ||
                "No se pudieron cargar los capítulos."
            );

        }


        chapters =
            chaptersData.chapters ||
            [];


        if (!chapters.length) {

            document
                .getElementById("loading")
                .classList.add("hidden");

            mostrarError(
                "Esta historieta todavía no tiene capítulos."
            );

            return;

        }


        // -------------------------------------------------
        // MOSTRAR LISTA DE CAPÍTULOS
        // -------------------------------------------------

        mostrarListaCapitulos();


        // -------------------------------------------------
        // DETERMINAR CAPÍTULO
        // -------------------------------------------------

        const requestedChapterId =
            obtenerChapterId();


        let index = -1;


        if (requestedChapterId) {

            index =
                chapters.findIndex(
                    function(chapter) {

                        return Number(
                            chapter.id
                        ) ===
                        requestedChapterId;

                    }
                );

        }


        // Si no se indicó capítulo,
        // cargar el primero.

        if (index < 0) {

            index = 0;

        }


        await cargarCapitulo(
            index
        );


    } catch (error) {

        mostrarError(
            error.message
        );

    }

}


// ========================================================
// LISTA DE CAPÍTULOS
// ========================================================

function mostrarListaCapitulos() {

    const container =
        document.getElementById(
            "chapterList"
        );

    container.innerHTML =
        "";


    chapters.forEach(
        function(chapter, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "chapter-button";


            button.textContent =
                "Cap. " +
                chapter.chapter_number +
                " - " +
                chapter.title;


            button.onclick =
                function() {

                    cargarCapitulo(
                        index
                    );

                };


            container.appendChild(
                button
            );

        }
    );


    document
        .getElementById("chaptersCard")
        .classList.remove(
            "hidden"
        );

}


// ========================================================
// CARGAR CAPÍTULO
// ========================================================

async function cargarCapitulo(index) {

    if (
        index < 0 ||
        index >= chapters.length
    ) {

        return;

    }


    const chapter =
        chapters[index];


    currentChapterIndex =
        index;


    document
        .getElementById("loading")
        .classList.remove(
            "hidden"
        );


    document
        .getElementById("readerCard")
        .classList.add(
            "hidden"
        );


    try {

        // -------------------------------------------------
        // OBTENER CAPÍTULO COMPLETO
        // -------------------------------------------------

        const response =
            await fetch(
                "/api/chapters/" +
                chapter.id
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo cargar el capítulo."
            );

        }


        const loadedChapter =
            data.chapter;


        // -------------------------------------------------
        // TÍTULO
        // -------------------------------------------------

        document
            .getElementById("chapterTitle")
            .textContent =
                loadedChapter.title;


        document
            .getElementById("chapterNumber")
            .textContent =
                "Capítulo " +
                loadedChapter.chapter_number;


        // -------------------------------------------------
        // TEXTO
        // -------------------------------------------------

        const content =
            document.getElementById(
                "chapterContent"
            );


        content.textContent =
            loadedChapter.content ||
            "";


        if (
            !loadedChapter.content ||
            !loadedChapter.content.trim()
        ) {

            content.classList.add(
                "hidden"
            );

        } else {

            content.classList.remove(
                "hidden"
            );

        }


        // -------------------------------------------------
        // IMÁGENES
        // -------------------------------------------------

        await cargarImagenes(
            loadedChapter.id
        );


        // -------------------------------------------------
        // BOTONES
        // -------------------------------------------------

        document
            .getElementById(
                "previousButton"
            )
            .disabled =
                currentChapterIndex <= 0;


        document
            .getElementById(
                "nextButton"
            )
            .disabled =
                currentChapterIndex >=
                chapters.length - 1;


        // -------------------------------------------------
        // CAPÍTULO ACTIVO
        // -------------------------------------------------

        const buttons =
            document.querySelectorAll(
                ".chapter-button"
            );


        buttons.forEach(
            function(button, buttonIndex) {

                if (
                    buttonIndex ===
                    currentChapterIndex
                ) {

                    button.classList.add(
                        "active"
                    );

                } else {

                    button.classList.remove(
                        "active"
                    );

                }

            }
        );


        // -------------------------------------------------
        // URL
        // -------------------------------------------------

        const newUrl =
            "leer-historieta.html?id=" +
            storyId +
            "&chapter=" +
            loadedChapter.id;


        window.history.replaceState(
            {},
            "",
            newUrl
        );


        document
            .getElementById("loading")
            .classList.add(
                "hidden"
            );


        document
            .getElementById("readerCard")
            .classList.remove(
                "hidden"
            );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        mostrarError(
            error.message
        );

    }

}


// ========================================================
// CARGAR IMÁGENES
// ========================================================

async function cargarImagenes(
    chapterId
) {

    const container =
        document.getElementById(
            "pagesContainer"
        );


    container.innerHTML =
        "";


    const response =
        await fetch(
            "/api/chapters/" +
            chapterId +
            "/images"
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "No se pudieron cargar las páginas."
        );

    }


    const images =
        data.images ||
        [];


    if (!images.length) {

        return;

    }


    images.forEach(
        function(image, index) {

            const page =
                document.createElement(
                    "div"
                );


            page.className =
                "page";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                image.image_url;


            img.alt =
                "Página " +
                (index + 1);


            img.loading =
                "lazy";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "page-name";


            name.textContent =
                "Página " +
                (index + 1);


            page.appendChild(
                img
            );


            page.appendChild(
                name
            );


            container.appendChild(
                page
            );

        }
    );

}


// ========================================================
// CAPÍTULO ANTERIOR
// ========================================================

function capituloAnterior() {

    if (
        currentChapterIndex <= 0
    ) {

        return;

    }


    cargarCapitulo(
        currentChapterIndex - 1
    );

}


// ========================================================
// CAPÍTULO SIGUIENTE
// ========================================================

function capituloSiguiente() {

    if (
        currentChapterIndex >=
        chapters.length - 1
    ) {

        return;

    }


    cargarCapitulo(
        currentChapterIndex + 1
    );

}


// ========================================================
// INICIO
// ========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        cargarHistorieta();

    }
);

</script>

</body>

</html>
