<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leer historieta - ComicWorldFiles</title><style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #181a1f;

    color: white;
}


/* ==========================================
   CABECERA
========================================== */

header {

    background: #111318;

    padding: 18px;

    text-align: center;

    border-bottom: 1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 24px;
}

.container {

    width: 94%;

    max-width: 900px;

    margin: 25px auto;
}


/* ==========================================
   TARJETAS
========================================== */

.card {

    background: #22252b;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 20px;
}

.info {

    color: #bbb;

    margin-bottom: 20px;
}

.chapter-title {

    font-size: 26px;

    margin: 0 0 5px 0;
}

.story-title {

    color: #aaa;

    font-size: 15px;
}


/* ==========================================
   CONTADOR DE VISITAS
========================================== */

.views {

    color: #aaa;

    font-size: 14px;

    margin-top: 8px;

    display: inline-block;
}


/* ==========================================
   ME GUSTA + FAVORITOS
========================================== */

.story-actions {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 20px;

    flex-wrap: wrap;
}

.like-button,
.favorite-button {

    border: 1px solid #ddd;

    background: #fff;

    color: #555;

    padding: 9px 15px;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s,
        color 0.2s,
        border-color 0.2s,
        transform 0.1s;
}

.like-button:hover,
.favorite-button:hover {

    background: #f5f5f5;

    border-color: #ccc;
}

.like-button:active,
.favorite-button:active {

    transform: scale(0.97);
}

.like-button.liked {

    background: #ffe8e8;

    border-color: #ffb5b5;

    color: #e53935;
}

.favorite-button.favorited {

    background: #fff5d6;

    border-color: #f0cf75;

    color: #b8860b;
}

.like-button:disabled,
.favorite-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}

.likes-count {

    color: #aaa;

    font-size: 14px;
}

.like-message,
.favorite-message {

    color: #aaa;

    font-size: 13px;

    display: none;
}


/* ==========================================
   LECTOR
========================================== */

.blocks {

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;
}

.block-image {

    width: 100%;

    margin: 0 0 18px 0;

    text-align: center;
}

.block-image img {

    display: block;

    width: 100%;

    height: auto;

    max-width: 900px;

    margin: 0 auto;

    border-radius: 5px;

    background: white;
}

.block-text {

    width: 100%;

    padding: 20px;

    margin: 5px 0 20px 0;

    background: #292d34;

    border-radius: 8px;

    line-height: 1.6;

    font-size: 18px;

    white-space: pre-wrap;

    word-break: break-word;
}


/* ==========================================
   BOTONES
========================================== */

button {

    border: none;

    border-radius: 7px;

    padding: 11px 17px;

    font-size: 15px;

    cursor: pointer;

    background: #444;

    color: white;

    margin: 5px;
}

button:hover {

    background: #555;
}

button.primary {

    background: #2563eb;
}

button.primary:hover {

    background: #3574ef;
}

button.success {

    background: #218838;
}

button.danger {

    background: #b52b2b;
}

button.secondary {

    background: #666;
}

button:disabled {

    background: #777;

    cursor: not-allowed;
}

.actions {

    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 15px;
}


/* ==========================================
   EDITOR
========================================== */

.editor {

    display: none;
}

.editor.active {

    display: block;
}

.editor-block {

    background: #2b2f36;

    border: 1px solid #444;

    border-radius: 8px;

    padding: 12px;

    margin-bottom: 12px;
}

.editor-block-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;

    color: #bbb;

    font-size: 14px;
}

.editor-image {

    width: 100%;

    max-height: 500px;

    object-fit: contain;

    background: white;

    border-radius: 5px;
}

.editor-text {

    width: 100%;

    min-height: 100px;

    resize: vertical;

    padding: 12px;

    border-radius: 7px;

    border: 1px solid #555;

    background: #181a1f;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 16px;
}

.add-area {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;

    padding: 15px;

    background: #191b20;

    border-radius: 8px;
}

input[type="file"] {

    width: 100%;

    padding: 10px;

    background: #181a1f;

    color: white;

    border: 1px solid #444;

    border-radius: 7px;
}

textarea {

    width: 100%;

    min-height: 100px;

    resize: vertical;

    padding: 12px;

    border-radius: 7px;

    border: 1px solid #555;

    background: #181a1f;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 16px;
}


/* ==========================================
   MENSAJES
========================================== */

.message {

    padding: 12px;

    border-radius: 7px;

    margin-top: 15px;

    display: none;
}

.error {

    background: #4a2020;

    border: 1px solid #9b4444;

    color: #ffb5b5;
}

.success-message {

    background: #203f27;

    border: 1px solid #4b8d58;

    color: #b8f0c1;
}

.loading {

    text-align: center;

    padding: 40px;

    color: #aaa;
}

.empty {

    text-align: center;

    padding: 40px;

    color: #aaa;
}


/* ==========================================
   NAVEGACIÓN
========================================== */

.back {

    display: inline-block;

    color: white;

    text-decoration: none;

    margin-bottom: 15px;

    font-weight: bold;
}

.separator {

    border: 0;

    border-top: 1px solid #444;

    margin: 25px 0;
}

.hidden {

    display: none !important;
}


/* ==========================================
   CELULAR
========================================== */

@media (max-width: 600px) {

    header {

        padding: 15px;
    }

    header h1 {

        font-size: 20px;
    }

    .container {

        width: 96%;

        margin: 18px auto;
    }

    .card {

        padding: 15px;
    }

    .chapter-title {

        font-size: 23px;
    }

    .block-text {

        padding: 15px;

        font-size: 17px;
    }

    .story-actions {

        gap: 6px;
    }

}

multiple>

<button class="primary"

     class="message">

id="saveButton"
onclick="guardarCambios()">

💾 Guardar cambios

onclick="cancelarEdicion()">

</button></div><div id="saveMessage"
     class="message">
</div></div></div><script>


// ========================================================
// VARIABLES
// ========================================================

let storyId = null;

let chapterId = null;

let chapterData = null;

let blocks = [];

let loggedUser = null;

let storyData = null;


// ========================================================
// ELEMENTOS ME GUSTA
// ========================================================

const likeButton =
    document.getElementById(
        "like-button"
    );


const likesCount =
    document.getElementById(
        "likes-count"
    );


const likeMessage =
    document.getElementById(
        "like-message"
    );


// ========================================================
// ELEMENTOS FAVORITOS
// ========================================================

const favoriteButton =
    document.getElementById(
        "favorite-button"
    );


const favoriteMessage =
    document.getElementById(
        "favorite-message"
    );


// ========================================================
// UTILIDADES
// ========================================================

function mostrarMensaje(
    id,
    mensaje,
    tipo
) {

    const element =
        document.getElementById(
            id
        );


    element.textContent =
        mensaje;


    element.className =
        "message " +
        tipo;


    element.style.display =
        "block";

}


function ocultarMensaje(id) {

    const element =
        document.getElementById(
            id
        );


    element.style.display =
        "none";


    element.textContent =
        "";

}


// ========================================================
// OBTENER PARÁMETROS
// ========================================================

function obtenerParametros() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    storyId =
        Number(
            params.get("id")
        );


    chapterId =
        Number(
            params.get("chapter")
        );


    if (!chapterId) {

        chapterId =
            Number(
                params.get("capitulo")
            );

    }

}


// ========================================================
// SESIÓN
// ========================================================

async function comprobarSesion() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            return null;

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.loggedIn
        ) {

            return null;

        }


        return data.user;


    } catch (error) {

        console.error(
            "Error comprobando sesión:",
            error
        );


        return null;

    }

}


// ========================================================
// REGISTRAR VISITA
// 1 VISITA CADA 24 HORAS POR NAVEGADOR
// ========================================================

async function registrarVisita() {

    if (!storyId) {

        return;

    }


    const clave =
        "comicworldfiles_view_" +
        storyId;


    const ahora =
        Date.now();


    const ultimaVisita =
        localStorage.getItem(
            clave
        );


    const periodo =
        24 *
        60 *
        60 *
        1000;


    if (
        ultimaVisita &&
        (ahora - Number(ultimaVisita)) <
        periodo
    ) {

        console.log(
            "Visita ya registrada durante las últimas 24 horas."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/view",
                {
                    method: "POST",

                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.success
        ) {

            localStorage.setItem(
                clave,
                String(ahora)
            );


            actualizarContador(
                data.views
            );


        } else if (
            storyData &&
            storyData.views !== undefined
        ) {

            actualizarContador(
                storyData.views
            );

        }


    } catch (error) {

        console.error(
            "Error registrando visita:",
            error
        );


        if (
            storyData &&
            storyData.views !== undefined
        ) {

            actualizarContador(
                storyData.views
            );

        }

    }

}


// ========================================================
// ACTUALIZAR CONTADOR
// ========================================================

function actualizarContador(
    views
) {

    const element =
        document.getElementById(
            "views"
        );


    if (!element) {

        return;

    }


    const cantidad =
        Number(
            views || 0
        );


    element.textContent =
        cantidad === 1
            ? "👁 1 visita"
            : "👁 " +
              cantidad +
              " visitas";

}


// ========================================================
// CARGAR ME GUSTA
// ========================================================

async function cargarMeGusta() {

    if (!storyId) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/like",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const texto =
            await response.text();


        console.log(
            "Respuesta Me gusta:",
            response.status,
            texto
        );


        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        } catch (parseError) {

            console.error(
                "La respuesta de Me gusta no es JSON válido."
            );

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            console.error(
                "No se pudo consultar el Me gusta."
            );

            return;

        }


        actualizarMeGusta(
            data.liked,
            data.likes
        );


    } catch (error) {

        console.error(
            "Error cargando Me gusta:",
            error
        );

    }

}


// ========================================================
// ALTERNAR ME GUSTA
// ========================================================

async function alternarMeGusta() {

    if (!storyId) {

        return;

    }


    if (
        likeButton.disabled
    ) {

        return;

    }


    likeButton.disabled =
        true;


    likeMessage.style.display =
        "none";


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/like",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const texto =
            await response.text();


        console.log(
            "Respuesta alternar Me gusta:",
            response.status,
            texto
        );


        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        } catch (parseError) {

            throw new Error(
                "El servidor no devolvió una respuesta válida."
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            if (
                response.status === 401
            ) {

                likeMessage.textContent =
                    data.error ||
                    "Debes iniciar sesión para dar Me gusta.";

            } else {

                likeMessage.textContent =
                    data.error ||
                    "No se pudo procesar el Me gusta.";

            }


            likeMessage.style.display =
                "inline";


            return;

        }


        actualizarMeGusta(
            data.liked,
            data.likes
        );


    } catch (error) {

        console.error(
            "Error alternando Me gusta:",
            error
        );


        likeMessage.textContent =
            error.message ||
            "No se pudo conectar con el servidor.";


        likeMessage.style.display =
            "inline";


    } finally {

        likeButton.disabled =
            false;

    }

}


// ========================================================
// ACTUALIZAR ME GUSTA
// ========================================================

function actualizarMeGusta(
    liked,
    likes
) {

    const cantidad =
        Number(
            likes || 0
        );


    if (
        liked
    ) {

        likeButton.classList.add(
            "liked"
        );


        likeButton.textContent =
            "❤️ Te gusta";


    } else {

        likeButton.classList.remove(
            "liked"
        );


        likeButton.textContent =
            "🤍 Me gusta";

    }


    likesCount.textContent =
        cantidad === 1
            ? "1 Me gusta"
            : cantidad +
              " Me gusta";

}


// ========================================================
// EVENTO ME GUSTA
// ========================================================

likeButton.addEventListener(
    "click",
    alternarMeGusta
);


// ========================================================
// FAVORITOS
// ========================================================

/*
 * Consultar si la historieta está
 * actualmente en favoritos.
 */

async function cargarFavorito() {

    if (!storyId) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/favorite",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const texto =
            await response.text();


        console.log(
            "Respuesta Favorito:",
            response.status,
            texto
        );


        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        } catch (parseError) {

            console.error(
                "La respuesta de Favorito no es JSON válido."
            );

            return;

        }


        /*
         * Si no hay sesión,
         * el botón queda en estado normal.
         */

        if (
            response.status === 401
        ) {

            actualizarFavorito(
                false
            );

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            console.error(
                "No se pudo consultar el Favorito."
            );

            return;

        }


        actualizarFavorito(
            data.favorited
        );


    } catch (error) {

        console.error(
            "Error cargando Favorito:",
            error
        );

    }

}


/*
 * Agregar o quitar la historieta
 * de favoritos.
 */

async function alternarFavorito() {

    if (!storyId) {

        return;

    }


    if (
        favoriteButton.disabled
    ) {

        return;

    }


    favoriteButton.disabled =
        true;


    favoriteMessage.style.display =
        "none";


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/favorite",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const texto =
            await response.text();


        console.log(
            "Respuesta alternar Favorito:",
            response.status,
            texto
        );


        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        } catch (parseError) {

            throw new Error(
                "El servidor no devolvió una respuesta válida."
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            if (
                response.status === 401
            ) {

                favoriteMessage.textContent =
                    data.error ||
                    "Debes iniciar sesión para guardar favoritos.";

            } else {

                favoriteMessage.textContent =
                    data.error ||
                    "No se pudo procesar el favorito.";

            }


            favoriteMessage.style.display =
                "inline";


            return;

        }


        actualizarFavorito(
            data.favorited
        );


    } catch (error) {

        console.error(
            "Error alternando Favorito:",
            error
        );


        favoriteMessage.textContent =
            error.message ||
            "No se pudo conectar con el servidor.";


        favoriteMessage.style.display =
            "inline";


    } finally {

        favoriteButton.disabled =
            false;

    }

}


/*
 * Actualizar visualmente el botón
 * de Favoritos.
 */

function actualizarFavorito(
    favorited
) {

    if (
        favorited
    ) {

        favoriteButton.classList.add(
            "favorited"
        );


        favoriteButton.textContent =
            "★ En favoritos";


    } else {

        favoriteButton.classList.remove(
            "favorited"
        );


        favoriteButton.textContent =
            "☆ Agregar a favoritos";

    }

}


// ========================================================
// EVENTO FAVORITOS
// ========================================================

favoriteButton.addEventListener(
    "click",
    alternarFavorito
);


// ========================================================
// CARGAR HISTORIETA
// ========================================================

async function cargarHistorieta() {

    if (!storyId) {

        mostrarError(
            "No se indicó qué historieta quieres leer."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ),
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo cargar la historieta."
            );

        }


        if (
            !data.success ||
            !data.story
        ) {

            throw new Error(
                data.error ||
                "No se pudo cargar la historieta."
            );

        }


        storyData =
            data.story;


        document.getElementById(
            "storyTitle"
        ).textContent =
            storyData.title ||
            "Historieta";


        if (
            storyData.views !== undefined
        ) {

            actualizarContador(
                storyData.views
            );

        }


        /*
         * Registrar visita.
         */

        registrarVisita();


        /*
         * Cargar estado del Me gusta.
         */

        cargarMeGusta();


        /*
         * Cargar estado de Favoritos.
         */

        cargarFavorito();


        /*
         * Comprobar propietario.
         */

        comprobarPropietario();


        /*
         * Si no se indicó capítulo,
         * buscamos el primero.
         */

        if (!chapterId) {

            await buscarPrimerCapitulo();

            return;

        }


        await cargarCapitulo();


    } catch (error) {

        mostrarError(
            error.message ||
            "No se pudo cargar la historieta."
        );

    }

}


// ========================================================
// BUSCAR PRIMER CAPÍTULO
// ========================================================

async function buscarPrimerCapitulo() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/chapters",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudieron cargar los capítulos."
            );

        }


        const chapters =
            data.chapters ||
            [];


        if (!chapters.length) {

            throw new Error(
                "Esta historieta todavía no tiene capítulos."
            );

        }


        chapterId =
            Number(
                chapters[0].id
            );


        await cargarCapitulo();


    } catch (error) {

        mostrarError(
            error.message
        );

    }

}


// ========================================================
// CARGAR CAPÍTULO
// ========================================================

async function cargarCapitulo() {

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "block";


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                encodeURIComponent(
                    chapterId
                ),
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo cargar el capítulo."
            );

        }


        if (
            !data.success ||
            !data.chapter
        ) {

            throw new Error(
                data.error ||
                "No se pudo cargar el capítulo."
            );

        }


        chapterData =
            data.chapter;


        document.getElementById(
            "chapterTitle"
        ).textContent =
            chapterData.title ||
            "Sin título";


        document.getElementById(
            "chapterNumber"
        ).textContent =
            "Capítulo " +
            chapterData.chapter_number;


        cargarBloques(
            chapterData.content
        );


        loading.style.display =
            "none";


        comprobarPropietario();


    } catch (error) {

        loading.style.display =
            "none";


        mostrarError(
            error.message
        );

    }

}


// ========================================================
// CARGAR BLOQUES
// ========================================================

function cargarBloques(
    content
) {

    blocks = [];

    try {

        /*
         * El creador de historietas guarda
         * directamente un ARRAY de bloques.
         *
         * Ejemplo:
         *
         * [
         *   {
         *      type: "image",
         *      image_id: 1,
         *      image_url: "..."
         *   },
         *   {
         *      type: "text",
         *      content: "Texto..."
         *   }
         * ]
         *
         * También aceptamos el formato antiguo:
         *
         * {
         *      blocks: [...]
         * }
         */

        if (
            Array.isArray(content)
        ) {

            blocks =
                content;

        }

        else if (
            typeof content === "string"
        ) {

            const parsed =
                JSON.parse(
                    content
                );

            /*
             * Formato actual:
             * JSON.stringify(array)
             */

            if (
                Array.isArray(parsed)
            ) {

                blocks =
                    parsed;

            }

            /*
             * Formato anterior:
             * JSON.stringify({ blocks: [...] })
             */

            else if (
                parsed &&
                Array.isArray(
                    parsed.blocks
                )
            ) {

                blocks =
                    parsed.blocks;

            }

        }

        /*
         * Si por alguna razón content
         * llega como objeto.
         */

        else if (
            content &&
            Array.isArray(
                content.blocks
            )
        ) {

            blocks =
                content.blocks;

        }

    } catch (error) {

        console.error(
            "Error leyendo bloques:",
            error
        );

        blocks = [];

    }

    mostrarBloques();

}

// ========================================================
// MOSTRAR BLOQUES
// ========================================================

function mostrarBloques() {

    const container =
        document.getElementById(
            "blocks"
        );


    container.innerHTML =
        "";


    if (!blocks.length) {

        container.innerHTML =
            "<div class='empty'>" +
            "Este capítulo todavía no tiene contenido." +
            "</div>";

        return;

    }


    blocks.forEach(
        function(block) {

            if (
                block.type === "image"
            ) {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "block-image";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    block.image_url;


                img.alt =
                    block.filename ||
                    "Página del cómic";


                img.loading =
                    "lazy";


                wrapper.appendChild(
                    img
                );


                container.appendChild(
                    wrapper
                );

            }


            else if (
                block.type === "text"
            ) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "block-text";


                text.textContent =
    block.content ||
    block.text ||
    "";


                container.appendChild(
                    text
                );

            }

        }
    );

}


// ========================================================
// COMPROBAR PROPIETARIO
// ========================================================

function comprobarPropietario() {

    const editButton =
        document.getElementById(
            "editButton"
        );


    if (
        !editButton
    ) {

        return;

    }


    editButton.classList.add(
        "hidden"
    );


    if (
        !loggedUser ||
        !storyData
    ) {

        return;

    }


    if (
        Number(
            loggedUser.id
        ) ===
        Number(
            storyData.user_id
        )
    ) {

        editButton.classList.remove(
            "hidden"
        );

    }

}


// ========================================================
// ACTIVAR EDICIÓN
// ========================================================

function activarEdicion() {

    if (
        !loggedUser ||
        !storyData ||
        Number(loggedUser.id) !==
        Number(storyData.user_id)
    ) {

        alert(
            "No tienes permiso para editar este capítulo."
        );

        return;

    }


    document.getElementById(
        "editorCard"
    ).classList.add(
        "active"
    );


    renderEditor();


    document.getElementById(
        "editorCard"
    ).scrollIntoView({
        behavior:
            "smooth"
    });

}


// ========================================================
// CANCELAR EDICIÓN
// ========================================================

function cancelarEdicion() {

    document.getElementById(
        "editorCard"
    ).classList.remove(
        "active"
    );


    ocultarMensaje(
        "saveMessage"
    );


    ocultarMensaje(
        "uploadMessage"
    );


    cargarCapitulo();

}


// ========================================================
// RENDERIZAR EDITOR
// ========================================================

function renderEditor() {

    const container =
        document.getElementById(
            "editorBlocks"
        );


    container.innerHTML =
        "";


    if (!blocks.length) {

        container.innerHTML =
            "<div class='empty'>" +
            "Todavía no hay bloques." +
            "</div>";

        return;

    }


    blocks.forEach(
        function(block, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "editor-block";


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "editor-block-header";


            const number =
                document.createElement(
                    "span"
                );


            number.textContent =
                "Bloque " +
                (index + 1) +
                " — " +
                block.type;


            header.appendChild(
                number
            );


            const removeButton =
                document.createElement(
                    "button"
                );


            removeButton.className =
                "danger";


            removeButton.textContent =
                "Eliminar";


            removeButton.onclick =
                function() {

                    eliminarBloque(
                        index
                    );

                };


            header.appendChild(
                removeButton
            );


            item.appendChild(
                header
            );


            if (
                block.type === "image"
            ) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "editor-image";


                img.src =
                    block.image_url;


                img.alt =
                    block.filename ||
                    "Imagen";


                item.appendChild(
                    img
                );

            }


            else if (
                block.type === "text"
            ) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.className =
                    "editor-text";


                textarea.value =
                    block.text ||
                    "";


                textarea.oninput =
                    function() {

                        blocks[index].text =
                            textarea.value;

                    };


                item.appendChild(
                    textarea
                );

            }


            container.appendChild(
                item
            );

        }
    );

}


// ========================================================
// ELIMINAR BLOQUE
// ========================================================

function eliminarBloque(
    index
) {

    if (
        !confirm(
            "¿Eliminar este bloque?"
        )
    ) {

        return;

    }


    blocks.splice(
        index,
        1
    );


    renderEditor();

}


// ========================================================
// AGREGAR TEXTO
// ========================================================

function agregarTexto() {

    const textarea =
        document.getElementById(
            "newText"
        );


    const text =
        textarea.value.trim();


    if (!text) {

        alert(
            "Escribe algún texto."
        );

        return;

    }


    blocks.push({

        type:
            "text",

        text:
            text

    });


    textarea.value =
        "";


    renderEditor();


    setTimeout(
        function() {

            const container =
                document.getElementById(
                    "editorBlocks"
                );


            if (
                container.lastElementChild
            ) {

                container.lastElementChild
                    .scrollIntoView({
                        behavior:
                            "smooth"
                    });

            }

        },
        100
    );

}


// ========================================================
// SUBIR NUEVAS IMÁGENES
// ========================================================

async function subirNuevasImagenes() {

    if (!chapterId) {

        return;

    }


    const input =
        document.getElementById(
            "newImages"
        );


    const files =
        Array.from(
            input.files
        );


    if (!files.length) {

        mostrarMensaje(
            "uploadMessage",
            "Selecciona al menos una imagen.",
            "error"
        );

        return;

    }


    const maxSize =
        10 *
        1024 *
        1024;


    for (
        const file of files
    ) {

        if (
            file.size > maxSize
        ) {

            mostrarMensaje(
                "uploadMessage",
                file.name +
                " supera los 10 MB.",
                "error"
            );

            return;

        }

    }


    const button =
        document.getElementById(
            "uploadButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Subiendo...";


    ocultarMensaje(
        "uploadMessage"
    );


    try {

        let uploaded =
            0;


        for (
            const file of files
        ) {

            const formData =
                new FormData();


            formData.append(
                "image",
                file
            );


            const response =
                await fetch(
                    "/api/chapters/" +
                    encodeURIComponent(
                        chapterId
                    ) +
                    "/images",
                    {
                        method: "POST",

                        credentials:
                            "include",

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "No se pudo subir " +
                    file.name
                );

            }


            if (
                !data.success ||
                !data.image
            ) {

                throw new Error(
                    data.error ||
                    "Respuesta inválida del servidor."
                );

            }


            blocks.push({

                type:
                    "image",

                image_id:
                    data.image.id,

                image_url:
                    data.image.image_url,

                filename:
                    data.image.filename

            });


            uploaded++;

        }


        input.value =
            "";


        renderEditor();


        mostrarMensaje(
            "uploadMessage",
            uploaded +
            " imagen(es) agregada(s) al capítulo. Ahora pulsa «Guardar cambios».",
            "success-message"
        );


    } catch (error) {

        mostrarMensaje(
            "uploadMessage",
            error.message,
            "error"
        );

    }


    button.disabled =
        false;


    button.textContent =
        "+ Subir imágenes";

}


// ========================================================
// GUARDAR CAMBIOS
// ========================================================

async function guardarCambios() {

    if (!chapterId) {

        return;

    }


    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Guardando...";


    ocultarMensaje(
        "saveMessage"
    );


    try {

        const content =
            JSON.stringify({

                version:
                    1,

                blocks:
                    blocks

            });


        const response =
            await fetch(
                "/api/chapters/" +
                encodeURIComponent(
                    chapterId
                ),
                {
                    method: "PUT",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            title:
                                chapterData.title,

                            content:
                                content

                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudieron guardar los cambios."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "No se pudieron guardar los cambios."
            );

        }


        chapterData.content =
            content;


        mostrarBloques();


        mostrarMensaje(
            "saveMessage",
            "Cambios guardados correctamente.",
            "success-message"
        );


        setTimeout(
            function() {

                document.getElementById(
                    "editorCard"
                ).classList.remove(
                    "active"
                );

            },
            1200
        );


    } catch (error) {

        mostrarMensaje(
            "saveMessage",
            error.message,
            "error"
        );

    }


    button.disabled =
        false;


    button.textContent =
        "💾 Guardar cambios";

}


// ========================================================
// ERROR PRINCIPAL
// ========================================================

function mostrarError(
    mensaje
) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const blocksContainer =
        document.getElementById(
            "blocks"
        );


    blocksContainer.innerHTML =
        "";


    mostrarMensaje(
        "readerError",
        mensaje,
        "error"
    );

}


// ========================================================
// INICIO
// ========================================================

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        obtenerParametros();


        loggedUser =
            await comprobarSesion();


        await cargarHistorieta();

    }
);
