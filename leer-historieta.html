/* ==========================================

* {

body {

/* ==========================================

header {

/* ==========================================
   INFORMACIÓN DE LA HISTORIETA

.story {

    background: white;

    border-radius: 12px;

.reader-controls {

/* ==========================================

.back-button {

footer {

/* ==========================================

@media (max-width: 600px) {

    .header-content {

    }

    .description {

        font-size: 16px;
    }

    .story-cover {

    .reader {

        border-radius: 0;

        padding: 20px 0;
    }

    .reader-header {

        padding: 0 15px;
    }

    .reader h2 {

        font-size: 23px;
    }

    .reader-content {

        padding: 0 15px;

        font-size: 17px;

        line-height: 1.8;
    }

    .comic-pages {

        width: 100%;

        gap: 8px;
    }

    .comic-page {

        width: 100%;

}


/* ==========================================
   MODO PANTALLA COMPLETA DE IMAGEN
========================================== */

.image-modal {

    display: none;

}

.image-modal img {

    position: fixed;

    top: 15px;

    right: 20px;

    color: white;

    font-size: 32px;

    cursor: pointer;

    z-index: 101;
}

/* ==========================================
   OBTENER ID DE HISTORIA
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    params.get("id");


/* ==========================================
   ELEMENTOS
========================================== */

const loading =
    document.getElementById(
        "loading"
    );

const story =
    document.getElementById(
        "story"
    );

const error =
    document.getElementById(
        "error"
    );

const errorMessage =
    document.getElementById(
        "error-message"
    );

const chaptersContainer =
    document.getElementById(
        "chapters-container"
    );

const editButton =
    document.getElementById(
        "edit-button"
    );

const reader =
    document.getElementById(
        "reader"
    );

const readerTitle =
    document.getElementById(
        "reader-title"
    );

const readerChapterNumber =
    document.getElementById(
        "reader-chapter-number"
    );

const readerContent =
    document.getElementById(
        "reader-content"
    );

const comicPages =
    document.getElementById(
        "comic-pages"
    );

const previousButton =
    document.getElementById(
        "previous-button"
    );

const nextButton =
    document.getElementById(
        "next-button"
    );


/* ==========================================
   VARIABLES
========================================== */

let chapters = [];

let currentChapterIndex = -1;


/* ==========================================
   INICIAR
========================================== */

if (!storyId) {

    mostrarError(
        "No se indicó qué historieta quieres leer."
    );

} else {

    iniciarPagina(
        storyId
    );

}


/* ==========================================
   INICIAR PÁGINA
========================================== */

async function iniciarPagina(id) {

    const historiaCorrecta =
        await cargarHistoria(
            id
        );


    if (!historiaCorrecta) {

        return;

    }


    await cargarCapitulos(
        id
    );

}


/* ==========================================
   CARGAR HISTORIA
========================================== */

async function cargarHistoria(id) {

    try {

        console.log(
            "Cargando historieta:",
            id
        );


        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    id
                ),
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const texto =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        } catch (parseError) {

            throw new Error(
                "El servidor no devolvió JSON. Código HTTP: " +
                response.status
            );

        }


        if (
            !response.ok ||
            !data.success ||
            !data.story
        ) {

            throw new Error(
                data.error ||
                "No se pudo cargar la historieta."
            );

        }


        mostrarHistoria(
            data.story
        );


        await comprobarAutor(
            data.story.user_id
        );


        return true;


    } catch (err) {

        console.error(
            "Error cargando historieta:",
            err
        );


        mostrarError(
            err.message ||
            "No se pudo cargar la historieta."
        );


        return false;

    }

}


/* ==========================================
   MOSTRAR HISTORIA
========================================== */

function mostrarHistoria(data) {

    document.getElementById(
        "story-title"
    ).textContent =
        data.title || "";


    document.getElementById(
        "story-author"
    ).textContent =
        data.author || "Autor";


    document.getElementById(
        "story-genre"
    ).textContent =
        data.genre || "";


    document.getElementById(
        "story-description"
    ).textContent =
        data.description || "";


    const coverContainer =
        document.getElementById(
            "story-cover"
        );


    const coverImage =
        document.getElementById(
            "story-cover-image"
        );


    if (
        data.cover_url
    ) {

        coverImage.src =
            data.cover_url;


        coverImage.onerror =
            function() {

                coverContainer.style.display =
                    "none";

            };


        coverContainer.style.display =
            "block";

    } else {

        coverContainer.style.display =
            "none";

    }


    loading.style.display =
        "none";


    story.style.display =
        "block";

}


/* ==========================================
   COMPROBAR AUTOR
========================================== */

async function comprobarAutor(
    storyUserId
) {

    editButton.style.display =
        "none";


    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            return;

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.loggedIn ||
            !data.user
        ) {

            return;

        }


        if (
            Number(data.user.id) ===
            Number(storyUserId)
        ) {

            editButton.href =
                "editar-historia.html?id=" +
                encodeURIComponent(
                    storyId
                );


            editButton.style.display =
                "inline-block";

        }


    } catch (error) {

        console.error(
            "Error comprobando autor:",
            error
        );

    }

}


/* ==========================================
   CARGAR CAPÍTULOS
========================================== */

async function cargarCapitulos(id) {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    id
                ) +
                "/chapters",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "No se pudieron cargar los capítulos."
            );

        }


        chapters =
            Array.isArray(
                data.chapters
            )
                ? data.chapters
                : [];


        if (
            chapters.length === 0
        ) {

            chaptersContainer.innerHTML =
                "<p>Aún no hay capítulos publicados.</p>";

            return;

        }


        chaptersContainer.innerHTML =
            "";


        chapters.forEach(
            function(chapter, index) {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "chapter";


                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "chapter-number";


                number.textContent =
                    "CAPÍTULO " +
                    chapter.chapter_number;


                const title =
                    document.createElement(
                        "h3"
                    );


                title.className =
                    "chapter-title";


                title.textContent =
                    chapter.title || "";


                const button =
                    document.createElement(
                        "a"
                    );


                button.className =
                    "chapter-button";


                button.href =
                    "#";


                button.textContent =
                    "Leer capítulo";


                button.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();


                        openChapter(
                            chapter.id,
                            index
                        );

                    }
                );


                element.appendChild(
                    number
                );

                element.appendChild(
                    title
                );

                element.appendChild(
                    button
                );


                chaptersContainer.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando capítulos:",
            error
        );


        chaptersContainer.innerHTML =
            "<p>Error cargando capítulos.</p>";

    }

}


/* ==========================================
   ABRIR CAPÍTULO
========================================== */

async function openChapter(
    chapterId,
    chapterIndex
) {

    try {

        currentChapterIndex =
            chapterIndex;


        readerTitle.textContent =
            "Cargando...";


        readerChapterNumber.textContent =
            "";


        readerContent.textContent =
            "";


        comicPages.innerHTML =
            '<div class="images-loading">Cargando páginas...</div>';


        story.style.display =
            "none";


        reader.style.display =
            "block";


        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );


        const response =
            await fetch(
                "/api/chapters/" +
                encodeURIComponent(
                    chapterId
                ),
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.chapter
        ) {

            throw new Error(
                data.error ||
                "No se pudo abrir el capítulo."
            );

        }


        const chapter =
            data.chapter;


        readerTitle.textContent =
            chapter.title || "";


        readerChapterNumber.textContent =
            "CAPÍTULO " +
            chapter.chapter_number;


        /*
         * Si el capítulo tiene texto,
         * también lo mostramos.
         */

        readerContent.textContent =
            chapter.content || "";


        await cargarImagenesCapitulo(
            chapter.id
        );


        actualizarBotones();


        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );


    } catch (error) {

        console.error(
            "Error abriendo capítulo:",
            error
        );


        alert(
            error.message ||
            "No se pudo abrir el capítulo."
        );

    }

}


/* ==========================================
   CARGAR IMÁGENES DEL CAPÍTULO
========================================== */

async function cargarImagenesCapitulo(
    chapterId
) {

    try {

        const response =
            await fetch(
                "/api/chapters/" +
                encodeURIComponent(
                    chapterId
                ) +
                "/images",
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "No se pudieron cargar las páginas."
            );

        }


        const images =
            Array.isArray(
                data.images
            )
                ? data.images
                : [];


        comicPages.innerHTML =
            "";


        if (
            images.length === 0
        ) {

            comicPages.innerHTML =
                '<div class="no-images">Este capítulo no contiene páginas de historieta.</div>';

            return;

        }


        images.forEach(
            function(image) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "comic-page";


                img.src =
                    image.image_url;


                img.alt =
                    image.filename ||
                    "Página de historieta";


                img.loading =
                    "lazy";


                img.addEventListener(
                    "click",
                    function() {

                        openImageModal(
                            image.image_url
                        );

                    }
                );


                img.style.cursor =
                    "zoom-in";


                img.onerror =
                    function() {

                        console.error(
                            "No se pudo cargar:",
                            image.image_url
                        );

                        img.remove();

                    };


                comicPages.appendChild(
                    img
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando imágenes:",
            error
        );


        comicPages.innerHTML =
            '<div class="no-images">No se pudieron cargar las páginas de este capítulo.</div>';

    }

}


/* ==========================================
   BOTONES DE NAVEGACIÓN
========================================== */

function actualizarBotones() {

    if (
        currentChapterIndex <= 0
    ) {

        previousButton.style.display =
            "none";

    } else {

        previousButton.style.display =
            "inline-block";

    }


    if (
        currentChapterIndex >=
        chapters.length - 1
    ) {

        nextButton.style.display =
            "none";

    } else {

        nextButton.style.display =
            "inline-block";

    }

}


/* ==========================================
   CAPÍTULO ANTERIOR
========================================== */

function previousChapter() {

    if (
        currentChapterIndex <= 0
    ) {

        return;

    }


    const previousIndex =
        currentChapterIndex - 1;


    const chapter =
        chapters[
            previousIndex
        ];


    if (!chapter) {

        return;

    }


    openChapter(
        chapter.id,
        previousIndex
    );

}


/* ==========================================
   CAPÍTULO SIGUIENTE
========================================== */

function nextChapter() {

    if (
        currentChapterIndex >=
        chapters.length - 1
    ) {

        return;

    }


    const nextIndex =
        currentChapterIndex + 1;


    const chapter =
        chapters[
            nextIndex
        ];


    if (!chapter) {

        return;

    }


    openChapter(
        chapter.id,
        nextIndex
    );

}


/* ==========================================
   CERRAR LECTOR
========================================== */

function closeReader() {

    reader.style.display =
        "none";


    story.style.display =
        "block";


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* ==========================================
   MODAL DE IMAGEN
========================================== */

function openImageModal(
    imageUrl
) {

    const modal =
        document.getElementById(
            "image-modal"
        );

    const image =
        document.getElementById(
            "modal-image"
        );


    image.src =
        imageUrl;


    modal.style.display =
        "flex";

}


function closeImageModal() {

    const modal =
        document.getElementById(
            "image-modal"
        );


    modal.style.display =
        "none";

}


/* ==========================================
   ESC PARA CERRAR IMAGEN
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeImageModal();

        }

    }
);


/* ==========================================
   MOSTRAR ERROR
========================================== */

function mostrarError(
    message
) {

    loading.style.display =
        "none";


    story.style.display =
        "none";


    reader.style.display =
        "none";


    errorMessage.textContent =
        message;


    error.style.display =
        "block";

}

</script></body></html>
