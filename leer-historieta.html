<style>

/* ==========================================
   GENERAL
========================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #111;

    color: #222;
}


/* ==========================================
   CABECERA
========================================== */

header {

    background: #20242b;

    color: white;

    padding: 15px 20px;

    position: sticky;

    top: 0;

    z-index: 10;
}

.header-content {

    max-width: 1000px;

    display: flex;

    gap: 20px;
}

.logo {

    font-size: 24px;

    font-weight: bold;
}

nav {

    display: flex;

    gap: 15px;
}

nav a {

    color: white;

    text-decoration: none;

    font-size: 14px;
}

nav a:hover {

    text-decoration: underline;
}


/* ==========================================
   CONTENEDOR
========================================== */

.container {

    max-width: 1000px;

    margin: auto;

    padding: 25px 15px;
}


/* ==========================================
   HISTORIETA
========================================== */

.comic {

    background: white;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 2px 15px rgba(0,0,0,0.35);
}


/* ==========================================
   INFORMACIÓN
========================================== */

.story-info {

    padding: 25px;

.story-author {

}

.story-description {

    line-height: 1.6;
}

   PORTADA
========================================== */

.cover {

    text-align: center;

    padding: 25px;

    background: #f2f2f2;

    display: none;
}

.cover img {

    max-width: 400px;

    width: 100%;

    height: auto;

    display: block;

    margin: auto;

    border-radius: 8px;
}


/* ==========================================
   LISTA DE CAPÍTULOS
========================================== */

.chapters {

    padding: 25px;
}

.chapters h2 {

    margin-top: 0;
}

.chapter {

    background: #f5f5f5;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 18px;

    margin-bottom: 12px;
}

.chapter-number {

    color: #ff6b35;

    font-size: 12px;

    font-weight: bold;
}

.chapter-title {

    margin: 5px 0 12px 0;

    font-size: 19px;
}

.chapter-button {

    display: inline-block;

    background: #20242b;

    color: white;

    text-decoration: none;

    padding: 9px 15px;

    border-radius: 6px;

    font-size: 13px;
}

.chapter-button:hover {

    background: #343a40;
}


/* ==========================================
   LECTOR
========================================== */

.reader {

    display: none;

    background: #181a1f;

    color: white;

    padding: 25px 15px 35px 15px;
}

.reader-header {

    max-width: 900px;

    margin: auto;

    padding-bottom: 20px;
}

.reader-title {

    margin: 0;

    font-size: 28px;

    color: white;
}


/* ==========================================
   CONTENIDO DEL CAPÍTULO
========================================== */

.chapter-content {

    max-width: 900px;

    margin: auto;

    color: #f1f1f1;

    font-size: 18px;

    line-height: 1.8;

    overflow-wrap: break-word;
}


/* ==========================================
   TEXTO
========================================== */

.text-content {

    white-space: pre-wrap;

    margin-bottom: 25px;
}


/* ==========================================
   IMÁGENES
========================================== */

.comic-image {

    display: block;

    width: 100%;

    max-width: 900px;

    height: auto;

    margin: 0 auto 25px auto;

    border-radius: 4px;

    background: #222;
}


/* ==========================================
   MENSAJE
========================================== */

.reader-message {

    text-align: center;

    padding: 40px 20px;

    color: #aaa;
}


/* ==========================================
   BOTONES
========================================== */

.reader-buttons {

    max-width: 900px;

    margin: 30px auto 0 auto;

    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.reader-button {

    border: none;

    background: #333842;

    color: white;

    padding: 11px 16px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;
}

.reader-button:hover {

    background: #454b57;
}


/* ==========================================
   LOADING
========================================== */

.loading {

    text-align: center;

    padding: 60px 20px;

    color: #aaa;
}


/* ==========================================
   ERROR
========================================== */

.error {

    background: white;

    border-radius: 10px;

    padding: 30px;

    text-align: center;

    color: #c0392b;
}

.back-button {

    display: inline-block;

    margin-top: 20px;

    padding: 11px 18px;

    background: #20242b;

    color: white;

    text-decoration: none;

    border-radius: 7px;
}


/* ==========================================
   CELULAR
========================================== */

@media (max-width: 600px) {

    .header-content {

        flex-direction: column;

        align-items: flex-start;
    }

    nav {

        width: 100%;

        justify-content: space-between;
    }

    .container {

        padding: 0;
    }

    .comic {

        border-radius: 0;
    }

    .story-info {

        padding: 20px;
    }

    .story-title {

        font-size: 25px;
    }

    .chapters {

        padding: 20px;
    }

    .reader {

        padding: 20px 8px 30px 8px;
    }

    .reader-title {

        font-size: 22px;
    }

    .chapter-content {

        font-size: 17px;

        line-height: 1.7;
    }

    .comic-image {

        border-radius: 0;

        margin-bottom: 15px;
    }

    .reader-buttons {

        padding: 0 8px;
    }

}

<section class="story-info">

<h1 id="story-title"

<script>


/* ==========================================
   ID DE HISTORIA
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");


/* ==========================================
   ELEMENTOS
========================================== */

const loading =
    document.getElementById(
        "loading"
    );

const error =
    document.getElementById(
        "error"
    );

const errorMessage =
    document.getElementById(
        "error-message"
    );

const comic =
    document.getElementById(
        "comic"
    );

const chaptersContainer =
    document.getElementById(
        "chapters-container"
    );

const reader =
    document.getElementById(
        "reader"
    );

const chapterContent =
    document.getElementById(
        "chapter-content"
    );

const chaptersSection =
    document.getElementById(
        "chapters"
    );


/* ==========================================
   VARIABLES
========================================== */

let chapters = [];

let currentChapterIndex = -1;


/* ==========================================
   INICIAR
========================================== */

if (!storyId) {

    mostrarError(
        "No se indicó qué historieta quieres leer."
    );

} else {

    iniciar();

}


/* ==========================================
   INICIAR
========================================== */

async function iniciar() {

    try {

        await cargarHistoria();

        await cargarCapitulos();

    } catch (error) {

        console.error(
            "Error iniciando:",
            error
        );

        mostrarError(
            error.message ||
            "No se pudo cargar la historieta."
        );

    }

}


/* ==========================================
   CARGAR HISTORIA
========================================== */

async function cargarHistoria() {

    const response =
        await fetch(
            "/api/stories/" +
            encodeURIComponent(
                storyId
            ),
            {
                method: "GET",

                credentials:
                    "include",

                cache:
                    "no-store"
            }
        );


    const texto =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(
                texto
            );

    } catch (error) {

        throw new Error(
            "El servidor no devolvió JSON."
        );

    }


    if (
        !response.ok ||
        !data.success ||
        !data.story
    ) {

        throw new Error(
            data.error ||
            "No se pudo cargar la historieta."
        );

    }


    const historia =
        data.story;


    document.getElementById(
        "story-title"
    ).textContent =
        historia.title || "";


    document.getElementById(
        "story-author"
    ).textContent =
        historia.author || "Autor";


    document.getElementById(
        "story-description"
    ).textContent =
        historia.description || "";


    /* ======================================
       PORTADA
    ====================================== */

    if (
        historia.cover_url
    ) {

        const cover =
            document.getElementById(
                "cover"
            );

        const image =
            document.getElementById(
                "cover-image"
            );


        image.src =
            historia.cover_url;


        image.onerror =
            function() {

                cover.style.display =
                    "none";

            };


        cover.style.display =
            "block";

    }


    loading.style.display =
        "none";

    comic.style.display =
        "block";

}


/* ==========================================
   CARGAR CAPÍTULOS
========================================== */

async function cargarCapitulos() {

    const response =
        await fetch(
            "/api/stories/" +
            encodeURIComponent(
                storyId
            ) +
            "/chapters",
            {
                method: "GET",

                credentials:
                    "include",

                cache:
                    "no-store"
            }
        );


    const texto =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(
                texto
            );

    } catch (error) {

        throw new Error(
            "El servidor no devolvió JSON al cargar los capítulos."
        );

    }


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.error ||
            "No se pudieron cargar los capítulos."
        );

    }


    chapters =
        Array.isArray(
            data.chapters
        )
            ? data.chapters
            : [];


    mostrarCapitulos();

}


/* ==========================================
   MOSTRAR CAPÍTULOS
========================================== */

function mostrarCapitulos() {

    chaptersContainer.innerHTML =
        "";


    if (
        chapters.length === 0
    ) {

        chaptersContainer.innerHTML =
            "<p>Aún no hay capítulos publicados.</p>";

        return;

    }


    chapters.forEach(
        function(chapter, index) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "chapter";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "chapter-number";


            number.textContent =
                "CAPÍTULO " +
                chapter.chapter_number;


            const title =
                document.createElement(
                    "h3"
                );


            title.className =
                "chapter-title";


            title.textContent =
                chapter.title ||
                "Sin título";


            const button =
                document.createElement(
                    "a"
                );


            button.className =
                "chapter-button";


            button.href =
                "#";


            button.textContent =
                "Leer capítulo";


            button.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();


                    abrirCapitulo(
                        index
                    );

                }
            );


            element.appendChild(
                number
            );


            element.appendChild(
                title
            );


            element.appendChild(
                button
            );


            chaptersContainer.appendChild(
                element
            );

        }
    );

}


/* ==========================================
   ABRIR CAPÍTULO
========================================== */

async function abrirCapitulo(
    index
) {

    if (
        index < 0 ||
        index >= chapters.length
    ) {

        return;

    }


    const chapter =
        chapters[index];


    currentChapterIndex =
        index;


    chapterContent.innerHTML =
        '<div class="reader-message">Cargando capítulo...</div>';


    chaptersSection.style.display =
        "none";


    reader.style.display =
        "block";


    document.getElementById(
        "reader-title"
    ).textContent =
        "Capítulo " +
        chapter.chapter_number +
        " — " +
        (
            chapter.title ||
            ""
        );


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );


    try {

        /*
         * Primero obtenemos el capítulo
         * individual.
         */

        const response =
            await fetch(
                "/api/chapters/" +
                encodeURIComponent(
                    chapter.id
                ),
                {
                    method: "GET",

                    credentials:
                        "include",

                    cache:
                        "no-store"
                }
            );


        const texto =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        } catch (error) {

            throw new Error(
                "El servidor devolvió una respuesta inválida."
            );

        }


        if (
            !response.ok ||
            !data.success ||
            !data.chapter
        ) {

            throw new Error(
                data.error ||
                "No se pudo cargar el capítulo."
            );

        }


        /*
         * Ahora obtenemos las imágenes
         * directamente desde la API.
         *
         * Esto es importante porque no
         * dependemos de imageId dentro
         * del contenido del capítulo.
         */

        const images =
            await cargarImagenesCapitulo(
                chapter.id
            );


        mostrarContenidoCapitulo(
            data.chapter.content || "",
            images
        );


    } catch (error) {

        console.error(
            "Error abriendo capítulo:",
            error
        );


        chapterContent.innerHTML =
            '<div class="reader-message">' +
            escapeHtml(
                error.message ||
                "No se pudo cargar el capítulo."
            ) +
            '</div>';

    }

}


/* ==========================================
   CARGAR IMÁGENES DEL CAPÍTULO
========================================== */

async function cargarImagenesCapitulo(
    chapterId
) {

    const response =
        await fetch(
            "/api/chapters/" +
            encodeURIComponent(
                chapterId
            ) +
            "/images",
            {
                method: "GET",

                credentials:
                    "include",

                cache:
                    "no-store"
            }
        );


    const texto =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(
                texto
            );

    } catch (error) {

        console.error(
            "Respuesta imágenes:",
            texto
        );

        return [];

    }


    if (
        !response.ok ||
        !data.success
    ) {

        console.error(
            "No se pudieron cargar las imágenes:",
            data.error
        );

        return [];

    }


    return Array.isArray(
        data.images
    )
        ? data.images
        : [];

}


/* ==========================================
   MOSTRAR CONTENIDO
========================================== */

function mostrarContenidoCapitulo(
    content,
    images
) {

    chapterContent.innerHTML =
        "";


    /*
     * Si existen imágenes registradas
     * en chapter_images, las mostramos.
     */

    if (
        images.length > 0
    ) {

        mostrarContenidoConImagenes(
            content,
            images
        );

        return;

    }


    /*
     * Si no existen imágenes,
     * mostramos solamente el texto.
     */

    const text =
        document.createElement(
            "div"
        );


    text.className =
        "text-content";


    text.textContent =
        limpiarMarcadoresImagen(
            content
        );


    if (
        text.textContent.trim()
    ) {

        chapterContent.appendChild(
            text
        );

    } else {

        chapterContent.innerHTML =
            '<div class="reader-message">' +
            'Este capítulo no tiene contenido publicado.' +
            '</div>';

    }

}


/* ==========================================
   CONTENIDO CON IMÁGENES
========================================== */

function mostrarContenidoConImagenes(
    content,
    images
) {

    /*
     * Intentamos interpretar el contenido
     * como una lista JSON de elementos.
     */

    let elementos = null;


    try {

        const parsed =
            JSON.parse(
                content
            );


        if (
            Array.isArray(parsed)
        ) {

            elementos =
                parsed;

        }

    } catch (error) {

        elementos =
            null;

    }


    /*
     * Si el contenido contiene una
     * estructura JSON válida, intentamos
     * respetar su orden.
     */

    if (
        elementos
    ) {

        elementos.forEach(
            function(elemento) {

                if (
                    elemento.type ===
                    "image"
                ) {

                    let image =
                        buscarImagen(
                            images,
                            elemento
                        );


                    if (
                        image
                    ) {

                        agregarImagen(
                            image
                        );

                    }

                } else {

                    if (
                        elemento.text
                    ) {

                        agregarTexto(
                            elemento.text
                        );

                    }

                }

            }
        );


        /*
         * Si por algún motivo quedaron
         * imágenes de la API sin mostrar,
         * las agregamos al final.
         */

        const mostradas =
            document.querySelectorAll(
                ".comic-image"
            ).length;


        if (
            mostradas <
            images.length
        ) {

            for (
                let i = mostradas;
                i < images.length;
                i++
            ) {

                agregarImagen(
                    images[i]
                );

            }

        }


        return;

    }


    /*
     * Si content no es JSON,
     * mostramos el texto y luego
     * las imágenes.
     */

    if (
        content &&
        content.trim()
    ) {

        agregarTexto(
            limpiarMarcadoresImagen(
                content
            )
        );

    }


    images.forEach(
        function(image) {

            agregarImagen(
                image
            );

        }
    );

}


/* ==========================================
   BUSCAR IMAGEN
========================================== */

function buscarImagen(
    images,
    elemento
) {

    /*
     * Primero intentamos por ID.
     */

    if (
        elemento.imageId !== null &&
        elemento.imageId !== undefined
    ) {

        const found =
            images.find(
                function(image) {

                    return Number(
                        image.id
                    ) === Number(
                        elemento.imageId
                    );

                }
            );


        if (
            found
        ) {

            return found;

        }

    }


    /*
     * Luego intentamos por URL.
     */

    if (
        elemento.url
    ) {

        const found =
            images.find(
                function(image) {

                    return image.image_url ===
                        elemento.url;

                }
            );


        if (
            found
        ) {

            return found;

        }

    }


    /*
     * Si imageId y url son null,
     * usamos la primera imagen que
     * todavía coincida por posición.
     */

    return images.length > 0
        ? images.shift()
        : null;

}


/* ==========================================
   AGREGAR IMAGEN
========================================== */

function agregarImagen(
    image
) {

    if (
        !image
    ) {

        return;

    }


    const url =
        image.image_url;


    if (
        !url
    ) {

        return;

    }


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "comic-image";


    img.src =
        url;


    img.alt =
        image.filename ||
        "Imagen del capítulo";


    img.loading =
        "lazy";


    img.onerror =
        function() {

            console.error(
                "No se pudo cargar imagen:",
                url
            );

            img.style.display =
                "none";

        };


    chapterContent.appendChild(
        img
    );

}


/* ==========================================
   AGREGAR TEXTO
========================================== */

function agregarTexto(
    text
) {

    if (
        !text ||
        !text.trim()
    ) {

        return;

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "text-content";


    div.textContent =
        text;


    chapterContent.appendChild(
        div
    );

}


/* ==========================================
   LIMPIAR MARCADORES
========================================== */

function limpiarMarcadoresImagen(
    content
) {

    if (
        !content
    ) {

        return "";

    }


    /*
     * Elimina estructuras como:
     *
     * [{"type":"image","imageId":1,...}]
     *
     * para que nunca aparezcan
     * como texto al lector.
     */

    try {

        const parsed =
            JSON.parse(
                content
            );


        if (
            Array.isArray(parsed)
        ) {

            return parsed
                .filter(
                    function(item) {

                        return item.type !==
                            "image";

                    }
                )
                .map(
                    function(item) {

                        return item.text ||
                            "";

                    }
                )
                .join("\n\n");

        }

    } catch (error) {

        /*
         * No era JSON.
         */

    }


    return content;

}


/* ==========================================
   CAPÍTULO ANTERIOR
========================================== */

function previousChapter() {

    if (
        currentChapterIndex <= 0
    ) {

        return;

    }


    abrirCapitulo(
        currentChapterIndex - 1
    );

}


/* ==========================================
   CAPÍTULO SIGUIENTE
========================================== */

function nextChapter() {

    if (
        currentChapterIndex >=
        chapters.length - 1
    ) {

        return;

    }


    abrirCapitulo(
        currentChapterIndex + 1
    );

}


/* ==========================================
   CERRAR LECTOR
========================================== */

function closeReader() {

    reader.style.display =
        "none";


    chaptersSection.style.display =
        "block";


    currentChapterIndex =
        -1;


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* ==========================================
   ERROR
========================================== */

function mostrarError(
    message
) {

    loading.style.display =
        "none";


    comic.style.display =
        "none";


    reader.style.display =
        "none";


    errorMessage.textContent =
        message;


    error.style.display =
        "block";

}


/* ==========================================
   SEGURIDAD
========================================== */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}

</script>
