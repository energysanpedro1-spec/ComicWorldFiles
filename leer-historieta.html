<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leer historieta - ComicWorldFiles</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #181a1f;

    color: white;

}


/* =========================================================
   CABECERA
========================================================= */

header {

    background: #111318;

    padding: 18px;

    border-bottom: 1px solid #333;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 24px;

}


/* =========================================================
   CONTENEDOR
========================================================= */

.container {

    width: 94%;

    max-width: 900px;

    margin: 25px auto;

}


/* =========================================================
   TARJETAS
========================================================= */

.card {

    background: #22252b;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 20px;

}


/* =========================================================
   INFORMACIÓN
========================================================= */

.info {

    color: #bbb;

    margin-bottom: 20px;

}


/*
 * TÍTULO GRANDE DE LA HISTORIETA
 */

.story-title {

    color: white;

    font-size: 30px;

    font-weight: bold;

    line-height: 1.2;

    margin-top: 5px;

    word-break: break-word;

}


/*
 * TÍTULO DEL CAPÍTULO
 */

.chapter-title {

    font-size: 26px;

    margin: 0 0 8px;

    color: white;

    line-height: 1.3;

}


.views {

    color: #aaa;

    font-size: 14px;

    margin-top: 8px;

    display: inline-block;

}


/* =========================================================
   CAPÍTULOS
========================================================= */

#chapters-card h2 {

    margin-top: 0;

    margin-bottom: 18px;

}


.chapter-list {

    display: flex;

    flex-direction: column;

    gap: 10px;

}


.chapter-item {

    background: #292d34;

    border: 1px solid #3b3f46;

    border-radius: 8px;

    padding: 15px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

}


.chapter-item-info {

    min-width: 0;

}


.chapter-number {

    color: #ff6b35;

    font-size: 13px;

    font-weight: bold;

}


.chapter-item-title {

    font-size: 18px;

    margin-top: 4px;

    word-break: break-word;

}


/* =========================================================
   BOTONES
========================================================= */

button {

    border: none;

    border-radius: 7px;

    padding: 11px 17px;

    font-size: 15px;

    cursor: pointer;

    background: #444;

    color: white;

    margin: 5px;

}


button:hover {

    background: #555;

}


button.primary {

    background: #2563eb;

}


button.primary:hover {

    background: #3574ef;

}


button.secondary {

    background: #666;

}


button.secondary:hover {

    background: #777;

}


/* =========================================================
   LIKES / FAVORITOS
========================================================= */

.story-actions {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 20px;

    flex-wrap: wrap;

}


.like-button,
.favorite-button {

    border: 1px solid #ddd;

    background: #fff;

    color: #555;

    padding: 9px 15px;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

}


.like-button.liked {

    background: #ffe8e8;

    border-color: #ffb5b5;

    color: #e53935;

}


.favorite-button.favorited {

    background: #fff5d6;

    border-color: #f0cf75;

    color: #b8860b;

}


.likes-count {

    color: #aaa;

    font-size: 14px;

}


/* =========================================================
   CONTENIDO
========================================================= */

.blocks {

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;

}


.block-image {

    width: 100%;

    margin: 0 0 18px;

    text-align: center;

}


.block-image img {

    display: block;

    width: 100%;

    height: auto;

    max-width: 900px;

    margin: 0 auto;

    border-radius: 5px;

    background: white;

}


.block-text {

    width: 100%;

    padding: 20px;

    margin: 5px 0 20px;

    background: #292d34;

    border-radius: 8px;

    line-height: 1.6;

    font-size: 18px;

    white-space: pre-wrap;

    word-break: break-word;

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

.navigation {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 5px;

    margin-top: 20px;

}


/* =========================================================
   MENSAJE
========================================================= */

.empty {

    color: #aaa;

    text-align: center;

    padding: 25px;

}


/* =========================================================
   OCULTO
========================================================= */

.hidden {

    display: none !important;

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 600px) {

    .container {

        width: 96%;

        margin: 15px auto;

    }


    .card {

        padding: 15px;

    }


    .story-title {

        font-size: 24px;

    }


    .chapter-title {

        font-size: 22px;

    }


    .chapter-item {

        flex-direction: column;

        align-items: stretch;

    }


    .chapter-item button {

        width: 100%;

        margin: 5px 0;

    }


    .story-actions {

        flex-direction: column;

        align-items: stretch;

    }


    .like-button,
    .favorite-button {

        width: 100%;

    }

}

</style>

</head>


<body>


<header>

<h1>
ComicWorldFiles
</h1>

</header>


<main class="container">


<!-- =====================================================
     INFORMACIÓN DE LA HISTORIETA
===================================================== -->

<section
    id="story-info-card"
    class="card"
>

<div class="info">


<!--
    Este elemento mostrará:

    En la lista:
    Título de la historieta

    En un capítulo:
    Título de la historieta
-->

<div
    id="story-title"
    class="story-title"
>
Cargando...
</div>


<!--
    Este elemento se utilizará
    para mostrar "Capítulos"
    o el título del capítulo.
-->

<h2
    id="chapter-title"
    class="chapter-title"
>
</h2>


<span
    id="views"
    class="views"
>
</span>


</div>


<!-- =====================================================
     LIKES Y FAVORITOS
===================================================== -->

<div
    id="story-actions"
    class="story-actions hidden"
>

<button
    id="like-button"
    class="like-button"

>
♡ Me gusta
</button>

>
0

>
☆ Favorito

</section>



<!-- =====================================================
     LISTA DE CAPÍTULOS
===================================================== -->

<section
    id="chapters-card"
    class="card hidden"
>

<h2>
Capítulos
</h2>

<button
    id="resume-button"
    class="primary hidden"
    onclick="retomarCapitulo()"
>
▶ Retomar capítulo
</button>

</div>

<!-- =====================================================

===================================================== -->

<section

    class="card hidden"
>

>
</div>

>
</div>

</section>



<!-- =====================================================
     MENSAJES
===================================================== -->

<div
    id="message-card"
    class="card hidden"
>

<div
    id="message"
>
</div>

</div>


</main>



<script>


/* =========================================================
   VARIABLES
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");


/*
 * Si existe chapter o capitulo,
 * significa que debemos abrir
 * directamente ese capítulo.
 */

const requestedChapter =
    params.get("chapter") ||
    params.get("capitulo");


let chapters = [];

let currentChapter = null;

let blocks = [];

let currentUser = null;

let isAdmin = false;

let hasEditPermission = false;

let isLiked = false;

let isFavorited = false;

let storyTitle = "";



/* =========================================================
   INICIO
========================================================= */

if (!storyId) {

    mostrarMensaje(
        "No se indicó ninguna historieta."
    );

} else {

    inicializar();

}



/* =========================================================
   INICIALIZAR
========================================================= */

async function inicializar() {

    await cargarUsuario();

    await cargarHistorieta();

}



/* =========================================================
   USUARIO
========================================================= */

async function cargarUsuario() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.success &&
            data.loggedIn
        ) {

            currentUser =
                data.user;

        }


    } catch (error) {

        console.error(
            "Error comprobando usuario:",
            error
        );

    }

}



/* =========================================================
   CARGAR HISTORIETA
========================================================= */

async function cargarHistorieta() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ),
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            mostrarMensaje(
                data.error ||
                "No se pudo cargar la historieta."
            );

            return;

        }


        /*
         * Guardar título globalmente.
         */

        storyTitle =
            data.story.title ||
            "Sin título";

       /*
 * COMPROBAR PERMISO DE EDICIÓN
 */

const story =
    data.story;


/*
 * Comprobar si es administrador.
 */

try {

    const adminResponse =
        await fetch(
            "/api/admin/check",
            {
                credentials: "include"
            }
        );


    const adminData =
        await adminResponse.json();


    if (
        adminResponse.ok &&
        adminData.success &&
        adminData.loggedIn &&
        adminData.isAdmin
    ) {

        isAdmin = true;

    }

} catch (error) {

    console.error(
        "Error comprobando administrador:",
        error
    );

}


/*
 * El autor puede editar su propia historia.
 */

if (
    currentUser &&
    Number(currentUser.id) ===
    Number(story.user_id)
) {

    hasEditPermission = true;

}


/*
 * El administrador puede editar cualquier historia.
 */

if (isAdmin) {

    hasEditPermission = true;

}

        /*
         * Mostrar título.
         */

        document.getElementById(
            "story-title"
        ).textContent =
            storyTitle;


        await cargarCapitulos();


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "No se pudo conectar con el servidor."
        );

    }

}



/* =========================================================
   CARGAR CAPÍTULOS
========================================================= */

async function cargarCapitulos() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/chapters",
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            mostrarMensaje(
                data.error ||
                "No se pudieron cargar los capítulos."
            );

            return;

        }


        chapters =
            Array.isArray(
                data.chapters
            )
                ? data.chapters
                : [];


        /*
         * Ordenar capítulos.
         */

        chapters.sort(
            function(a, b) {

                return Number(
                    a.chapter_number
                ) -
                Number(
                    b.chapter_number
                );

            }
        );


        /*
         * Si NO se indicó capítulo,
         * mostrar la lista.
         */

        if (!requestedChapter) {

            mostrarListaCapitulos();

            return;

        }


        /*
         * Si se indicó capítulo,
         * buscarlo.
         */

        const number =
            Number(
                requestedChapter
            );


        const chapter =
            chapters.find(
                function(item) {

                    return Number(
                        item.chapter_number
                    ) === number;

                }
            );


        if (!chapter) {

            mostrarListaCapitulos();

            mostrarMensaje(
                "El capítulo solicitado no existe."
            );

            return;

        }


        await cargarCapitulo(
            chapter
        );

    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "No se pudieron cargar los capítulos."
        );

    }

}

/* =========================================================
   ÚLTIMO CAPÍTULO LEÍDO
========================================================= */

function obtenerClaveProgreso() {

    return "comicworldfiles_last_chapter_" +
        String(storyId);

}


function guardarUltimoCapitulo(
    chapterNumber
) {

    if (!storyId || !chapterNumber) {
        return;
    }

    localStorage.setItem(
        obtenerClaveProgreso(),
        String(chapterNumber)
    );

}


function obtenerUltimoCapitulo() {

    if (!storyId) {
        return null;
    }

    return localStorage.getItem(
        obtenerClaveProgreso()
    );

}


function retomarCapitulo() {

    const lastChapter =
        obtenerUltimoCapitulo();

    if (!lastChapter) {
        return;
    }

    const chapter =
        chapters.find(
            function(item) {

                return Number(
                    item.chapter_number
                ) === Number(
                    lastChapter
                );

            }
        );

    if (!chapter) {
        return;
    }

    abrirCapitulo(
        chapter.chapter_number
    );

}

/* =========================================================
   MOSTRAR LISTA
========================================================= */

function mostrarListaCapitulos() {

    /*
     * Ocultar lector.
     */

    document.getElementById(
        "reader-card"
    ).classList.add(
        "hidden"
    );


    /*
     * Ocultar likes.
     */

    document.getElementById(
        "story-actions"
    ).classList.add(
        "hidden"
    );


    /*
     * Mostrar título de la historieta
     * grande.
     */

    document.getElementById(
        "story-title"
    ).textContent =
        storyTitle;


    /*
     * Debajo del título:
     * "Capítulos".
     */

    document.getElementById(
        "chapter-title"
    ).textContent =
        "";


    document.getElementById(
        "views"
    ).textContent =
        "";


    const card =
        document.getElementById(
            "chapters-card"
        );

   const resumeButton =
    document.getElementById(
        "resume-button"
    );

    const container =
        document.getElementById(
            "chapters-container"
        );


    container.innerHTML =
        "";

   /*
 * Mostrar botón Retomar
 * si existe un capítulo leído anteriormente.
 */

const lastChapter =
    obtenerUltimoCapitulo();


if (lastChapter) {

    const chapter =
        chapters.find(
            function(item) {

                return Number(
                    item.chapter_number
                ) === Number(
                    lastChapter
                );

            }
        );


    if (chapter) {

        resumeButton.textContent =
            "▶ Retomar capítulo " +
            chapter.chapter_number +
            ": " +
            (
                chapter.title ||
                "Sin título"
            );

        resumeButton.classList.remove(
            "hidden"
        );

    } else {

        resumeButton.classList.add(
            "hidden"
        );

    }

} else {

    resumeButton.classList.add(
        "hidden"
    );

}


    /*
     * Sin capítulos.
     */

    if (!chapters.length) {

        container.innerHTML =
            '<div class="empty">' +
            'Esta historieta todavía no tiene capítulos.' +
            '</div>';


        card.classList.remove(
            "hidden"
        );


        return;

    }


    /*
     * Crear capítulos.
     */

    chapters.forEach(
        function(chapter) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "chapter-item";


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "chapter-item-info";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "chapter-number";


            number.textContent =
                "CAPÍTULO " +
                chapter.chapter_number;


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "chapter-item-title";


            title.textContent =
                chapter.title ||
                "Sin título";


            info.appendChild(
                number
            );


            info.appendChild(
                title
            );


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "primary";


            button.textContent =
                "Leer capítulo";


            button.onclick =
                function() {

                    abrirCapitulo(
                        chapter.chapter_number
                    );

                };


            item.appendChild(
                info
            );


            item.appendChild(
                button
            );


            container.appendChild(
                item
            );

        }
    );


    card.classList.remove(
        "hidden"
    );

}



/* =========================================================
   ABRIR CAPÍTULO
========================================================= */

function abrirCapitulo(
    number
) {

    window.location.href =
        "leer-historieta.html?id=" +
        encodeURIComponent(
            storyId
        ) +
        "&chapter=" +
        encodeURIComponent(
            number
        );

}



/* =========================================================
   CARGAR CAPÍTULO
========================================================= */

async function cargarCapitulo(
    chapter
) {

    currentChapter =
        chapter;


guardarUltimoCapitulo(
    chapter.chapter_number
);
   
    /*
     * Ocultar lista.
     */

    document.getElementById(
        "chapters-card"
    ).classList.add(
        "hidden"
    );


    /*
     * Mostrar lector.
     */

    document.getElementById(
        "reader-card"
    ).classList.remove(
        "hidden"
    );


    /*
     * Mostrar likes.
     */

    document.getElementById(
        "story-actions"
    ).classList.remove(
        "hidden"
    );


    /*
     * Mantener título grande
     * de la historieta.
     */

    document.getElementById(
        "story-title"
    ).textContent =
        storyTitle;


    /*
     * Mostrar título del capítulo.
     */

    document.getElementById(
        "chapter-title"
    ).textContent =
        "Capítulo " +
        chapter.chapter_number +
        ": " +
        (
            chapter.title ||
            "Sin título"
        );


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                encodeURIComponent(
                    chapter.id
                ),
                {
                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            mostrarMensaje(
                data.error ||
                "No se pudo cargar el capítulo."
            );

            return;

        }


        const loaded =
            data.chapter ||
            data;


        cargarBloques(
            loaded.content
        );


        actualizarNavegacion();


        await cargarDatosInteraccion(
            chapter.id
        );


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "No se pudo cargar el contenido del capítulo."
        );

    }

}



/* =========================================================
   CARGAR BLOQUES
========================================================= */

function cargarBloques(
    content
) {

    blocks = [];


    try {

        /*
         * Array directo.
         */

        if (
            Array.isArray(
                content
            )
        ) {

            blocks =
                content;

        }


        /*
         * JSON almacenado como texto.
         */

        else if (
            typeof content ===
            "string"
        ) {

            const parsed =
                JSON.parse(
                    content
                );


            if (
                Array.isArray(
                    parsed
                )
            ) {

                blocks =
                    parsed;

            }


            else if (
                parsed &&
                Array.isArray(
                    parsed.blocks
                )
            ) {

                blocks =
                    parsed.blocks;

            }

        }


        /*
         * Objeto con blocks.
         */

        else if (
            content &&
            Array.isArray(
                content.blocks
            )
        ) {

            blocks =
                content.blocks;

        }


    } catch (error) {

        console.error(
            "Error leyendo bloques:",
            error
        );

        blocks = [];

    }


    mostrarBloques();

}



/* =========================================================
   MOSTRAR BLOQUES
========================================================= */

function mostrarBloques() {

    const container =
        document.getElementById(
            "blocks"
        );


    container.innerHTML =
        "";


    if (!blocks.length) {

        container.innerHTML =
            '<div class="empty">' +
            'Este capítulo todavía no tiene contenido.' +
            '</div>';


        return;

    }


    blocks.forEach(
        function(block) {


            /*
             * IMAGEN
             */

            if (
                block.type ===
                "image"
            ) {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "block-image";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    block.image_url ||
                    "";


                img.alt =
                    block.filename ||
                    "Página de la historieta";


                img.loading =
                    "lazy";


                wrapper.appendChild(
                    img
                );


                container.appendChild(
                    wrapper
                );

            }


            /*
             * TEXTO
             */

            else if (
                block.type ===
                "text"
            ) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "block-text";


                /*
                 * El sistema de crear-historieta
                 * guarda el texto en content.
                 *
                 * block.text queda como
                 * compatibilidad.
                 */

                text.textContent =
                    block.content ||
                    block.text ||
                    "";


                container.appendChild(
                    text
                );

            }

        }
    );

}



/* =========================================================
   NAVEGACIÓN
========================================================= */

function actualizarNavegacion() {

    const nav =
        document.getElementById(
            "navigation"
        );


    nav.innerHTML =
        "";


    if (!currentChapter) {

        return;

    }


    const index =
        chapters.findIndex(
            function(chapter) {

                return Number(
                    chapter.chapter_number
                ) ===
                Number(
                    currentChapter.chapter_number
                );

            }
        );


    /*
     * VOLVER A CAPÍTULOS
     */

    const listButton =
        document.createElement(
            "button"
        );


    listButton.className =
        "secondary";


    listButton.textContent =
        "← Capítulos";


    listButton.onclick =
        function() {

            window.location.href =
                "editar-historieta.html?id=" +
                encodeURIComponent(
                    storyId
                );

        };


    nav.appendChild(
        listButton
    );

/*
 * EDITAR CAPÍTULO
 */

if (
    hasEditPermission &&

async function cargarDatosInteraccion(
    chapterId
) {

    /*
     * LIKES
     */

    try {

        const response =
    await fetch(
        "/api/stories/" +
        encodeURIComponent(storyId) +
        "/like",
        {
            credentials: "include"
        }
    );


        if (response.ok) {

            const data =
                await response.json();


            if (data.success) {

                document.getElementById(
                    "likes-count"
                ).textContent =
                    data.count ??
                    data.likes ??
                    0;


                isLiked =
                    !!data.liked;


                actualizarBotonLike();

            }

        }

    } catch (error) {

        console.error(
            "Error likes:",
            error
        );

    }


    /*
     * FAVORITOS
     */

    try {

        const response =
    await fetch(
        "/api/stories/" +
        encodeURIComponent(storyId) +
        "/favorite",
        {
            credentials: "include"
        }
    );


        if (response.ok) {

            const data =
                await response.json();


            if (data.success) {

                isFavorited =
                    !!data.favorited;


                actualizarBotonFavorito();

            }

        }

    } catch (error) {

        console.error(
            "Error favorito:",
            error
        );

    }

}



/* =========================================================
   ACTUALIZAR LIKE
========================================================= */

function actualizarBotonLike() {

    const button =
        document.getElementById(
            "like-button"
        );


    button.textContent =
        isLiked
            ? "♥ Me gusta"
            : "♡ Me gusta";


    button.classList.toggle(
        "liked",
        isLiked
    );

}



/* =========================================================
   ACTUALIZAR FAVORITO
========================================================= */

function actualizarBotonFavorito() {

    const button =
        document.getElementById(
            "favorite-button"
        );


    button.textContent =
        isFavorited
            ? "★ Favorito"
            : "☆ Favorito";


    button.classList.toggle(
        "favorited",
        isFavorited
    );

}

========================================================= */

async function toggleLike() {

    if (!currentUser) {

        mostrarMensaje(
            "Debes iniciar sesión para dar Me gusta."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(
                    storyId
                ) +
                "/like",
                {
                    method: "POST",

                    credentials:
                        "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            mostrarMensaje(
                data.error ||
                "No se pudo actualizar el Me gusta."
            );

            return;

        }


        isLiked =
            !!data.liked;


        document.getElementById(
            "likes-count"
        ).textContent =
            data.count ??
            data.likes ??
            0;


        actualizarBotonLike();


    } catch (error) {

        console.error(
            "Error actualizando Me gusta:",
            error
        );

        mostrarMensaje(
            "No se pudo conectar con el servidor."
        );

    }

}

async function toggleFavorite() {

    if (!currentUser) {

        mostrarMensaje(

        );

        return;

    }


    try {

        const response =
            await fetch(

                encodeURIComponent(
                    storyId
                ) +
                "/favorite",
                {
                    method: "POST",

                    credentials:
                        "include"
                }
            );


        const data =

        if (
            !response.ok ||
            !data.success
        ) {

            mostrarMensaje(

                "No se pudo actualizar el favorito."
            );

            return;

        }


        isFavorited =

        actualizarBotonFavorito();

        );

        mostrarMensaje(

    }

}
