<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leer historieta - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #181a1f;

    color: white;
}

header {

    background: #111318;

    padding: 18px;

    text-align: center;

    border-bottom: 1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 24px;
}

.container {

    width: 94%;

    max-width: 900px;

    margin: 25px auto;
}

.card {

    background: #22252b;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 20px;
}

.info {

    color: #bbb;

    margin-bottom: 20px;
}

.chapter-title {

    font-size: 26px;

    margin: 0 0 5px 0;
}

.story-title {

    color: #aaa;

    font-size: 15px;
}

/* =====================================================
   CONTADOR DE VISITAS
===================================================== */

.views {

    color: #aaa;

    font-size: 14px;

    margin-top: 8px;

    display: inline-block;
}

.blocks {

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;
}

.block-image {

    width: 100%;

    margin: 0 0 18px 0;

    text-align: center;
}

.block-image img {

    display: block;

    width: 100%;

    height: auto;

    max-width: 900px;

    margin: 0 auto;

    border-radius: 5px;

    background: white;
}

.block-text {

    width: 100%;

    padding: 20px;

    margin: 5px 0 20px 0;

    background: #292d34;

    border-radius: 8px;

    line-height: 1.6;

    font-size: 18px;

    white-space: pre-wrap;

    word-break: break-word;
}

button {

    border: none;

    border-radius: 7px;

    padding: 11px 17px;

    font-size: 15px;

    cursor: pointer;

    background: #444;

    color: white;

    margin: 5px;
}

button:hover {

    background: #555;
}

button.primary {

    background: #2563eb;
}

button.primary:hover {

    background: #3574ef;
}

button.success {

    background: #218838;
}

button.danger {

    background: #b52b2b;
}

button.secondary {

    background: #666;
}

button:disabled {

    background: #777;

    cursor: not-allowed;
}

.actions {

    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 15px;
}

.editor {

    display: none;
}

.editor.active {

    display: block;
}

.editor-block {

    background: #2b2f36;

    border: 1px solid #444;

    border-radius: 8px;

    padding: 12px;

    margin-bottom: 12px;
}

.editor-block-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;

    color: #bbb;

    font-size: 14px;
}

.editor-image {

    width: 100%;

    max-height: 500px;

    object-fit: contain;

    background: white;

    border-radius: 5px;
}

.editor-text {

    width: 100%;

    min-height: 100px;

    resize: vertical;

    padding: 12px;

    border-radius: 7px;

    border: 1px solid #555;

    background: #181a1f;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 16px;

}

.add-area {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;

    padding: 15px;

    background: #191b20;

    border-radius: 8px;
}

input[type="file"] {

    width: 100%;

    padding: 10px;

    background: #181a1f;

    color: white;

    border: 1px solid #444;

    border-radius: 7px;
}

textarea {

    width: 100%;

    min-height: 100px;

    resize: vertical;

    padding: 12px;

    border-radius: 7px;

    border: 1px solid #555;

    background: #181a1f;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 16px;
}

.message {

    padding: 12px;

    border-radius: 7px;

    margin-top: 15px;

    display: none;
}

.error {

    background: #4a2020;

    border: 1px solid #9b4444;

    color: #ffb5b5;
}

.success-message {

    background: #203f27;

    border: 1px solid #4b8d58;

    color: #b8f0c1;
}

.loading {

    text-align: center;

    padding: 40px;

    color: #aaa;
}

.empty {

    text-align: center;

    padding: 40px;

    color: #aaa;
}

.back {

    display: inline-block;

    color: white;

    text-decoration: none;

    margin-bottom: 15px;

    font-weight: bold;
}

.separator {

    border: 0;

    border-top: 1px solid #444;

    margin: 25px 0;
}

.hidden {

    display: none !important;
}

</style>

</head>

<body>

<header>

<h1 id="storyTitle">
Cargando historieta...
</h1>

<div id="views"
     class="views">

👁 Cargando visitas...

</div>

</header>

<div class="container">

<a href="index.html"
class="back">

← Volver

</a>

<!-- =====================================================
     LECTOR
===================================================== -->

<div class="card">

<div class="info">

<h2 id="chapterTitle"
    class="chapter-title">

Cargando capítulo...

</h2>

<div id="chapterNumber"
     class="story-title">
</div>

</div>

<div id="loading"
     class="loading">

Cargando capítulo...

</div>

<div id="blocks"
     class="blocks">
</div>

<div id="readerError"
     class="message error">
</div>

<div id="readerSuccess"
     class="message success-message">
</div>

<div class="actions">

<button id="editButton"
  class="primary hidden"
  onclick="activarEdicion()">

✏️ Editar capítulo

</button>

</div>

</div>

<!-- =====================================================
     EDITOR
===================================================== -->

<div id="editorCard"
     class="card editor">

<h2>Editar capítulo</h2>

<p class="info">

Puedes agregar imágenes y texto. También puedes modificar
el texto existente.

</p>

<div id="editorBlocks">
</div>

<hr class="separator">

<h3>Agregar texto</h3>

<textarea id="newText"
          placeholder="Escribe el texto que quieres agregar..."></textarea>

<button class="primary"
  onclick="agregarTexto()">

* Agregar texto

</button>

<hr class="separator">

<h3>Agregar imágenes</h3>

<p class="info">

Puedes seleccionar una o varias imágenes.

</p>

<input type="file"
 id="newImages"
 accept="image/jpeg,image/png,image/webp,image/gif"
 multiple>

<button class="primary"
  id="uploadButton"
  onclick="subirNuevasImagenes()">

* Subir imágenes

</button>

<div id="uploadMessage"
     class="message">
</div>

<hr class="separator">

<div class="actions">

<button class="success"
  id="saveButton"
  onclick="guardarCambios()">

💾 Guardar cambios

</button>

<button class="secondary"
  onclick="cancelarEdicion()">

Cancelar

</button>

</div>

<div id="saveMessage"
     class="message">
</div>

</div>

</div>

<script>


// ========================================================
// VARIABLES
// ========================================================

let storyId = null;

let chapterId = null;

let chapterData = null;

let blocks = [];

let loggedUser = null;

let storyData = null;


// ========================================================
// UTILIDADES
// ========================================================

function mostrarMensaje(
    id,
    mensaje,
    tipo
) {

    const element =
        document.getElementById(id);

    element.textContent =
        mensaje;

    element.className =
        "message " +
        tipo;

    element.style.display =
        "block";

}


function ocultarMensaje(id) {

    const element =
        document.getElementById(id);

    element.style.display =
        "none";

    element.textContent =
        "";

}


// ========================================================
// OBTENER PARÁMETROS
// ========================================================

function obtenerParametros() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    storyId =
        Number(
            params.get("id")
        );


    chapterId =
        Number(
            params.get("chapter")
        );


    if (!chapterId) {

        chapterId =
            Number(
                params.get("capitulo")
            );

    }

}


// ========================================================
// SESIÓN
// ========================================================

async function comprobarSesion() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        if (!response.ok) {

            return null;

        }


        const data =
            await response.json();


        if (
            !data.loggedIn
        ) {

            return null;

        }


        return data.user;


    } catch (error) {

        return null;

    }

}


// ========================================================
// REGISTRAR VISITA - 1 VISITA CADA 24 HORAS POR NAVEGADOR
// ========================================================

async function registrarVisita() {

    if (!storyId) {
        return;
    }

    const clave =
        "comicworldfiles_view_" +
        storyId;

    const ahora =
        Date.now();

    const ultimaVisita =
        localStorage.getItem(
            clave
        );

    const periodo =
        24 *
        60 *
        60 *
        1000;

    /*
     * Si ya se registró una visita
     * durante las últimas 24 horas,
     * no enviamos otra al servidor.
     */

    if (
        ultimaVisita &&
        (ahora - Number(ultimaVisita)) <
        periodo
    ) {

        console.log(
            "Visita ya registrada durante las últimas 24 horas."
        );

        return;
    }

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/view",
                {
                    method: "POST",
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (
            response.ok &&
            data.success
        ) {

            /*
             * Guardamos la fecha solamente
             * cuando el servidor confirmó
             * correctamente la visita.
             */

            localStorage.setItem(
                clave,
                String(ahora)
            );

            actualizarContador(
                data.views
            );

        } else {

            if (
                storyData &&
                storyData.views !== undefined
            ) {

                actualizarContador(
                    storyData.views
                );

            }

        }

    } catch (error) {

        console.error(
            "Error registrando visita:",
            error
        );

        if (
            storyData &&
            storyData.views !== undefined
        ) {

            actualizarContador(
                storyData.views
            );

        }

    }

}

// ========================================================
// ACTUALIZAR CONTADOR
// ========================================================

function actualizarContador(
    views
) {

    const element =
        document.getElementById(
            "views"
        );


    if (!element) {

        return;

    }


    const cantidad =
        Number(
            views || 0
        );


    element.textContent =
        cantidad === 1
            ? "👁 1 visita"
            : "👁 " +
              cantidad +
              " visitas";

}


// ========================================================
// CARGAR HISTORIETA
// ========================================================

async function cargarHistorieta() {

    if (!storyId) {

        mostrarError(
            "No se indicó qué historieta quieres leer."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo cargar la historieta."
            );

        }


        storyData =
            data.story;


        document.getElementById(
            "storyTitle"
        ).textContent =
            storyData.title;


        /*
         * Mostramos el contador que viene
         * actualmente desde la base de datos.
         */

        if (
            storyData.views !== undefined
        ) {

            actualizarContador(
                storyData.views
            );

        }


        /*
         * Registramos la apertura de la
         * historieta.
         *
         * Se hace después de obtener
         * correctamente la publicación.
         */

        registrarVisita();


        comprobarPropietario();


        /*
         * Si no se indicó capítulo,
         * buscamos el primero.
         */

        if (!chapterId) {

            await buscarPrimerCapitulo();

            return;

        }


        await cargarCapitulo();


    } catch (error) {

        mostrarError(
            error.message
        );

    }

}


// ========================================================
// BUSCAR PRIMER CAPÍTULO
// ========================================================

async function buscarPrimerCapitulo() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudieron cargar los capítulos."
            );

        }


        const chapters =
            data.chapters ||
            [];


        if (!chapters.length) {

            throw new Error(
                "Esta historieta todavía no tiene capítulos."
            );

        }


        chapterId =
            Number(
                chapters[0].id
            );


        await cargarCapitulo();


    } catch (error) {

        mostrarError(
            error.message
        );

    }

}


// ========================================================
// CARGAR CAPÍTULO
// ========================================================

async function cargarCapitulo() {

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "block";


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo cargar el capítulo."
            );

        }


        chapterData =
            data.chapter;


        document.getElementById(
            "chapterTitle"
        ).textContent =
            chapterData.title;


        document.getElementById(
            "chapterNumber"
        ).textContent =
            "Capítulo " +
            chapterData.chapter_number;


        cargarBloques(
            chapterData.content
        );


        loading.style.display =
            "none";


        comprobarPropietario();


    } catch (error) {

        loading.style.display =
            "none";


        mostrarError(
            error.message
        );

    }

}


// ========================================================
// CARGAR BLOQUES
// ========================================================

function cargarBloques(content) {

    blocks = [];


    try {

        if (
            content &&
            typeof content === "string"
        ) {

            const parsed =
                JSON.parse(
                    content
                );


            if (
                parsed &&
                Array.isArray(
                    parsed.blocks
                )
            ) {

                blocks =
                    parsed.blocks;

            }

        }


    } catch (error) {

        console.error(
            "Error leyendo bloques:",
            error
        );

    }


    mostrarBloques();

}


// ========================================================
// MOSTRAR BLOQUES
// ========================================================

function mostrarBloques() {

    const container =
        document.getElementById(
            "blocks"
        );


    container.innerHTML =
        "";


    if (!blocks.length) {

        container.innerHTML =
            "<div class='empty'>" +
            "Este capítulo todavía no tiene contenido." +
            "</div>";

        return;

    }


    blocks.forEach(
        function(block) {

            if (
                block.type === "image"
            ) {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "block-image";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    block.image_url;


                img.alt =
                    block.filename ||
                    "Página del cómic";


                img.loading =
                    "lazy";


                wrapper.appendChild(
                    img
                );


                container.appendChild(
                    wrapper
                );

            }


            else if (
                block.type === "text"
            ) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "block-text";


                text.textContent =
                    block.text ||
                    "";


                container.appendChild(
                    text
                );

            }

        }
    );

}


// ========================================================
// COMPROBAR PROPIETARIO
// ========================================================

function comprobarPropietario() {

    if (
        !loggedUser ||
        !storyData
    ) {

        return;

    }


    if (
        Number(
            loggedUser.id
        ) ===
        Number(
            storyData.user_id
        )
    ) {

        document.getElementById(
            "editButton"
        ).classList.remove(
            "hidden"
        );

    }

}


// ========================================================
// ACTIVAR EDICIÓN
// ========================================================

function activarEdicion() {

    if (
        !loggedUser ||
        !storyData ||
        Number(loggedUser.id) !==
        Number(storyData.user_id)
    ) {

        alert(
            "No tienes permiso para editar este capítulo."
        );

        return;

    }


    document.getElementById(
        "editorCard"
    ).classList.add(
        "active"
    );


    renderEditor();


    document.getElementById(
        "editorCard"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


// ========================================================
// CANCELAR EDICIÓN
// ========================================================

function cancelarEdicion() {

    document.getElementById(
        "editorCard"
    ).classList.remove(
        "active"
    );


    ocultarMensaje(
        "saveMessage"
    );


    ocultarMensaje(
        "uploadMessage"
    );


    cargarCapitulo();

}


// ========================================================
// RENDERIZAR EDITOR
// ========================================================

function renderEditor() {

    const container =
        document.getElementById(
            "editorBlocks"
        );


    container.innerHTML =
        "";


    if (!blocks.length) {

        container.innerHTML =
            "<div class='empty'>" +
            "Todavía no hay bloques." +
            "</div>";

        return;

    }


    blocks.forEach(
        function(block, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "editor-block";


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "editor-block-header";


            const number =
                document.createElement(
                    "span"
                );


            number.textContent =
                "Bloque " +
                (index + 1) +
                " — " +
                block.type;


            header.appendChild(
                number
            );


            const removeButton =
                document.createElement(
                    "button"
                );


            removeButton.className =
                "danger";


            removeButton.textContent =
                "Eliminar";


            removeButton.onclick =
                function() {

                    eliminarBloque(
                        index
                    );

                };


            header.appendChild(
                removeButton
            );


            item.appendChild(
                header
            );


            if (
                block.type === "image"
            ) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "editor-image";


                img.src =
                    block.image_url;


                img.alt =
                    block.filename ||
                    "Imagen";


                item.appendChild(
                    img
                );

            }


            else if (
                block.type === "text"
            ) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.className =
                    "editor-text";


                textarea.value =
                    block.text ||
                    "";


                textarea.oninput =
                    function() {

                        blocks[index].text =
                            textarea.value;

                    };


                item.appendChild(
                    textarea
                );

            }


            container.appendChild(
                item
            );

        }
    );

}


// ========================================================
// ELIMINAR BLOQUE
// ========================================================

function eliminarBloque(index) {

    if (
        !confirm(
            "¿Eliminar este bloque?"
        )
    ) {

        return;

    }


    blocks.splice(
        index,
        1
    );


    renderEditor();

}


// ========================================================
// AGREGAR TEXTO
// ========================================================

function agregarTexto() {

    const textarea =
        document.getElementById(
            "newText"
        );


    const text =
        textarea.value.trim();


    if (!text) {

        alert(
            "Escribe algún texto."
        );

        return;

    }


    blocks.push({

        type:
            "text",

        text:
            text

    });


    textarea.value =
        "";


    renderEditor();


    setTimeout(
        function() {

            const container =
                document.getElementById(
                    "editorBlocks"
                );


            if (
                container.lastElementChild
            ) {

                container.lastElementChild
                    .scrollIntoView({
                        behavior: "smooth"
                    });

            }

        },
        100
    );

}


// ========================================================
// SUBIR NUEVAS IMÁGENES
// ========================================================

async function subirNuevasImagenes() {

    if (!chapterId) {

        return;

    }


    const input =
        document.getElementById(
            "newImages"
        );


    const files =
        Array.from(
            input.files
        );


    if (!files.length) {

        mostrarMensaje(
            "uploadMessage",
            "Selecciona al menos una imagen.",
            "error"
        );

        return;

    }


    const maxSize =
        10 *
        1024 *
        1024;


    for (
        const file of files
    ) {

        if (
            file.size > maxSize
        ) {

            mostrarMensaje(
                "uploadMessage",
                file.name +
                " supera los 10 MB.",
                "error"
            );

            return;

        }

    }


    const button =
        document.getElementById(
            "uploadButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Subiendo...";


    ocultarMensaje(
        "uploadMessage"
    );


    try {

        let uploaded =
            0;


        for (
            const file of files
        ) {

            const formData =
                new FormData();


            formData.append(
                "image",
                file
            );


            const response =
                await fetch(
                    "/api/chapters/" +
                    chapterId +
                    "/images",
                    {
                        method: "POST",

                        credentials: "include",

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "No se pudo subir " +
                    file.name
                );

            }


            if (
                !data.success ||
                !data.image
            ) {

                throw new Error(
                    data.error ||
                    "Respuesta inválida del servidor."
                );

            }


            blocks.push({

                type:
                    "image",

                image_id:
                    data.image.id,

                image_url:
                    data.image.image_url,

                filename:
                    data.image.filename

            });


            uploaded++;

        }


        input.value =
            "";


        renderEditor();


        mostrarMensaje(
            "uploadMessage",
            uploaded +
            " imagen(es) agregada(s) al capítulo. Ahora pulsa «Guardar cambios».",
            "success-message"
        );


    } catch (error) {

        mostrarMensaje(
            "uploadMessage",
            error.message,
            "error"
        );

    }


    button.disabled =
        false;


    button.textContent =
        "+ Subir imágenes";

}


// ========================================================
// GUARDAR CAMBIOS
// ========================================================

async function guardarCambios() {

    if (!chapterId) {

        return;

    }


    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        true;


    button.textContent =
        "Guardando...";


    ocultarMensaje(
        "saveMessage"
    );


    try {

        const content =
            JSON.stringify({

                version:
                    1,

                blocks:
                    blocks

            });


        const response =
            await fetch(
                "/api/chapters/" +
                chapterId,
                {
                    method: "PUT",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            title:
                                chapterData.title,

                            content:
                                content

                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudieron guardar los cambios."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "No se pudieron guardar los cambios."
            );

        }


        chapterData.content =
            content;


        mostrarBloques();


        mostrarMensaje(
            "saveMessage",
            "Cambios guardados correctamente.",
            "success-message"
        );


        setTimeout(
            function() {

                document.getElementById(
                    "editorCard"
                ).classList.remove(
                    "active"
                );

            },
            1200
        );


    } catch (error) {

        mostrarMensaje(
            "saveMessage",
            error.message,
            "error"
        );

    }


    button.disabled =
        false;


    button.textContent =
        "💾 Guardar cambios";

}


// ========================================================
// ERROR PRINCIPAL
// ========================================================

function mostrarError(mensaje) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const blocksContainer =
        document.getElementById(
            "blocks"
        );


    blocksContainer.innerHTML =
        "";


    mostrarMensaje(
        "readerError",
        mensaje,
        "error"
    );

}


// ========================================================
// INICIO
// ========================================================

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        obtenerParametros();


        loggedUser =
            await comprobarSesion();


        await cargarHistorieta();

    }
);

</script>
