<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

<title>Editar historieta - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

/* ==============================
   CABECERA
============================== */

header {
    background: #20242b;
    color: white;
    padding: 15px 20px;
}

.header-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.back {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}

/* ==============================
   CONTENEDOR
============================== */

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

/* ==============================
   INFORMACIÓN HISTORIA
============================== */

.story-info {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

.story-info h1 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 30px;
}

.detail {
    color: #666;
    line-height: 1.6;
    margin: 10px 0;
}

.author {
    color: #777;
    font-size: 14px;
}

.genre {
    display: inline-block;
    background: #eee;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 10px;
}

/* ==============================
   CAPÍTULOS
============================== */

.section-title {
    margin: 30px 0 15px;
}

.section-title h2 {
    margin: 0;
}

.chapter-card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.chapter-card h3 {
    margin: 0 0 8px;
}

.chapter-number {
    color: #ff6b35;
    font-size: 13px;
    font-weight: bold;
}

.chapter-preview {
    color: #666;
    line-height: 1.5;
    white-space: pre-wrap;
    max-height: 120px;
    overflow: hidden;
}

.chapter-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

/* ==============================
   EDITOR
============================== */

.editor {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.editor h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 7px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #ff6b35;
}

.chapter-title-input {
    margin-bottom: 10px;
}

/* ==============================
   BOTONES
============================== */

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.save-button {
    background: #ff6b35;
    color: white;
}

.save-button:hover {
    background: #e85a2a;
}

.cancel-button {
    background: #ddd;
    color: #222;
}

.edit-button {
    background: #20242b;
    color: white;
}

.remove-button {
    background: #ddd;
    color: #222;
}

.delete-button {
    background: #a00000;
    color: white;
}

.add-text-button {
    background: #20242b;
    color: white;
}

.add-image-button {
    background: #ff6b35;
    color: white;
}

/* ==============================
   BLOQUES
============================== */

#blocks-container {
    margin-top: 20px;
}

.content-block {
    background: #f8f8f8;
    border: 1px solid #ccc;
    border-radius: 9px;
    padding: 15px;
    margin-bottom: 15px;
}

.content-block-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.content-block-title {
    font-weight: bold;
}

.content-block-number {
    color: #777;
    font-size: 13px;
    margin-left: auto;
}

.delete-block {
    background: #a00000;
    color: white;
    padding: 7px 12px;
    font-size: 13px;
}

.content-block textarea {
    min-height: 150px;
    resize: vertical;
    line-height: 1.6;
}

.image-file-input {
    margin-bottom: 10px;
}

.block-image-preview {
    display: block;
    width: 100%;
    max-width: 800px;
    max-height: 600px;
    object-fit: contain;
    margin: 10px auto 0;
    border-radius: 6px;
    background: white;
}

/* ==============================
   VISTA PREVIA
============================== */

.preview {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid #ddd;
}

.preview h3 {
    text-align: center;
    margin-bottom: 20px;
}

.preview-text {
    max-width: 750px;
    margin: 25px auto;
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 18px;
}

.preview-image {
    display: block;
    width: 100%;
    max-width: 800px;
    max-height: 700px;
    object-fit: contain;
    margin: 20px auto;
    border-radius: 5px;
}

/* ==============================
   PROGRESO
============================== */

.progress {
    display: none;
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #333;
    transition: width 0.2s;
}

/* ==============================
   MENSAJES
============================== */

.message {
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    display: none;
}

.error {
    background: #ffe0e0;
    color: #a00000;
    border: 1px solid #e0a0a0;
}

.success {
    background: #e0f5e5;
    color: #176b2c;
    border: 1px solid #a0d0aa;
}

/* ==============================
   CELULAR
============================== */

@media (max-width: 600px) {

    .container {
        padding: 18px 12px;
    }

    .story-info,
    .editor {
        padding: 18px;
    }

    .story-info h1 {
        font-size: 24px;
    }

    .buttons,
    .chapter-actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .content-block-header {
        flex-wrap: wrap;
    }

    .content-block-number {
        margin-left: 0;
        width: 100%;
    }

}

</style>

<script>

/* ==========================================
   VARIABLES
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");


let editingChapterId =
    null;


let currentUser =
    null;


let isAdmin =
    false;


let hasPermission =
    false;


let contentBlocks =
    [];


let originalImageIds =
    [];


/* ==========================================
   COMPROBAR ID
========================================== */

if (!storyId) {

    showError(
        "No se indicó ninguna historia."
    );

} else {

    initializePage();

}


/* ==========================================
   INICIALIZAR
========================================== */

async function initializePage() {

    const loggedIn =
        await checkCurrentUser();


    if (!loggedIn) {

        return;

    }


    await loadStory();

}


/* ==========================================
   COMPROBAR USUARIO ACTUAL
========================================== */

async function checkCurrentUser() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.loggedIn
        ) {

            window.location.href =
                "login.html";

            return false;

        }


        currentUser =
            data.user;


        /* ==============================
           COMPROBAR ADMIN
        ============================== */

        try {

            const adminResponse =
                await fetch(
                    "/api/admin/check",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );


            const adminData =
                await adminResponse.json();


            if (
                adminResponse.ok &&
                adminData.success &&
                adminData.loggedIn &&
                adminData.isAdmin
            ) {

                isAdmin =
                    true;

            }

        } catch (adminError) {

            console.error(
                "Error comprobando administrador:",
                adminError
            );

            isAdmin =
                false;

        }


        return true;


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo comprobar el usuario."
        );

        return false;

    }

}


/* ==========================================
   CARGAR HISTORIA
========================================== */

async function loadStory() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo cargar la historia."
            );

            return;

        }


        const story =
            data.story;


        document.getElementById(
            "story-title"
        ).textContent =
            story.title || "";


        document.getElementById(
            "story-author"
        ).textContent =
            story.author ||
            "Autor";


        document.getElementById(
            "story-description"
        ).textContent =
            story.description ||
            "";


        document.getElementById(
            "story-genre"
        ).textContent =
            story.genre ||
            "";


        /* ==============================
           PERMISOS
        ============================== */

        if (isAdmin) {

            hasPermission =
                true;

            await loadChapters();

            return;

        }


        if (
            currentUser &&
            Number(currentUser.id) ===
            Number(story.user_id)
        ) {

            hasPermission =
                true;

            await loadChapters();

            return;

        }


        hasPermission =
            false;


        showError(
            "No tienes permiso para editar esta historia."
        );


        document.querySelector(
            ".editor"
        ).style.display =
            "none";


        document.getElementById(
            "chapters-container"
        ).innerHTML =
            "<p>No tienes permiso para modificar los capítulos de esta historia.</p>";


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   CARGAR CAPÍTULOS
========================================== */

async function loadChapters() {

    const container =
        document.getElementById(
            "chapters-container"
        );


    container.innerHTML =
        "<p>Cargando capítulos...</p>";


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            container.innerHTML =
                "<p>No se pudieron cargar los capítulos.</p>";

            return;

        }


        const chapters =
            data.chapters || [];


        if (!chapters.length) {

            container.innerHTML =
                "<p>Aún no hay capítulos.</p>";

            return;

        }


        container.innerHTML =
            "";


        chapters.forEach(
            function(chapter) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "chapter-card";


                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "chapter-number";


                number.textContent =
                    "CAPÍTULO " +
                    chapter.chapter_number;


                const title =
                    document.createElement(
                        "h3"
                    );


                title.textContent =
                    chapter.title ||
                    "Sin título";


                const preview =
                    document.createElement(
                        "div"
                    );


                preview.className =
                    "chapter-preview";


                preview.textContent =
                    obtenerVistaPrevia(
                        chapter.content
                    );


                const actions =
                    document.createElement(
                        "div"
                    );


                actions.className =
                    "chapter-actions";


                const editButton =
                    document.createElement(
                        "button"
                    );


                editButton.className =
                    "edit-button";


                editButton.textContent =
                    "Editar";


                editButton.onclick =
                    function() {

                        editChapter(
                            chapter.id
                        );

                    };


                const removeButton =
                    document.createElement(
                        "button"
                    );


                removeButton.className =
                    "remove-button";


                removeButton.textContent =
                    "Eliminar";


                removeButton.onclick =
                    function() {

                        deleteChapter(
                            chapter.id
                        );

                    };


                actions.appendChild(
                    editButton
                );


                actions.appendChild(
                    removeButton
                );


                card.appendChild(
                    number
                );


                card.appendChild(
                    title
                );


                card.appendChild(
                    preview
                );


                card.appendChild(
                    actions
                );


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Error cargando capítulos.</p>";

    }

}


/* ==========================================
   VISTA PREVIA DE CAPÍTULO
========================================== */

function obtenerVistaPrevia(
    content
) {

    const blocks =
        parseContent(content);


    if (!blocks.length) {

        return "";

    }


    let result =
        "";


    for (
        const block of blocks
    ) {

        if (
            block.type === "text"
        ) {

            result +=
                String(
                    block.content || ""
                ) +
                " ";

        }


        if (
            block.type === "image"
        ) {

            result +=
                "[Imagen] ";

        }


        if (
            result.length >= 300
        ) {

            break;

        }

    }


    result =
        result.trim();


    if (
        result.length > 300
    ) {

        result =
            result.substring(
                0,
                300
            ) +
            "...";

    }


    return result;

}


/* ==========================================
   PARSEAR CONTENIDO
========================================== */

function parseContent(
    content
) {

    if (!content) {

        return [];

    }


    if (Array.isArray(content)) {

        return normalizarBloques(
            content
        );

    }


    if (
        typeof content ===
        "object"
    ) {

        if (
            Array.isArray(
                content.blocks
            )
        ) {

            return normalizarBloques(
                content.blocks
            );

        }


        return [];

    }


    if (
        typeof content !==
        "string"
    ) {

        return [];

    }


    try {

        const parsed =
            JSON.parse(
                content
            );


        if (
            Array.isArray(parsed)
        ) {

            return normalizarBloques(
                parsed
            );

        }


        if (
            parsed &&
            Array.isArray(
                parsed.blocks
            )
        ) {

            return normalizarBloques(
                parsed.blocks
            );

        }

    } catch (error) {

        /*
         * Compatibilidad con capítulos
         * antiguos guardados como texto plano.
         */

        return [
            {
                type: "text",
                content: content
            }
        ];

    }


    return [];

}


/* ==========================================
   NORMALIZAR BLOQUES
========================================== */

function normalizarBloques(
    sourceBlocks
) {

    return sourceBlocks.map(
        function(block) {

            if (
                block &&
                block.type === "image"
            ) {

                return {

                    type:
                        "image",

                    image_id:
                        block.image_id
                            ? Number(
                                block.image_id
                            )
                            : null,

                    image_url:
                        block.image_url ||
                        "",

                    filename:
                        block.filename ||
                        "",

                    file:
                        null,

                    preview:
                        null

                };

            }


            return {

                type:
                    "text",

                content:
                    (
                        block &&
                        (
                            block.content ??
                            block.text
                        )
                    ) || ""

            };

        }
    );

}


/* ==========================================
   AGREGAR BLOQUE TEXTO
========================================== */

function addTextBlock() {

    contentBlocks.push({

        type:
            "text",

        content:
            ""

    });


    renderBlocks();

}


/* ==========================================
   AGREGAR BLOQUE IMAGEN
========================================== */

function addImageBlock() {

    contentBlocks.push({

        type:
            "image",

        image_id:
            null,

        image_url:
            "",

        filename:
            "",

        file:
            null,

        preview:
            null

    });


    renderBlocks();

}


/* ==========================================
   ELIMINAR BLOQUE
========================================== */

function removeBlock(
    index
) {

    contentBlocks.splice(
        index,
        1
    );


    renderBlocks();

}


/* ==========================================
   RENDERIZAR BLOQUES
========================================== */

function renderBlocks() {

    const container =
        document.getElementById(
            "blocks-container"
        );


    container.innerHTML =
        "";


    contentBlocks.forEach(
        function(block, index) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "content-block";


            /* ==============================
               CABECERA
            ============================== */

            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "content-block-header";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "content-block-title";


            title.textContent =
                block.type === "image"
                    ? "🖼️ Imagen"
                    : "📝 Texto";


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "content-block-number";


            number.textContent =
                "Bloque " +
                (index + 1);


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "delete-block";


            deleteButton.textContent =
                "Eliminar";


            deleteButton.onclick =
                function() {

                    removeBlock(
                        index
                    );

                };


            header.appendChild(
                title
            );


            header.appendChild(
                number
            );


            header.appendChild(
                deleteButton
            );


            element.appendChild(
                header
            );


            /* ==============================
               BLOQUE TEXTO
            ============================== */

            if (
                block.type === "text"
            ) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.placeholder =
                    "Escribe el texto que aparecerá entre las imágenes...";


                textarea.value =
                    block.content || "";


                textarea.oninput =
                    function() {

                        block.content =
                            textarea.value;


                        updatePreview();

                    };


                element.appendChild(
                    textarea
                );

            }


            /* ==============================
               BLOQUE IMAGEN
            ============================== */

            if (
                block.type === "image"
            ) {

                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "file";


                input.className =
                    "image-file-input";


                input.accept =
                    "image/jpeg,image/png,image/webp,image/gif";


                input.onchange =
                    function(event) {

                        const file =
                            event.target.files[0];


                        if (!file) {

                            return;

                        }


                        const maxSize =
                            10 * 1024 * 1024;


                        if (
                            file.size >
                            maxSize
                        ) {

                            showError(
                                "La imagen no puede superar los 10 MB."
                            );


                            input.value =
                                "";


                            return;

                        }


                        block.file =
                            file;


                        block.image_id =
                            null;


                        block.image_url =
                            "";


                        block.filename =
                            file.name;


                        const reader =
                            new FileReader();


                        reader.onload =
                            function(e) {

                                block.preview =
                                    e.target.result;


                                renderBlocks();

                            };


                        reader.readAsDataURL(
                            file
                        );

                    };


                element.appendChild(
                    input
                );


                const src =
    block.preview ||
    block.image_url ||
    "";


                if (src) {

                    const img =
                        document.createElement(
                            "img"
                        );


                    img.className =
                        "block-image-preview";


                    img.src =
                        src;


                    img.alt =
                        block.filename ||
                        "Imagen";


                    element.appendChild(
                        img
                    );

                }

            }


            container.appendChild(
                element
            );

        }
    );


    updatePreview();

}


/* ==========================================
   EDITAR CAPÍTULO
========================================== */

async function editChapter(
    chapterId
) {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    try {

        /* ======================================
           1. CARGAR CAPÍTULO
        ====================================== */

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudieron cargar los capítulos."
            );

            return;

        }


        const chapter =
            (data.chapters || []).find(
                function(item) {

                    return (
                        Number(item.id) ===
                        Number(chapterId)
                    );

                }
            );


        if (!chapter) {

            showError(
                "El capítulo no existe."
            );

            return;

        }


        /* ======================================
           2. ESTABLECER CAPÍTULO EN EDICIÓN
        ====================================== */

        editingChapterId =
            Number(chapter.id);


        document.getElementById(
            "editor-title"
        ).textContent =
            "Editar capítulo " +
            chapter.chapter_number;


        document.getElementById(
            "chapter-title"
        ).value =
            chapter.title || "";


        /* ======================================
           3. CARGAR BLOQUES
        ====================================== */

        contentBlocks =
            parseContent(
                chapter.content
            );


        /* ======================================
           4. CARGAR IMÁGENES DEL CAPÍTULO
        ====================================== */

        let images = [];


        try {

            const imagesResponse =
                await fetch(
                    "/api/chapters/" +
                    chapter.id +
                    "/images",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );


            const imagesData =
                await imagesResponse.json();


            if (
                imagesResponse.ok &&
                imagesData.success
            ) {

                images =
                    imagesData.images || [];

            }

        } catch (imageError) {

            console.warn(
                "No se pudieron cargar las imágenes del capítulo:",
                imageError
            );

        }


        /* ======================================
           5. ASOCIAR URL REAL A CADA BLOQUE
        ====================================== */

        contentBlocks =
            contentBlocks.map(
                function(block) {

                    if (
                        block.type !== "image"
                    ) {

                        return block;

                    }


                    const imageId =
                        Number(
                            block.image_id
                        );


                    if (!imageId) {

                        return block;

                    }


                    const image =
                        images.find(
                            function(item) {

                                return (
                                    Number(item.id) ===
                                    imageId
                                );

                            }
                        );


                    if (image) {

                        /*
                         * El endpoint puede devolver
                         * image_url o url dependiendo
                         * de cómo esté implementada
                         * la ruta.
                         */

                        block.image_url =
                            image.image_url ||
                            image.url ||
                            image.src ||
                            "";


                        block.filename =
                            image.filename ||
                            image.name ||
                            block.filename ||
                            "";

                    }


                    return block;

                }
            );


        /* ======================================
           6. GUARDAR IDS ORIGINALES
        ====================================== */

        originalImageIds =
            contentBlocks
                .filter(
                    function(block) {

                        return (
                            block.type === "image" &&
                            block.image_id
                        );

                    }
                )
                .map(
                    function(block) {

                        return Number(
                            block.image_id
                        );

                    }
                );


        /* ======================================
           7. MOSTRAR BLOQUES
        ====================================== */

        renderBlocks();


        /* ======================================
           8. MOSTRAR CANCELAR
        ====================================== */

        document.getElementById(
            "cancel-button"
        ).style.display =
            "inline-block";


        /* ======================================
           9. SUBIR AL EDITOR
        ====================================== */

        document.getElementById(
            "editor-title"
        ).scrollIntoView({
            behavior: "smooth",
            block: "start"
        });


    } catch (error) {

        console.error(
            "Error editando capítulo:",
            error
        );


        showError(
            error.message ||
            "No se pudo cargar el capítulo."
        );

    }

}

/* ==========================================
   GUARDAR CAPÍTULO
========================================== */

async function saveChapter() {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const title =
        document.getElementById(
            "chapter-title"
        ).value.trim();


    if (!title) {

        showError(
            "Escribe un título para el capítulo."
        );

        return;

    }


    if (!contentBlocks.length) {

        showError(
            "Añade al menos un bloque de texto o imagen."
        );

        return;

    }


    /* ==============================
       VALIDAR BLOQUES
    ============================== */

    for (
        let i = 0;
        i < contentBlocks.length;
        i++
    ) {

        const block =
            contentBlocks[i];


        if (
            block.type === "text"
        ) {

            if (
                !String(
                    block.content || ""
                ).trim()
            ) {

                showError(
                    "El bloque de texto " +
                    (i + 1) +
                    " está vacío."
                );

                return;

            }

        }


        if (
            block.type === "image"
        ) {

            if (
                !block.file &&
                !block.image_id
            ) {

                showError(
                    "El bloque de imagen " +
                    (i + 1) +
                    " no tiene ninguna imagen."
                );

                return;

            }

        }

    }


    const saveButton =
        document.getElementById(
            "save-button"
        );


    saveButton.disabled =
        true;


    saveButton.textContent =
        "Guardando...";


    const progress =
        document.getElementById(
            "upload-progress"
        );


    const progressBar =
        document.getElementById(
            "upload-progress-bar"
        );


    progress.style.display =
        "block";


    progressBar.style.width =
        "0%";


    try {

        /* ==============================
           IMÁGENES NUEVAS
        ============================== */

        const newImages =
            contentBlocks.filter(
                function(block) {

                    return (
                        block.type === "image" &&
                        block.file
                    );

                }
            );


        let uploaded =
            0;


        for (
            const block of contentBlocks
        ) {

            if (
                block.type !== "image" ||
                !block.file
            ) {

                continue;

            }


            const compressedFile =
                await comprimirImagen(
                    block.file,
                    1600,
                    1600,
                    0.82
                );


            const formData =
                new FormData();


            formData.append(
                "image",
                compressedFile
            );


            /*
             * IMPORTANTE:
             *
             * Las imágenes se suben al capítulo
             * específico.
             */

            const response =
                await fetch(
                    "/api/chapters/" +
                    (
                        editingChapterId
                            ? editingChapterId
                            : await crearCapituloTemporal(
                                title
                            )
                    ) +
                    "/images",
                    {
                        method: "POST",
                        credentials: "include",
                        body: formData
                    }
                );


            const responseText =
                await response.text();


            let data =
                null;


            if (
                responseText.trim()
            ) {

                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                } catch (error) {

                    throw new Error(
                        "El servidor devolvió una respuesta inválida al subir la imagen. HTTP " +
                        response.status
                    );

                }

            }


            if (!response.ok) {

                throw new Error(
                    data?.error ||
                    "No se pudo subir la imagen. HTTP " +
                    response.status
                );

            }


            if (
                !data ||
                !data.success ||
                !data.image
            ) {

                throw new Error(
                    data?.error ||
                    "El servidor no devolvió correctamente la información de la imagen."
                );

            }


            block.image_id =
                Number(
                    data.image.id
                );


            block.image_url =
                data.image.image_url ||
                "";


            block.filename =
                data.image.filename ||
                compressedFile.name;


            block.file =
                null;


            block.preview =
                null;


            uploaded++;


            if (
                newImages.length
            ) {

                progressBar.style.width =
                    (
                        uploaded /
                        newImages.length *
                        70
                    ) +
                    "%";

            }

        }


        /*
         * Si era un capítulo nuevo y se utilizó
         * una imagen, crearCapituloTemporal()
         * ya habrá establecido editingChapterId.
         */

        if (!editingChapterId) {

            /*
             * Si el capítulo no tenía imágenes,
             * todavía debemos crearlo.
             */

            await crearCapituloConContenido(
                title
            );

            progressBar.style.width =
                "100%";


            showSuccess(
                "Capítulo creado correctamente."
            );


            clearEditor();


            await loadChapters();


            return;

        }


        /* ==============================
           CONTENIDO LIMPIO
        ============================== */

        const cleanBlocks =
            contentBlocks.map(
                function(block) {

                    if (
                        block.type === "image"
                    ) {

                        return {

                            type:
                                "image",

                            image_id:
                                Number(
                                    block.image_id
                                ),

                            image_url:
                                block.image_url ||
                                "",

                            filename:
                                block.filename ||
                                ""

                        };

                    }


                    return {

                        type:
                            "text",

                        content:
                            String(
                                block.content ||
                                ""
                            )

                    };

                }
            );


        const content =
            JSON.stringify({

                version:
                    1,

                blocks:
                    cleanBlocks

            });


        progressBar.style.width =
            "82%";


        /* ==============================
           GUARDAR CAPÍTULO
        ============================== */

        const response =
            await fetch(
                "/api/chapters/" +
                editingChapterId,
                {
                    method: "PUT",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            title:
                                title,
                            content:
                                content
                        })
                }
            );


        const responseText =
            await response.text();


        let data =
            null;


        if (
            responseText.trim()
        ) {

            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (error) {

                throw new Error(
                    "El servidor devolvió una respuesta inválida al guardar el capítulo. HTTP " +
                    response.status
                );

            }

        }


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "No se pudo guardar el capítulo. HTTP " +
                response.status
            );

        }


        if (
            data &&
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "No se pudo guardar el capítulo."
            );

        }


        /* ==============================
           ELIMINAR IMÁGENES QUITADAS
        ============================== */

        const currentImageIds =
            contentBlocks
                .filter(
                    function(block) {

                        return (
                            block.type === "image" &&
                            block.image_id
                        );

                    }
                )
                .map(
                    function(block) {

                        return Number(
                            block.image_id
                        );

                    }
                );


        const imagesToDelete =
            originalImageIds.filter(
                function(imageId) {

                    return (
                        !currentImageIds.includes(
                            Number(imageId)
                        )
                    );

                }
            );


        for (
            const imageId of imagesToDelete
        ) {

            try {

                await fetch(
                    "/api/chapter-images/" +
                    imageId,
                    {
                        method: "DELETE",
                        credentials: "include"
                    }
                );

            } catch (deleteError) {

                console.warn(
                    "No se pudo eliminar una imagen antigua:",
                    deleteError
                );

            }

        }


        originalImageIds =
            currentImageIds.slice();


        progressBar.style.width =
            "100%";


        showSuccess(
            "Capítulo actualizado correctamente."
        );


        clearEditor();


        await loadChapters();


    } catch (error) {

        console.error(
            "Error guardando capítulo:",
            error
        );


        showError(
            error.message ||
            "No se pudo guardar el capítulo."
        );


    } finally {

        saveButton.disabled =
            false;


        saveButton.textContent =
            "Guardar capítulo";


        setTimeout(
            function() {

                progress.style.display =
                    "none";

            },
            1000
        );

    }

}

async function crearCapituloConContenido(

) {

    const cleanBlocks =
        contentBlocks.map(
            function(block) {

                    block.type === "image"
                ) {

                    return {

                        type:
                            "image",

                        image_id:
                            Number(
                                block.image_id
                            ),

                        image_url:
                            block.image_url ||
                            "",

                        filename:
                            block.filename ||
                            ""

                    };

                }


                return {

                    type:
                        "text",

                    content:
                        String(
                            block.content ||
                            ""
                        )

                };

            }
        );


    const content =
        JSON.stringify({

            version:
                1,

            blocks:
                cleanBlocks

        });


    const response =
        await fetch(
            "/api/stories/" +
            storyId +
            "/chapters",
            {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        title:
                            title,
                        content:
                            content
                    })
            }
        );


    const responseText =
        await response.text();


    let data =
        null;


    if (
        responseText.trim()
    ) {

        try {

            data =
                JSON.parse(
                    responseText
                );

        } catch (error) {

            throw new Error(
                "El servidor devolvió una respuesta inválida al crear el capítulo."
            );

        }

    }


    if (!response.ok) {

        throw new Error(
            data?.error ||
            "No se pudo crear el capítulo."
        );

    }


    if (
        !data ||
        !data.success ||
        !data.chapter
    ) {

        throw new Error(
            data?.error ||
            "El servidor no devolvió correctamente el capítulo."
        );

    }


    editingChapterId =
        Number(
            data.chapter.id
        );


    return data.chapter;

}

                );

        return;

    }


    try {

        const response =
            await fetch(

                chapterId,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );


        const responseText =
            await response.text();


        let data =
            null;


        if (
            responseText.trim()
        ) {

            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (error) {

                throw new Error(
                    "El servidor devolvió una respuesta inválida."
                );

            }

        }


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "No se pudo eliminar el capítulo."
            );

        }


        if (
            data &&
            data.success === false
        ) {

            throw new Error(
                data.error ||

            );

        }


        if (
            Number(editingChapterId) ===
            Number(chapterId)
        ) {

        );


        await loadChapters();

/* ==========================================
   VISTA PREVIA
========================================== */

function updatePreview() {

    const preview =
        document.getElementById(
            "preview"
        );


    const container =
        document.getElementById(
            "preview-content"
        );


    if (
        !contentBlocks.length
    ) {

        preview.style.display =
            "none";

        return;

    }


    preview.style.display =
        "block";


    container.innerHTML =
        "";


    contentBlocks.forEach(
        function(block) {

            if (
                block.type === "text"
            ) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "preview-text";


                text.textContent =
                    block.content || "";


                if (
                    text.textContent.trim()
                ) {

                    container.appendChild(
                        text
                    );

                }

            }


            if (
                block.type === "image"
            ) {

                const src =
                    block.preview ||
                    block.image_url;


                if (!src) {

                    return;

                }


                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "preview-image";


                img.src =
                    src;


                img.alt =
                    block.filename ||
                    "Imagen";


                container.appendChild(
                    img
                );

            }

        }
    );

}


/* ==========================================
   COMPRESIÓN DE IMÁGENES
========================================== */

function comprimirImagen(
    file,
    maxWidth = 1600,
    maxHeight = 1600,
    quality = 0.82
) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                            let width =
                                img.width;


                            let height =
                                img.height;


                            if (
                                width >
                                maxWidth ||
                                height >
                                maxHeight
                            ) {

                                const scale =
                                    Math.min(
                                        maxWidth /
                                        width,

                                        maxHeight /
                                        height
                                    );


                                width =
                                    Math.round(
                                        width *
                                        scale
                                    );


                                height =
                                    Math.round(
                                        height *
                                        scale
                                    );

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            /*
                             * Fondo blanco para evitar
                             * transparencias negras al
                             * convertir a JPG.
                             */

                            ctx.fillStyle =
                                "#ffffff";


                            ctx.fillRect(
                                0,
                                0,
                                width,
                                height
                            );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                function(blob) {

                                    if (!blob) {

                                        reject(
                                            new Error(
                                                "No se pudo convertir la imagen a JPG."
                                            )
                                        );

                                        return;

                                    }


                                    const nombre =
                                        file.name.replace(
                                            /\.[^/.]+$/,
                                            ""
                                        ) +
                                        ".jpg";


                                    const compressedFile =
                                        new File(
                                            [blob],
                                            nombre,
                                            {
                                                type:
                                                    "image/jpeg",

                                                lastModified:
                                                    Date.now()
                                            }
                                        );


                                    resolve(
                                        compressedFile
                                    );


                                },
                                "image/jpeg",
                                quality
                            );

                        };


                    img.onerror =
                        function() {

                            reject(
                                new Error(
                                    "No se pudo cargar la imagen."
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "No se pudo leer la imagen."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}

function showError(
    message
) {

    const element =
        document.getElementById(
            "error-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "success-message"
    ).style.display =
        "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function showSuccess(
    message
) {

    const element =
        document.getElementById(
            "success-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "error-message"
    ).style.display =
        "none";


    setTimeout(
        function() {

            element.style.display =
                "none";

        },
        4000
    );

}


/* ==========================================
   INICIO

</script>
