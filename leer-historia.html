<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Leer historia - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f4f4;

    color: #222;
}


/* ==============================
   CABECERA
   ============================== */

header {

    background: #20242b;

    color: white;

    padding: 15px 20px;

    position: sticky;

    top: 0;

    z-index: 10;
}


.header-content {

    max-width: 900px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}


.logo {

    font-size: 24px;

    font-weight: bold;
}


nav {

    display: flex;

    gap: 15px;
}


nav a {

    color: white;

    text-decoration: none;

    font-size: 14px;
}


nav a:hover {

    text-decoration: underline;
}


/* ==============================
   CONTENEDOR
   ============================== */

.container {

    max-width: 900px;

    margin: auto;

    padding: 30px 20px;
}


/* ==============================
   HISTORIA
   ============================== */

.story {

    background: white;

    border-radius: 12px;

    padding: 35px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}


.story h1 {

    margin-top: 0;

    margin-bottom: 10px;

    font-size: 34px;
}


.author {

    color: #777;

    font-size: 14px;

    margin-bottom: 20px;
}


.tag {

    display: inline-block;

    background: #eee;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    margin-bottom: 25px;
}


.description {

    color: #555;

    font-size: 17px;

    line-height: 1.7;

    white-space: pre-line;
}


/* ==============================
   SEPARADOR
   ============================== */

.separator {

    height: 1px;

    background: #ddd;

    margin: 30px 0;
}


/* ==============================
   MENSAJES
   ============================== */

.loading {

    text-align: center;

    padding: 50px 20px;

    color: #777;
}


.error {

    background: white;

    border-radius: 10px;

    padding: 30px;

    text-align: center;

    color: #c0392b;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}


/* ==============================
   BOTÓN
   ============================== */

.back-button {

    display: inline-block;

    margin-top: 30px;

    padding: 11px 18px;

    background: #20242b;

    color: white;

    text-decoration: none;

    border-radius: 7px;

    font-size: 14px;
}


.back-button:hover {

    background: #343a40;
}


/* ==============================
   FOOTER
   ============================== */

footer {

    background: #20242b;

    color: #aaa;

    text-align: center;

    padding: 30px;

    margin-top: 40px;

    font-size: 13px;
}


/* ==============================
   CELULAR
   ============================== */

@media (max-width: 600px) {

    .header-content {

        flex-direction: column;

        align-items: flex-start;
    }


    nav {

        width: 100%;

        justify-content: space-between;
    }


    .container {

        padding: 20px 12px;
    }


    .story {

        padding: 22px;
    }


    .story h1 {

        font-size: 27px;
    }


    .description {

        font-size: 16px;
    }

}

</style>

</head>


<body>


<!-- ==============================
     CABECERA
     ============================== -->

<header>

    <div class="header-content">

        <div class="logo">
            ComicWorldFiles
        </div>


        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="index.html">
                Historias
            </a>

        </nav>

    </div>

</header>



<!-- ==============================
     CONTENIDO
     ============================== -->

<main class="container">

    <div id="loading"
         class="loading">

        Cargando historia...

    </div>


    <div id="error"
         class="error"
         style="display:none;">

        <h2>
            No se pudo cargar la historia
        </h2>

        <p id="error-message">
            Ha ocurrido un error.
        </p>

        <a class="back-button"
           href="index.html">

            Volver al inicio

        </a>

    </div>


    <article id="story"
             class="story"
             style="display:none;">

        <h1 id="story-title"></h1>


        <div class="author">

            Por
            <strong id="story-author"></strong>

        </div>


        <span id="story-genre"
              class="tag">
        </span>


        <div class="separator"></div>


        <div id="story-description"
             class="description">
        </div>


        <a class="back-button"
           href="index.html">

            ← Volver

        </a>

    </article>

</main>



<!-- ==============================
     FOOTER
     ============================== -->

<footer>

    ComicWorldFiles © 2026

    <br>
    <br>

    Una plataforma para publicar y descubrir historias independientes.

</footer>



<script>


// ==========================================
// OBTENER ID DE LA HISTORIA
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");


// ==========================================
// ELEMENTOS
// ==========================================

const loading =
    document.getElementById(
        "loading"
    );


const story =
    document.getElementById(
        "story"
    );


const error =
    document.getElementById(
        "error"
    );


const errorMessage =
    document.getElementById(
        "error-message"
    );


// ==========================================
// COMPROBAR ID
// ==========================================

if (!storyId) {

    mostrarError(
        "No se indicó qué historia quieres leer."
    );

} else {

    cargarHistoria(
        storyId
    );
}


// ==========================================
// CARGAR HISTORIA
// ==========================================

async function cargarHistoria(id) {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                encodeURIComponent(id)
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "No se pudo cargar la historia."
            );
        }


        mostrarHistoria(
            data.story
        );


    } catch (err) {

        console.error(
            "Error cargando historia:",
            err
        );


        mostrarError(
            err.message
        );
    }
}


// ==========================================
// MOSTRAR HISTORIA
// ==========================================

function mostrarHistoria(data) {

    document.getElementById(
        "story-title"
    ).textContent =
        data.title;


    document.getElementById(
        "story-author"
    ).textContent =
        data.author;


    document.getElementById(
        "story-genre"
    ).textContent =
        data.genre;


    document.getElementById(
        "story-description"
    ).textContent =
        data.description;


    loading.style.display =
        "none";


    story.style.display =
        "block";
}


// ==========================================
// MOSTRAR ERROR
// ==========================================

function mostrarError(message) {

    loading.style.display =
        "none";


    errorMessage.textContent =
        message;


    error.style.display =
        "block";
}

</script>


</body>

</html>
