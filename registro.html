<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Crear cuenta - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f4f4;

    color: #222;
}

header {

    background: #20242b;

    color: white;

    padding: 15px 20px;
}

.header-content {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.logo {

    font-size: 24px;

    font-weight: bold;
}

nav a {

    color: white;

    text-decoration: none;

    margin-left: 15px;

    font-size: 14px;
}

.container {

    max-width: 500px;

    margin: 50px auto;

    padding: 20px;
}

.box {

    background: white;

    padding: 30px;

    border-radius: 12px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}

h1 {

    margin-top: 0;

    text-align: center;
}

.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;
}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 6px;

    font-weight: bold;

    font-size: 14px;
}

input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 7px;

    font-size: 15px;
}

button {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: none;

    border-radius: 7px;

    background: #ff6b35;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {

    background: #e85b2b;
}

.message {

    margin-top: 15px;

    padding: 10px;

    border-radius: 6px;

    display: none;

    text-align: center;

    font-size: 14px;
}

.error {

    display: block;

    background: #ffe5e5;

    color: #a00000;
}

.success {

    display: block;

    background: #e3f7e8;

    color: #176b2c;
}

.login-link {

    text-align: center;

    margin-top: 20px;

    color: #666;

    font-size: 14px;
}

.login-link a {

    color: #ff6b35;

    text-decoration: none;

    font-weight: bold;
}

footer {

    text-align: center;

    color: #888;

    font-size: 13px;

    padding: 30px;
}

</style>

</head>

<body>

<header>

<div class="header-content">

<div class="logo">
📚 ComicWorldFiles
</div>

<nav>

<a href="index.html">
Inicio
</a>

<a href="login.html">
Iniciar sesión
</a>

</nav>

</div>

</header>


<main class="container">

<div class="box">

<h1>Crear cuenta</h1>

<p class="subtitle">
Únete a ComicWorldFiles y publica tus historias.
</p>


<form id="registerForm">

<label for="username">
Nombre de usuario
</label>

<input
type="text"
id="username"
name="username"
placeholder="Tu nombre de usuario"
required
>


<label for="email">
Correo electrónico
</label>

<input
type="email"
id="email"
name="email"
placeholder="correo@ejemplo.com"
required
>


<label for="password">
Contraseña
</label>

<input
type="password"
id="password"
name="password"
placeholder="Mínimo 6 caracteres"
required
>


<label for="password2">
Repetir contraseña
</label>

<input
type="password"
id="password2"
name="password2"
placeholder="Repite tu contraseña"
required
>


<button type="submit">
Crear cuenta
</button>

</form>


<div id="message" class="message"></div>


<div class="login-link">

¿Ya tienes una cuenta?

<a href="login.html">
Iniciar sesión
</a>

</div>

</div>

</main>


<footer>

ComicWorldFiles © 2026

</footer>


<script>

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "message";

    message.textContent = "";


    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const password2 =
        document.getElementById("password2").value;


    if (password !== password2) {

        message.textContent =
            "Las contraseñas no coinciden.";

        message.className =
            "message error";

        return;
    }


    try {

        const response = await fetch(
            "/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    email,
                    password
                })
            }
        );


        const data =
            await response.json();


        if (!data.success) {

            message.textContent =
                data.error ||
                "No se pudo crear la cuenta.";

            message.className =
                "message error";

            return;
        }


        message.textContent =
            "Cuenta creada correctamente. Redirigiendo al login...";

        message.className =
            "message success";


        form.reset();


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1500);


    } catch (error) {

        message.textContent =
            "Error de conexión con el servidor.";

        message.className =
            "message error";
    }

});

</script>

</body>

</html>
