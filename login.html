<script>

const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "message";
    message.textContent = "";


    const login =
        document.getElementById("login").value.trim();

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch(
            "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    login: login,
                    password: password
                })
            }
        );


        const data =
            await response.json();


        if (!data.success) {

            message.textContent =
                data.error ||
                "Usuario o contraseña incorrectos.";

            message.className =
                "message error";

            return;
        }


        /*
        La API debe devolver el nombre de usuario.
        Si no lo devuelve, mostramos un error
        para evitar guardar "undefined".
        */

        if (!data.username) {

            message.textContent =
                "La sesión se inició, pero el servidor no devolvió el nombre de usuario.";

            message.className =
                "message error";

            return;
        }


        /* GUARDAR EL NOMBRE DE USUARIO */

        localStorage.setItem(
            "comicworld_user",
            data.username
        );


        message.textContent =
            "Inicio de sesión correcto. Redirigiendo...";

        message.className =
            "message success";


        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 800);


    } catch (error) {

        message.textContent =
            "Error de conexión con el servidor.";

        message.className =
            "message error";
    }

});

</script>
