<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Editar historia - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

/* ==============================
   CABECERA
============================== */

header {
    background: #20242b;
    color: white;
    padding: 15px 20px;
}

.header-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

.back {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.back:hover {
    text-decoration: underline;
}

/* ==============================
   CONTENEDOR
============================== */

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 15px;
}

/* ==============================
   INFORMACIÓN HISTORIA
============================== */

.story-info {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

.story-info h1 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 30px;
}

.detail {
    color: #666;
    line-height: 1.6;
    margin: 10px 0;
}

.author {
    color: #777;
    font-size: 14px;
}

.genre {
    display: inline-block;
    background: #eee;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 10px;
}

/* ==============================
   CAPÍTULOS
============================== */

.section-title {
    margin: 30px 0 15px;
}

.section-title h2 {
    margin: 0;
}

/* ==============================
   FORMULARIO
============================== */

.editor {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.editor h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 7px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #ff6b35;
}

textarea {
    min-height: 300px;
    resize: vertical;
    line-height: 1.6;
}

/* ==============================
   BOTONES
============================== */

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.save-button {
    background: #ff6b35;
    color: white;
}

.save-button:hover {
    background: #e85a2a;
}

.cancel-button {
    background: #ddd;
    color: #222;
}

.delete-button {
    background: #20242b;
    color: white;
}

/* ==============================
   LISTA DE CAPÍTULOS
============================== */

.chapter-card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.chapter-card h3 {
    margin: 0 0 8px;
}

.chapter-number {
    color: #ff6b35;
    font-size: 13px;
    font-weight: bold;
}

.chapter-preview {
    color: #666;
    line-height: 1.5;
    white-space: pre-wrap;
    max-height: 100px;
    overflow: hidden;
}

.chapter-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.edit-button {
    background: #20242b;
    color: white;
}

.remove-button {
    background: #ddd;
    color: #222;
}

/* ==============================
   PORTADA
============================== */

.cover-editor {
    display: flex;
    flex-direction: column;
}

.cover-preview {
    width: 220px;
    max-width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 15px;
}

.no-cover {
    color: #777;
    margin-bottom: 15px;
}

/* ==============================
   MENSAJES
============================== */

.message {
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    display: none;
}

.error {
    background: #ffe0e0;
    color: #a00000;
}

.success {
    background: #e0f5e5;
    color: #176b2c;
}

/* ==============================
   CELULAR
============================== */

@media (max-width: 600px) {

    .container {
        padding: 18px 12px;
    }

    .story-info,
    .editor {
        padding: 18px;
    }

    .story-info h1 {
        font-size: 24px;
    }

    textarea {
        min-height: 250px;
    }

    .buttons,
    .chapter-actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>

<body>

<header>

<div class="header-content">

<div class="logo">
ComicWorldFiles
</div>

<a class="back"
href="index.html">
← Volver </a>

</div>

</header>

<main class="container">

<!-- ==============================
     PORTADA
============================== -->

<section class="editor">

<h2>
Portada de la historia
</h2>

<div class="cover-editor">

<img
id="cover-preview"
class="cover-preview"
style="display:none;"
alt="Vista previa de la portada"
>

<div
id="no-cover"
class="no-cover">
No hay portada disponible.
</div>

<label for="cover-input">
Seleccionar nueva portada
</label>

<input
type="file"
id="cover-input"
accept="image/*"
onchange="previewCover()"
>

<div class="buttons">

<button
class="save-button"
onclick="uploadCover()">
Guardar portada
</button>

</div>

</div>

</section>

<!-- MENSAJES -->

<div
id="error-message"
class="message error">
</div>

<div
id="success-message"
class="message success">
</div>

<!-- ==============================
     EDITOR
============================== -->

<section class="editor">

<h2 id="editor-title">
Agregar capítulo
</h2>

<label for="chapter-title">
Título del capítulo
</label>

<input
type="text"
id="chapter-title"
placeholder="Ejemplo: El despertar"

>

<label for="chapter-content">
Contenido
</label>

<textarea
id="chapter-content"
placeholder="Escribe aquí el contenido de tu capítulo..."
></textarea>

<div class="buttons">

<button
class="save-button"
onclick="saveChapter()">
Guardar capítulo </button>

<button
class="cancel-button"
id="cancel-button"
onclick="cancelEdit()"
style="display:none;">
Cancelar edición </button>

</div>

</section>

<!-- ==============================
     CAPÍTULOS
============================== -->

<div class="section-title">

<h2>
Capítulos
</h2>

</div>

<section id="chapters-container">

<p>
Cargando capítulos...
</p>

</section>

</main>

<script>

/* ==========================================
   VARIABLES
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    params.get("id");

let editingChapterId = null;

let currentUser = null;

let isAdmin = false;

let hasPermission = false;


/* ==========================================
   COMPROBAR ID
========================================== */

if (!storyId) {

    showError(
        "No se indicó ninguna historia."
    );

} else {

    initializePage();

}


/* ==========================================
   INICIALIZAR
========================================== */

async function initializePage() {

    /*
     * Primero comprobamos la sesión.
     * Después cargamos la historia.
     */

    const loggedIn =
        await checkCurrentUser();

    if (!loggedIn) {

        return;

    }


    await loadStory();

}


/* ==========================================
   COMPROBAR USUARIO ACTUAL
========================================== */

async function checkCurrentUser() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.loggedIn
        ) {

            window.location.href =
                "login.html";

            return false;

        }


        currentUser =
            data.user;


        /*
         * Comprobar si además es administrador.
         *
         * Esta ruta utiliza la comprobación
         * centralizada de worker/routes/admin.js
         */

        try {

            const adminResponse =
                await fetch(
                    "/api/admin/check",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );


            const adminData =
                await adminResponse.json();


            if (
                adminResponse.ok &&
                adminData.success &&
                adminData.loggedIn &&
                adminData.isAdmin
            ) {

                isAdmin = true;

            }

        } catch (adminError) {

            /*
             * Si falla la comprobación del admin,
             * seguimos funcionando como usuario normal.
             */

            console.error(
                "Error comprobando administrador:",
                adminError
            );

            isAdmin = false;

        }


        return true;


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo comprobar el usuario."
        );

        return false;

    }

}


/* ==========================================
   CARGAR HISTORIA
========================================== */

async function loadStory() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo cargar la historia."
            );

            return;

        }


        const story =
            data.story;


        document.getElementById(
            "story-title"
        ).textContent =
            story.title;


        document.getElementById(
            "story-author"
        ).textContent =
            story.author || "Autor";


        document.getElementById(
            "story-description"
        ).textContent =
            story.description || "";


        document.getElementById(
            "story-genre"
        ).textContent =
            story.genre || "";


loadCover();
        
        /*
         * ADMINISTRADOR
         *
         * El administrador puede editar
         * cualquier publicación.
         */

        if (isAdmin) {

            hasPermission = true;

            loadChapters();

            return;

        }


        /*
         * AUTOR
         *
         * Un usuario normal solo puede editar
         * una historia cuyo user_id coincida
         * con su propio ID.
         */

        if (
            Number(currentUser.id) ===
            Number(story.user_id)
        ) {

            hasPermission = true;

            loadChapters();

            return;

        }


        /*
         * SIN PERMISO
         */

        hasPermission = false;


        showError(
            "No tienes permiso para editar esta historia."
        );


        document.querySelector(
            ".editor"
        ).style.display =
            "none";


        document.getElementById(
            "chapters-container"
        ).innerHTML =
            "<p>No tienes permiso para modificar los capítulos de esta historia.</p>";


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}

/* ==========================================
   CARGAR PORTADA
========================================== */

async function loadCover() {

    const preview =
        document.getElementById(
            "cover-preview"
        );

    const noCover =
        document.getElementById(
            "no-cover"
        );


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/cover",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        if (!response.ok) {

            preview.style.display =
                "none";

            noCover.style.display =
                "block";

            return;

        }


        /*
         * Usamos la URL directamente.
         *
         * Agregamos un parámetro para evitar
         * que el navegador muestre una portada
         * antigua guardada en caché.
         */

        preview.src =
            "/api/stories/" +
            storyId +
            "/cover?t=" +
            Date.now();


        preview.style.display =
            "block";

        noCover.style.display =
            "none";


    } catch (error) {

        console.error(
            "Error cargando portada:",
            error
        );

    }

}

/* ==========================================
   CARGAR CAPÍTULOS
========================================== */

async function loadChapters() {

    const container =
        document.getElementById(
            "chapters-container"
        );


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            container.innerHTML =
                "<p>No se pudieron cargar los capítulos.</p>";

            return;

        }


        const chapters =
            data.chapters || [];


        if (chapters.length === 0) {

            container.innerHTML =
                "<p>Aún no hay capítulos.</p>";

            return;

        }


        container.innerHTML = "";


        chapters.forEach(
            function(chapter) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "chapter-card";


                const preview =
                    (chapter.content || "").length > 300
                        ? chapter.content.substring(
                            0,
                            300
                        ) + "..."
                        : (chapter.content || "");


                card.innerHTML =

                    '<div class="chapter-number">' +
                    'CAPÍTULO ' +
                    chapter.chapter_number +
                    '</div>' +

                    '<h3>' +
                    escapeHtml(
                        chapter.title || ""
                    ) +
                    '</h3>' +

                    '<div class="chapter-preview">' +
                    escapeHtml(
                        preview
                    ) +
                    '</div>' +

                    '<div class="chapter-actions">' +

                    '<button ' +
                    'class="edit-button" ' +
                    'onclick="editChapter(' +
                    chapter.id +
                    ')">' +
                    'Editar' +
                    '</button>' +

                    '<button ' +
                    'class="remove-button" ' +
                    'onclick="deleteChapter(' +
                    chapter.id +
                    ')">' +
                    'Eliminar' +
                    '</button>' +

                    '</div>';


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Error cargando capítulos.</p>";

    }

}

/* ==========================================
   VISTA PREVIA DE PORTADA
========================================== */

function previewCover() {

    const input =
        document.getElementById(
            "cover-input"
        );

    const preview =
        document.getElementById(
            "cover-preview"
        );

    const noCover =
        document.getElementById(
            "no-cover"
        );


    const file =
        input.files[0];


    if (!file) {

        return;

    }


    /*
     * Comprobar que sea una imagen
     */

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        showError(
            "Selecciona un archivo de imagen válido."
        );

        input.value =
            "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            preview.src =
                event.target.result;


            preview.style.display =
                "block";


            noCover.style.display =
                "none";

        };


    reader.readAsDataURL(
        file
    );

}

/* ==========================================
   SUBIR PORTADA
========================================== */

async function uploadCover() {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const input =
        document.getElementById(
            "cover-input"
        );


    const file =
        input.files[0];


    if (!file) {

        showError(
            "Selecciona una imagen primero."
        );

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        showError(
            "El archivo seleccionado no es una imagen."
        );

        return;

    }


    try {

        const formData =
            new FormData();


        formData.append(
            "cover",
            file
        );


        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/cover",
                {
                    method: "POST",
                    credentials: "include",
                    body:
                        formData
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo guardar la portada."
            );

            return;

        }


        showSuccess(
            "Portada guardada correctamente."
        );


        /*
         * Limpiar selector
         */

        input.value =
            "";


        /*
         * Recargar portada desde el servidor
         */

        const preview =
            document.getElementById(
                "cover-preview"
            );


        preview.src =
            "/api/stories/" +
            storyId +
            "/cover?t=" +
            Date.now();


        preview.style.display =
            "block";


        document.getElementById(
            "no-cover"
        ).style.display =
            "none";


    } catch (error) {

        console.error(
            "Error subiendo portada:",
            error
        );


        showError(
            "No se pudo conectar con el servidor."
        );

    }

}

/* ==========================================
   GUARDAR CAPÍTULO
========================================== */

async function saveChapter() {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const title =
        document.getElementById(
            "chapter-title"
        ).value.trim();


    const content =
        document.getElementById(
            "chapter-content"
        ).value;


    if (!title) {

        showError(
            "Escribe un título para el capítulo."
        );

        return;

    }


    if (!content.trim()) {

        showError(
            "Escribe el contenido del capítulo."
        );

        return;

    }


    try {

        let response;


        /* ==============================
           CREAR
        ============================== */

        if (!editingChapterId) {

            response =
                await fetch(
                    "/api/stories/" +
                    storyId +
                    "/chapters",
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                title:
                                    title,
                                content:
                                    content
                            })
                    }
                );

        }


        /* ==============================
           EDITAR
        ============================== */

        else {

            response =
                await fetch(
                    "/api/chapters/" +
                    editingChapterId,
                    {
                        method: "PUT",
                        credentials: "include",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                title:
                                    title,
                                content:
                                    content
                            })
                    }
                );

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo guardar el capítulo."
            );

            return;

        }


        showSuccess(
            editingChapterId
                ? "Capítulo actualizado correctamente."
                : "Capítulo creado correctamente."
        );


        clearEditor();

        loadChapters();


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   EDITAR CAPÍTULO
========================================== */

async function editChapter(
    chapterId
) {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                "No se pudo cargar el capítulo."
            );

            return;

        }


        const chapter =
            data.chapters.find(
                function(item) {

                    return Number(item.id) ===
                        Number(chapterId);

                }
            );


        if (!chapter) {

            showError(
                "El capítulo no existe."
            );

            return;

        }


        editingChapterId =
            chapter.id;


        document.getElementById(
            "editor-title"
        ).textContent =
            "Editar capítulo " +
            chapter.chapter_number;


        document.getElementById(
            "chapter-title"
        ).value =
            chapter.title || "";


        document.getElementById(
            "chapter-content"
        ).value =
            chapter.content || "";


        document.getElementById(
            "cancel-button"
        ).style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo cargar el capítulo."
        );

    }

}


/* ==========================================
   ELIMINAR CAPÍTULO
========================================== */

async function deleteChapter(
    chapterId
) {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const confirmed =
        confirm(
            "¿Seguro que quieres eliminar este capítulo?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo eliminar el capítulo."
            );

            return;

        }


        showSuccess(
            "Capítulo eliminado correctamente."
        );


        if (
            Number(editingChapterId) ===
            Number(chapterId)
        ) {

            clearEditor();

        }


        loadChapters();


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   CANCELAR EDICIÓN
========================================== */

function cancelEdit() {

    clearEditor();

}


/* ==========================================
   LIMPIAR EDITOR
========================================== */

function clearEditor() {

    editingChapterId =
        null;


    document.getElementById(
        "editor-title"
    ).textContent =
        "Agregar capítulo";


    document.getElementById(
        "chapter-title"
    ).value =
        "";


    document.getElementById(
        "chapter-content"
    ).value =
        "";


    document.getElementById(
        "cancel-button"
    ).style.display =
        "none";

}


/* ==========================================
   MENSAJES
========================================== */

function showError(message) {

    const element =
        document.getElementById(
            "error-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "success-message"
    ).style.display =
        "none";

}


function showSuccess(message) {

    const element =
        document.getElementById(
            "success-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "error-message"
    ).style.display =
        "none";


    setTimeout(
        function() {

            element.style.display =
                "none";

        },
        3000
    );

}


/* ==========================================
   SEGURIDAD HTML
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}

</script>
