<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport"

<title>Editar historia - ComicWorldFiles</title><style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

}

/* ==============================
   CABECERA
============================== */

header {

    padding: 15px 20px;
}

.header-content {

.logo {

/* ==============================
   PORTADA
============================== */

.cover-section {

}

.cover-placeholder {

}

.cover-input {
    margin-top: 5px;
    padding: 0;
    border: none;
}

.cover-button {
    background: #20242b;
    color: white;
    margin-top: 10px;
}

.cover-button:hover {
    background: #11151a;
}

.cover-status {
    margin-top: 10px;
    font-size: 14px;
    color: #666;
}

/* ==============================
   EDITAR INFORMACIÓN
============================== */

.story-edit {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.story-edit h3 {
    margin-top: 0;
}

.story-edit label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

.story-edit input,
.story-edit select {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 7px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.story-edit input:focus,
.story-edit select:focus {
    outline: none;
    border-color: #ff6b35;
}

.info-save-button {
    background: #ff6b35;
    color: white;
    margin-top: 18px;
}

.info-save-button:hover {
    background: #e85a2a;
}

/* ==============================
   CAPÍTULOS
============================== */

.section-title {
    margin: 30px 0 15px;
}

.section-title h2 {
    margin: 0;
}

/* ==============================
   FORMULARIO
============================== */

.editor {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.editor h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 7px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #ff6b35;
}

textarea {
    min-height: 300px;
    resize: vertical;
    line-height: 1.6;
}

/* ==============================
   BOTONES
============================== */

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.save-button {
    background: #ff6b35;
    color: white;
}

.save-button:hover {
    background: #e85a2a;
}

.cancel-button {
    background: #ddd;
    color: #222;
}

.delete-button {
    background: #20242b;
    color: white;
}

/* ==============================
   LISTA DE CAPÍTULOS
============================== */

.chapter-card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.chapter-card h3 {
    margin: 0 0 8px;
}

.chapter-number {
    color: #ff6b35;
    font-size: 13px;
    font-weight: bold;
}

.chapter-preview {
    color: #666;
    line-height: 1.5;
    white-space: pre-wrap;
    max-height: 100px;
    overflow: hidden;
}

.chapter-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.edit-button {
    background: #20242b;
    color: white;
}

.remove-button {
    background: #ddd;
    color: #222;
}

/* ==============================
   MENSAJES
============================== */

.message {
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    display: none;
}

.error {
    background: #ffe0e0;
    color: #a00000;
}

.success {
    background: #e0f5e5;
    color: #176b2c;
}

/* ==============================
   CELULAR
============================== */

@media (max-width: 600px) {

    .container {
        padding: 18px 12px;
    }

    .story-info,
    .editor {
        padding: 18px;
    }

    .story-info h1 {
        font-size: 24px;
    }

    textarea {
        min-height: 250px;
    }

    .buttons,
    .chapter-actions {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .cover-preview {
        width: 180px;
    }

}

</div></header><main class="container"><!-- ==============================

</h1><div class="author">

</strong>
</div><p class="detail"

</span>

<!-- ==============================

============================== --><div class="story-edit"><h3>
Editar información
</h3><label for="story-title-input">
Título
</label>

<input

>

<label for="story-genre-input">

<input

>

<button

    onclick="saveStoryInfo()">

</div><!-- ==============================

============================== --><div class="cover-section"><h3>
Portada
</h3><div class="cover-preview"><img
id="cover-image"
src=""
alt="Portada de la historia">

<div
id="cover-placeholder"
class="cover-placeholder">Esta historia todavía no tiene portada.

</div></div><div id="cover-controls"><input
type="file"
id="cover-file"
class="cover-input"
accept="image/jpeg,image/png,image/webp">

<button
class="cover-button"

</button></div><div
id="cover-status"
class="cover-status">
</div></div></section><!-- ==============================

============================== --><div

</div><div
id="success-message"
class="message success">
</div><!-- ==============================

============================== --><section class="editor"><h2 id="editor-title">
Agregar capítulo
</h2><label for="chapter-title">
Título del capítulo
</label><input
type="text"
id="chapter-title"
placeholder="Ejemplo: El despertar">

<label for="chapter-content">
Contenido
</label><textarea
id="chapter-content"
placeholder="Escribe aquí el contenido de tu capítulo..."
></textarea><div class="buttons"><button
class="save-button"
onclick="saveChapter()">

Guardar capítulo

</button><button
class="cancel-button"
id="cancel-button"
onclick="cancelEdit()"
style="display:none;">

Cancelar edición

</button></div></section><!-- ==============================
     CAPÍTULOS
============================== --><div class="section-title"><h2>
Capítulos
</h2></div><section id="chapters-container"><p>
Cargando capítulos...
</p></section></main><script>

/* ==========================================
   VARIABLES
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    params.get("id");

let editingChapterId =
    null;

let isAuthor =
    false;


/* ==========================================
   COMPROBAR ID
========================================== */

if (!storyId) {

    showError(
        "No se indicó ninguna historia."
    );

} else {

    loadStory();

    loadChapters();

}


/* ==========================================
   PREVISUALIZAR PORTADA
========================================== */

document.getElementById(
    "cover-file"
).addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            showError(
                "La portada debe ser JPG, PNG o WEBP."
            );

            event.target.value =
                "";

            return;

        }

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            showError(
                "La imagen no puede superar los 5 MB."
            );

            event.target.value =
                "";

            return;

        }

        const previewUrl =
            URL.createObjectURL(
                file
            );

        showCover(
            previewUrl
        );

    }
);


/* ==========================================
   CARGAR HISTORIA
========================================== */

async function loadStory() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId,
                {
                    method: "GET",
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo cargar la historia."
            );

            return;

        }

        const story =
            data.story;


        document.getElementById(
            "story-title"
        ).textContent =
            story.title;


        document.getElementById(
            "story-author"
        ).textContent =
            story.author || "Autor";


        document.getElementById(
            "story-description"
        ).textContent =
            story.description || "";


        document.getElementById(
            "story-genre"
        ).textContent =
            story.genre || "";


        /* ==============================
           CAMPOS EDITABLES
        ============================== */

        document.getElementById(
            "story-title-input"
        ).value =
            story.title || "";


        document.getElementById(
            "story-genre-input"
        ).value =
            story.genre || "";


        /* ==============================
           PORTADA ACTUAL
        ============================== */

        if (story.cover_url) {

            showCover(
                story.cover_url
            );

        }


        await checkAuthor(
            story.user_id
        );


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   GUARDAR INFORMACIÓN DE HISTORIA
========================================== */

async function saveStoryInfo() {

    if (!isAuthor) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const title =
        document.getElementById(
            "story-title-input"
        ).value.trim();


    const genre =
        document.getElementById(
            "story-genre-input"
        ).value.trim();


    if (!title) {

        showError(
            "El título es obligatorio."
        );

        return;

    }


    if (title.length < 2) {

        showError(
            "El título debe tener al menos 2 caracteres."
        );

        return;

    }


    if (!genre) {

        showError(
            "El género es obligatorio."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId,
                {
                    method: "PUT",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            title:
                                title,

                            genre:
                                genre
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo actualizar la historia."
            );

            return;

        }


        /* Actualizar lo mostrado */

        document.getElementById(
            "story-title"
        ).textContent =
            title;


        document.getElementById(
            "story-genre"
        ).textContent =
            genre;


        showSuccess(
            "Información de la historia actualizada correctamente."
        );


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   MOSTRAR PORTADA
========================================== */

function showCover(url) {

    const image =
        document.getElementById(
            "cover-image"
        );

    const placeholder =
        document.getElementById(
            "cover-placeholder"
        );

    image.src =
        url;

    image.style.display =
        "block";

    placeholder.style.display =
        "none";

}


/* ==========================================
   SUBIR PORTADA
========================================== */

async function uploadCover() {

    if (!isAuthor) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const fileInput =
        document.getElementById(
            "cover-file"
        );

    const file =
        fileInput.files[0];


    if (!file) {

        showError(
            "Selecciona una imagen para la portada."
        );

        return;

    }


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        showError(
            "La portada debe ser JPG, PNG o WEBP."
        );

        return;

    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        showError(
            "La imagen no puede superar los 5 MB."
        );

        return;

    }


    const status =
        document.getElementById(
            "cover-status"
        );

    status.textContent =
        "Subiendo portada...";


    try {

        const formData =
            new FormData();


        formData.append(
            "cover",
            file
        );


        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/cover",
                {
                    method: "POST",
                    credentials: "include",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo subir la portada."
            );

            status.textContent =
                "";

            return;

        }


        if (data.cover_url) {

            showCover(
                data.cover_url
            );

        }


        status.textContent =
            "Portada subida correctamente.";


        showSuccess(
            "Portada actualizada correctamente."
        );


        fileInput.value =
            "";


    } catch (error) {

        console.error(error);

        status.textContent =
            "";

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   COMPROBAR AUTOR
========================================== */

async function checkAuthor(
    storyUserId
) {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.loggedIn
        ) {

            window.location.href =
                "login.html";

            return;

        }


        if (
            Number(data.user.id) ===
            Number(storyUserId)
        ) {

            isAuthor =
                true;

            return;

        }


        isAuthor =
            false;


        showError(
            "No tienes permiso para editar esta historia."
        );


        document.querySelector(
            ".editor"
        ).style.display =
            "none";


        document.querySelector(
            ".story-edit"
        ).style.display =
            "none";


        document.getElementById(
            "cover-controls"
        ).style.display =
            "none";


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo comprobar el usuario."
        );

    }

}


/* ==========================================
   CARGAR CAPÍTULOS
========================================== */

async function loadChapters() {

    const container =
        document.getElementById(
            "chapters-container"
        );


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            container.innerHTML =
                "<p>No se pudieron cargar los capítulos.</p>";

            return;

        }


        const chapters =
            data.chapters || [];


        if (chapters.length === 0) {

            container.innerHTML =
                "<p>Aún no hay capítulos.</p>";

            return;

        }


        container.innerHTML =
            "";


        chapters.forEach(
            function(chapter) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "chapter-card";


                const preview =
                    chapter.content.length > 300
                        ? chapter.content.substring(
                            0,
                            300
                        ) + "..."
                        : chapter.content;


                card.innerHTML =

                    '<div class="chapter-number">' +
                    'CAPÍTULO ' +
                    chapter.chapter_number +
                    '</div>' +

                    '<h3>' +
                    escapeHtml(
                        chapter.title
                    ) +
                    '</h3>' +

                    '<div class="chapter-preview">' +
                    escapeHtml(
                        preview
                    ) +
                    '</div>' +

                    '<div class="chapter-actions">' +

                    '<button ' +
                    'class="edit-button" ' +
                    'onclick="editChapter(' +
                    chapter.id +
                    ')">' +
                    'Editar' +
                    '</button>' +

                    '<button ' +
                    'class="remove-button" ' +
                    'onclick="deleteChapter(' +
                    chapter.id +
                    ')">' +
                    'Eliminar' +
                    '</button>' +

                    '</div>';


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Error cargando capítulos.</p>";

    }

}


/* ==========================================
   GUARDAR CAPÍTULO
========================================== */

async function saveChapter() {

    const title =
        document.getElementById(
            "chapter-title"
        ).value.trim();


    const content =
        document.getElementById(
            "chapter-content"
        ).value;


    if (!title) {

        showError(
            "Escribe un título para el capítulo."
        );

        return;

    }


    if (!content.trim()) {

        showError(
            "Escribe el contenido del capítulo."
        );

        return;

    }


    try {

        let response;


        if (!editingChapterId) {

            response =
                await fetch(
                    "/api/stories/" +
                    storyId +
                    "/chapters",
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                title:
                                    title,

                                content:
                                    content
                            })
                    }
                );

        } else {

            response =
                await fetch(
                    "/api/chapters/" +
                    editingChapterId,
                    {
                        method: "PUT",
                        credentials: "include",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                title:
                                    title,

                                content:
                                    content
                            })
                    }
                );

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo guardar el capítulo."
            );

            return;

        }


        showSuccess(
            editingChapterId
                ? "Capítulo actualizado correctamente."
                : "Capítulo creado correctamente."
        );


        clearEditor();

        loadChapters();


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   EDITAR CAPÍTULO
========================================== */

async function editChapter(
    chapterId
) {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                "No se pudo cargar el capítulo."
            );

            return;

        }


        const chapter =
            data.chapters.find(
                function(item) {

                    return Number(item.id) ===
                        Number(chapterId);

                }
            );


        if (!chapter) {

            showError(
                "El capítulo no existe."
            );

            return;

        }


        editingChapterId =
            chapter.id;


        document.getElementById(
            "editor-title"
        ).textContent =
            "Editar capítulo " +
            chapter.chapter_number;


        document.getElementById(
            "chapter-title"
        ).value =
            chapter.title;


        document.getElementById(
            "chapter-content"
        ).value =
            chapter.content;


        document.getElementById(
            "cancel-button"
        ).style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo cargar el capítulo."
        );

    }

}


/* ==========================================
   ELIMINAR CAPÍTULO
========================================== */

async function deleteChapter(
    chapterId
) {

    const confirmed =
        confirm(
            "¿Seguro que quieres eliminar este capítulo?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo eliminar el capítulo."
            );

            return;

        }


        showSuccess(
            "Capítulo eliminado correctamente."
        );


        if (
            Number(editingChapterId) ===
            Number(chapterId)
        ) {

            clearEditor();

        }


        loadChapters();


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   CANCELAR EDICIÓN
========================================== */

function cancelEdit() {

    clearEditor();

}


/* ==========================================
   LIMPIAR EDITOR
========================================== */

function clearEditor() {

    editingChapterId =
        null;


    document.getElementById(
        "editor-title"
    ).textContent =
        "Agregar capítulo";


    document.getElementById(
        "chapter-title"
    ).value =
        "";


    document.getElementById(
        "chapter-content"
    ).value =
        "";


    document.getElementById(
        "cancel-button"
    ).style.display =
        "none";

}


/* ==========================================
   MENSAJES
========================================== */

function showError(message) {

    const element =
        document.getElementById(
            "error-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "success-message"
    ).style.display =
        "none";

}


function showSuccess(message) {

    const element =
        document.getElementById(
            "success-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "error-message"
    ).style.display =
        "none";


    setTimeout(
        function() {

            element.style.display =
                "none";

        },
        3000
    );

}


/* ==========================================
   SEGURIDAD HTML
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
