.header-content {

}

.logo {

}

/* ==============================

============================== */

    margin: auto;
    padding: 25px 15px;

/* ==============================

============================== */

.profile {

    padding: 30px;

    border-radius: 12px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}

    margin-top: 0;
    margin-bottom: 20px;

}

.profile-info {
    display: grid;
    gap: 12px;
}

.info-row {
    padding: 12px;

    background: #f8f8f8;

    border-radius: 7px;

    border: 1px solid #e5e5e5;
}

.info-label {
    display: block;

    color: #777;

    font-size: 12px;

    margin-bottom: 5px;
}

.info-value {
    font-size: 16px;

    font-weight: bold;
}

/* ==============================
   ESTADÍSTICAS
============================== */

.stats {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;

    margin-top: 20px;
}

.stat {
    background: #20242b;

    color: white;

    padding: 20px;

    border-radius: 10px;

    text-align: center;
}

.stat-number {
    font-size: 28px;

    font-weight: bold;
}

.stat-label {
    font-size: 13px;

    color: #ccc;

    margin-top: 5px;
}

/* ==============================
   BOTONES
============================== */

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 25px;

    flex-wrap: wrap;
}

button,
.button {
    border: none;

    border-radius: 7px;

    padding: 11px 18px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;

    text-decoration: none;

    display: inline-block;
}

.home-button {
    background: #ff6b35;

    color: white;
}

.home-button:hover {
    background: #e85a2a;
}

.logout-button {
    background: #ddd;

    color: #222;
}

.logout-button:hover {
    background: #ccc;
}

/* ==============================
   HISTORIAS
============================== */

.section-title {
    margin: 30px 0 15px;
}

.section-title h2 {
    margin: 0;
}

.stories {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
}

.story-card {
    background: white;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);
}

.cover {
    height: 180px;

    background:
        linear-gradient(
            135deg,
            #5c677d,
            #222831
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 40px;
}

.cover img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.story-content {
    padding: 15px;
}

.story-content h3 {
    margin: 0 0 7px;

    font-size: 17px;
}

.story-description {
    color: #666;

    font-size: 13px;

    line-height: 1.4;

    margin: 8px 0;
}

.read-button {
    display: block;

    text-align: center;

    background: #20242b;

    color: white;

    text-decoration: none;

    padding: 9px;

    border-radius: 6px;

    margin-top: 12px;

    font-size: 13px;
}

.read-button:hover {
    background: #343a40;
}

/* ==============================
   MENSAJES
============================== */

.loading {
    text-align: center;

    padding: 50px 20px;

    color: #777;
}

.empty {
    background: white;

    padding: 25px;

    border-radius: 10px;

    color: #666;

    text-align: center;
}

/* ==============================
   FOOTER
============================== */

footer {
    background: #20242b;

    color: #aaa;

    text-align: center;

    padding: 30px;

    margin-top: 40px;

    font-size: 13px;
}

/* ==============================
   CELULAR
============================== */

@media (max-width: 600px) {

    .container {
        padding: 18px 12px;
    }

    .profile {
        padding: 20px;
    }

    .profile h1 {
        font-size: 25px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stories {
        grid-template-columns: 1fr 1fr;

        gap: 12px;
    }

    .cover {
        height: 170px;
    }

    .story-content {
        padding: 10px;
    }

    .story-content h3 {
        font-size: 15px;
    }

    .story-description {
        display: none;
    }

    .buttons {
        flex-direction: column;
    }

    .button,
    button {
        width: 100%;

        text-align: center;
    }

}

/* ==========================================
   ELEMENTOS
========================================== */

const loading =
    document.getElementById(
        "loading"
    );

const profile =
    document.getElementById(
        "profile"
    );

const storiesSection =
    document.getElementById(
        "stories-section"
    );

const storiesContainer =
    document.getElementById(
        "stories"
    );


/* ==========================================
   INICIAR
========================================== */

cargarPerfil();


/* ==========================================
   CARGAR PERFIL
========================================== */

async function cargarPerfil() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        console.log(
            "Respuesta /api/me:",
            data
        );


        if (
            !response.ok ||
            !data.success ||
            !data.loggedIn ||
            !data.user
        ) {

            window.location.href =
                "login.html";

            return;

        }


        const user =
            data.user;


        /* ==============================
           INFORMACIÓN
        ============================== */

        document.getElementById(
            "username"
        ).textContent =
            user.username || "-";


        document.getElementById(
            "user-id"
        ).textContent =
            user.id || "-";


        loading.style.display =
            "none";

        profile.style.display =
            "block";


        /* ==============================
           CARGAR HISTORIAS
        ============================== */

        await cargarHistorias(
            user.id
        );


    } catch (error) {

        console.error(
            "Error cargando perfil:",
            error
        );

        loading.textContent =
            "No se pudo cargar el perfil.";

    }

}


/* ==========================================
   CARGAR HISTORIAS DEL USUARIO
========================================== */

async function cargarHistorias(
    userId
) {

    try {

        const response =
            await fetch(
                "/api/stories",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        console.log(
            "Respuesta /api/stories:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            console.error(
                "No se pudieron cargar las historias."
            );

            return;

        }


        const allStories =
            Array.isArray(
                data.stories
            )
                ? data.stories
                : [];


        /* ==============================
           FILTRAR HISTORIAS
        ============================== */

        const userStories =
            allStories.filter(
                function(story) {

                    return Number(
                        story.user_id
                    ) === Number(
                        userId
                    );

                }
            );


        /* ==============================
           ESTADÍSTICAS
        ============================== */

        document.getElementById(
            "stories-count"
        ).textContent =
            userStories.length;


        let totalChapters = 0;


        userStories.forEach(
            function(story) {

                if (
                    story.chapter_count !==
                    undefined &&
                    story.chapter_count !==
                    null
                ) {

                    totalChapters +=
                        Number(
                            story.chapter_count
                        ) || 0;

                }

            }
        );


        document.getElementById(
            "chapters-count"
        ).textContent =
            totalChapters;


        /* ==============================
           SIN HISTORIAS
        ============================== */

        if (
            userStories.length === 0
        ) {

            storiesSection.style.display =
                "block";

            storiesContainer.innerHTML =
                '<div class="empty">' +
                'Todavía no has publicado ninguna historia.' +
                '<br><br>' +
                '<a href="crear-historia.html">' +
                'Crear mi primera historia' +
                '</a>' +
                '</div>';

            return;

        }


        storiesSection.style.display =
            "block";


        storiesContainer.innerHTML =
            "";


        /* ==============================
           MOSTRAR HISTORIAS
        ============================== */

        userStories.forEach(
            function(story) {

                const card =
                    document.createElement(
                        "article"
                    );

                card.className =
                    "story-card";


                /* ==============================
                   PORTADA
                ============================== */

                /*
                 * El backend puede entregar
                 * la portada como cover_url.
                 *
                 * También aceptamos coverUrl
                 * y cover como respaldo.
                 */

                const coverUrl =
                    story.cover_url ||
                    story.coverUrl ||
                    story.cover ||
                    "";


                let coverHTML;


                if (
                    coverUrl
                ) {

                    coverHTML =
                        '<div class="cover">' +

                        '<img src="' +
                        escapeHtml(
                            coverUrl
                        ) +
                        '" ' +

                        'alt="Portada de ' +
                        escapeHtml(
                            story.title ||
                            "historia"
                        ) +
                        '" ' +

                        'onerror="mostrarPortadaFallback(this)">' +

                        '</div>';

                } else {

                    coverHTML =
                        '<div class="cover">' +
                        '📖' +
                        '</div>';

                }


                /* ==============================
                   CONTENIDO
                ============================== */

                card.innerHTML =

                    coverHTML +

                    '<div class="story-content">' +

                    '<h3>' +
                    escapeHtml(
                        story.title ||
                        "Sin título"
                    ) +
                    '</h3>' +

                    '<p class="story-description">' +
                    escapeHtml(
                        story.description ||
                        ""
                    ) +
                    '</p>' +

                    '<a class="read-button" href="leer-historia.html?id=' +
                    encodeURIComponent(
                        story.id
                    ) +
                    '">' +
                    'Ver historia' +
                    '</a>' +

                    '</div>';


                storiesContainer.appendChild(
                    card
                );


                console.log(
                    "Historia:",
                    story.title,
                    "Portada:",
                    coverUrl
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando historias:",
            error
        );

        storiesContainer.innerHTML =
            '<div class="empty">' +
            'No se pudieron cargar tus historias.' +
            '</div>';

    }

}


/* ==========================================
   PORTADA FALLBACK
========================================== */

function mostrarPortadaFallback(
    image
) {

    const cover =
        image.parentElement;


    image.remove();


    cover.textContent =
        "📖";

}


/* ==========================================
   CERRAR SESIÓN
========================================== */

async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

    } catch (error) {

        console.error(
            "Error cerrando sesión:",
            error
        );

    }


    localStorage.removeItem(
        "comicworld_user"
    );


    window.location.href =
        "index.html";

}


/* ==========================================
   SEGURIDAD HTML
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}
