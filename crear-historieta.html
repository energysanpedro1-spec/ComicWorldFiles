<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Crear historieta - ComicWorldFiles</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f4f4f4;

    color: #222;
}

header {

    background: #222;

    color: white;

    padding: 15px;

    text-align: center;
}

header h1 {

    margin: 0;

    font-size: 22px;
}

.container {

    width: 95%;

    max-width: 900px;

    margin: 20px auto;
}

.card {

    background: white;

    padding: 20px;

    margin-bottom: 20px;

    border-radius: 10px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {

    margin-top: 0;

    font-size: 20px;
}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 5px;

    font-weight: bold;
}

input,
textarea,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 16px;

    font-family: Arial, sans-serif;
}

textarea {

    min-height: 150px;

    resize: vertical;
}

button {

    border: none;

    border-radius: 6px;

    padding: 11px 16px;

    font-size: 15px;

    cursor: pointer;

    margin-top: 10px;

    background: #222;

    color: white;
}

button:hover {

    opacity: 0.85;
}

button.secondary {

    background: #666;
}

button.danger {

    background: #c62828;
}

button.green {

    background: #2e7d32;
}

button.blue {

    background: #1565c0;
}

button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.status {

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 6px;

    display: none;
}

.status.success {

    display: block;

    background: #dff2df;

    color: #256029;
}

.status.error {

    display: block;

    background: #f8d7da;

    color: #842029;
}

.cover-preview {

    margin-top: 15px;

    text-align: center;
}

.cover-preview img {

    max-width: 300px;

    max-height: 400px;

    border-radius: 8px;

    border: 1px solid #ccc;
}

.chapter {

    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 15px;

    margin-top: 15px;

    background: #fafafa;
}

.chapter-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}

.chapter-title {

    font-weight: bold;

    font-size: 18px;
}

.chapter-buttons {

    display: flex;

    gap: 5px;

    flex-wrap: wrap;
}

.chapter-buttons button {

    margin-top: 0;

    padding: 8px 10px;

    font-size: 13px;
}

.images {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(140px, 1fr));

    gap: 12px;

    margin-top: 15px;
}

.image-item {

    background: white;

    border: 1px solid #ddd;

    border-radius: 7px;

    padding: 8px;

    text-align: center;
}

.image-item img {

    width: 100%;

    height: 180px;

    object-fit: contain;

    background: #eee;

    border-radius: 5px;
}

.image-item button {

    width: 100%;

    margin-top: 7px;

    padding: 7px;

    font-size: 13px;
}

.upload-box {

    border: 2px dashed #bbb;

    border-radius: 8px;

    padding: 20px;

    text-align: center;

    margin-top: 15px;
}

.hidden {

    display: none !important;
}

.login-message {

    text-align: center;

    padding: 30px;

    font-size: 18px;
}

.loading {

    text-align: center;

    padding: 20px;
}

.back {

    display: inline-block;

    margin-bottom: 15px;

    color: #1565c0;

    text-decoration: none;

    font-weight: bold;
}

.chapter-editor {

    margin-top: 15px;

    padding-top: 15px;

    border-top: 1px solid #ddd;
}

.empty {

    color: #777;

    text-align: center;

    padding: 15px;
}

</style>

</head>


<body>


<header>

<h1>ComicWorldFiles</h1>

</header>


<div class="container">


<a href="historietas.html"
   class="back">

← Volver a historietas

</a>


<div id="loading"
     class="card loading">

Cargando...

</div>


<div id="loginMessage"
     class="card login-message hidden">

Debes iniciar sesión para crear o editar una historieta.

<br>

<button
    onclick="window.location.href='login.html'">

Iniciar sesión

</button>

</div>


<div id="main"
     class="hidden">


<div id="status"
     class="status">
</div>


<!-- =====================================================
     INFORMACIÓN
===================================================== -->


<div class="card">

<h2 id="formTitle">
Crear historieta
</h2>


<label for="title">

Título

</label>

<input
    type="text"
    id="title"
    maxlength="200"
    placeholder="Título de la historieta">


<label for="description">

Descripción

</label>

<textarea
    id="description"
    maxlength="5000"
    placeholder="Describe tu historieta..."></textarea>


<label for="genre">

Género

</label>

<select id="genre">

<option value="Acción">
Acción
</option>

<option value="Aventura">
Aventura
</option>

<option value="Ciencia ficción">
Ciencia ficción
</option>

<option value="Comedia">
Comedia
</option>

<option value="Drama">
Drama
</option>

<option value="Fantasía">
Fantasía
</option>

<option value="Horror">
Horror
</option>

<option value="Romance">
Romance
</option>

<option value="Misterio">
Misterio
</option>

<option value="Otros">
Otros
</option>

</select>


<button
    id="saveStoryButton"
    class="green"
    onclick="saveStory()">

Crear historieta

</button>


</div>



<!-- =====================================================
     PORTADA
===================================================== -->


<div id="coverCard"
     class="card hidden">

<h2>

Portada

</h2>


<input
    type="file"
    id="coverInput"
    accept="image/jpeg,image/png,image/webp,image/gif">


<button
    class="blue"
    onclick="uploadCover()">

Subir portada

</button>


<div id="coverPreview"
     class="cover-preview">

</div>


</div>



<!-- =====================================================
     CAPÍTULOS
===================================================== -->


<div id="chaptersCard"
     class="card hidden">

<h2>

Capítulos

</h2>


<button
    class="green"
    onclick="showNewChapter()">

+ Nuevo capítulo

</button>


<div id="newChapter"
     class="chapter-editor hidden">


<h3>

Nuevo capítulo

</h3>


<label>

Título del capítulo

</label>

<input
    type="text"
    id="newChapterTitle"
    placeholder="Ejemplo: Capítulo 1">


<label>

Contenido

</label>

<textarea
    id="newChapterContent"
    placeholder="Escribe aquí el contenido del capítulo..."></textarea>


<button
    class="green"
    onclick="createChapter()">

Guardar capítulo

</button>


<button
    class="secondary"
    onclick="cancelNewChapter()">

Cancelar

</button>


</div>


<div id="chaptersList">

</div>


</div>


</div>


</div>



<script>


// =========================================================
// VARIABLES
// =========================================================


let currentUser = null;

let storyId = null;

let story = null;

let chapters = [];


// =========================================================
// INICIO
// =========================================================


document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        const data =
            await response.json();


        if (
            !data.success ||
            !data.loggedIn
        ) {

            showLogin();

            return;

        }


        currentUser =
            data.user;


        const params =
            new URLSearchParams(
                window.location.search
            );


        const id =
            params.get("id");


        if (id) {

            storyId =
                Number(id);

            await loadStory();

        } else {

            document
                .getElementById("loading")
                .classList.add("hidden");

            document
                .getElementById("main")
                .classList.remove("hidden");

        }


    } catch (error) {

        console.error(error);

        showStatus(
            "No se pudo comprobar la sesión.",
            "error"
        );

    }

}


// =========================================================
// LOGIN
// =========================================================


function showLogin() {

    document
        .getElementById("loading")
        .classList.add("hidden");

    document
        .getElementById("loginMessage")
        .classList.remove("hidden");

}


// =========================================================
// CARGAR HISTORIA
// =========================================================


async function loadStory() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId,
                {
                    credentials:
                        "same-origin"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            showStatus(
                data.error ||
                "No se pudo cargar la historieta.",
                "error"
            );

            return;

        }


        story =
            data.story;


        // -------------------------------------------------
        // Comprobar propietario
        // -------------------------------------------------


        if (
            Number(story.user_id) !==
            Number(currentUser.id)
        ) {

            document
                .getElementById("loading")
                .classList.add("hidden");

            document
                .getElementById("main")
                .classList.remove("hidden");


            showStatus(
                "No tienes permiso para editar esta historieta.",
                "error"
            );


            disableEditing();

            return;

        }


        // -------------------------------------------------
        // Datos
        // -------------------------------------------------


        document
            .getElementById("title")
            .value =
            story.title || "";


        document
            .getElementById("description")
            .value =
            story.description || "";


        document
            .getElementById("genre")
            .value =
            story.genre || "Otros";


        document
            .getElementById("formTitle")
            .textContent =
            "Editar historieta";


        document
            .getElementById("saveStoryButton")
            .textContent =
            "Guardar cambios";


        // -------------------------------------------------
        // Mostrar interfaz
        // -------------------------------------------------


        document
            .getElementById("loading")
            .classList.add("hidden");


        document
            .getElementById("main")
            .classList.remove("hidden");


        document
            .getElementById("coverCard")
            .classList.remove("hidden");


        document
            .getElementById("chaptersCard")
            .classList.remove("hidden");


        // -------------------------------------------------
        // Portada
        // -------------------------------------------------


        if (story.cover_url) {

            showCover(
                story.cover_url
            );

        }


        await loadChapters();


    } catch (error) {

        console.error(error);

        document
            .getElementById("loading")
            .classList.add("hidden");

        document
            .getElementById("main")
            .classList.remove("hidden");

        showStatus(
            "Error cargando la historieta.",
            "error"
        );

    }

}


// =========================================================
// CREAR / EDITAR HISTORIA
// =========================================================


async function saveStory() {

    const title =
        document
            .getElementById("title")
            .value
            .trim();


    const description =
        document
            .getElementById("description")
            .value
            .trim();


    const genre =
        document
            .getElementById("genre")
            .value
            .trim();


    if (!title) {

        showStatus(
            "Escribe un título.",
            "error"
        );

        return;

    }


    if (!description) {

        showStatus(
            "Escribe una descripción.",
            "error"
        );

        return;

    }


    if (!genre) {

        showStatus(
            "Selecciona un género.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById(
                "saveStoryButton"
            );


    button.disabled =
        true;


    try {

        let response;


        // =================================================
        // CREAR
        // =================================================


        if (!storyId) {

            response =
                await fetch(
                    "/api/stories",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                title:
                                    title,

                                description:
                                    description,

                                genre:
                                    genre,

                                type:
                                    "historieta"
                            })
                    }
                );

        }


        // =================================================
        // EDITAR
        // =================================================


        else {

            response =
                await fetch(
                    "/api/stories/" +
                    storyId,
                    {
                        method: "PUT",

                        credentials:
                            "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                title:
                                    title,

                                description:
                                    description,

                                genre:
                                    genre,

                                type:
                                    "historieta"
                            })
                    }
                );

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo guardar."
            );

        }


        // =================================================
        // NUEVA HISTORIETA
        // =================================================


        if (!storyId) {

            storyId =
                data.story.id;


            story =
                data.story;


            document
                .getElementById(
                    "formTitle"
                )
                .textContent =
                "Editar historieta";


            button.textContent =
                "Guardar cambios";


            document
                .getElementById(
                    "coverCard"
                )
                .classList.remove("hidden");


            document
                .getElementById(
                    "chaptersCard"
                )
                .classList.remove("hidden");


            // Cambiar URL sin recargar
            window.history.replaceState(
                null,
                "",
                "crear-historieta.html?id=" +
                storyId
            );

        }


        showStatus(
            data.message ||
            "Cambios guardados correctamente.",
            "success"
        );


    } catch (error) {

        console.error(error);

        showStatus(
            error.message ||
            "No se pudo guardar la historieta.",
            "error"
        );

    }


    button.disabled =
        false;

}


// =========================================================
// PORTADA
// =========================================================


async function uploadCover() {

    if (!storyId) {

        showStatus(
            "Primero debes guardar la historieta.",
            "error"
        );

        return;

    }


    const input =
        document
            .getElementById(
                "coverInput"
            );


    if (
        !input.files ||
        !input.files.length
    ) {

        showStatus(
            "Selecciona una imagen.",
            "error"
        );

        return;

    }


    const file =
        input.files[0];


    const formData =
        new FormData();


    formData.append(
        "cover",
        file
    );


    try {

        showStatus(
            "Subiendo portada...",
            "success"
        );


        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/cover",
                {
                    method: "POST",

                    credentials:
                        "same-origin",

                    body:
                        formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo subir la portada."
            );

        }


        showCover(
            data.cover_url
        );


        showStatus(
            "Portada subida correctamente.",
            "success"
        );


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    }

}


// =========================================================
// MOSTRAR PORTADA
// =========================================================


function showCover(url) {

    const container =
        document
            .getElementById(
                "coverPreview"
            );


    container.innerHTML =
        "";


    const img =
        document.createElement(
            "img"
        );


    img.src =
        url +
        (
            url.includes("?")
                ? "&"
                : "?"
        ) +
        "t=" +
        Date.now();


    img.alt =
        "Portada";


    container.appendChild(
        img
    );

}


// =========================================================
// CAPÍTULOS
// =========================================================


async function loadChapters() {

    if (!storyId) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    credentials:
                        "same-origin"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudieron cargar los capítulos."
            );

        }


        chapters =
            data.chapters || [];


        renderChapters();


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    }

}


// =========================================================
// MOSTRAR CAPÍTULOS
// =========================================================


function renderChapters() {

    const container =
        document
            .getElementById(
                "chaptersList"
            );


    container.innerHTML =
        "";


    if (!chapters.length) {

        container.innerHTML =
            '<div class="empty">' +
            'Todavía no hay capítulos.' +
            '</div>';

        return;

    }


    chapters.forEach(
        function(chapter) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "chapter";


            div.innerHTML =

                '<div class="chapter-header">' +

                    '<div class="chapter-title">' +

                        'Capítulo ' +
                        escapeHtml(
                            chapter.chapter_number
                        ) +
                        ' — ' +
                        escapeHtml(
                            chapter.title
                        ) +

                    '</div>' +

                    '<div class="chapter-buttons">' +

                        '<button class="blue" ' +
                        'onclick="editChapter(' +
                        chapter.id +
                        ')">' +
                        'Editar' +
                        '</button>' +

                        '<button class="danger" ' +
                        'onclick="deleteChapter(' +
                        chapter.id +
                        ')">' +
                        'Eliminar' +
                        '</button>' +

                    '</div>' +

                '</div>' +


                '<div id="chapterContent-' +
                chapter.id +
                '" class="chapter-editor">' +

                    '<p>' +

                        escapeHtml(
                            getContentPreview(
                                chapter.content
                            )
                        ) +

                    '</p>' +

                '</div>';


            container.appendChild(
                div
            );


            loadChapterImages(
                chapter.id,
                div
            );

        }
    );

}


// =========================================================
// PREVISUALIZACIÓN DE CONTENIDO
// =========================================================


function getContentPreview(
    content
) {

    if (!content) {

        return "";

    }


    const text =
        content
            .replace(/\s+/g, " ")
            .trim();


    if (
        text.length > 250
    ) {

        return text.substring(
            0,
            250
        ) + "...";

    }


    return text;

}


// =========================================================
// NUEVO CAPÍTULO
// =========================================================


function showNewChapter() {

    document
        .getElementById(
            "newChapter"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "newChapterTitle"
        )
        .focus();

}


function cancelNewChapter() {

    document
        .getElementById(
            "newChapter"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "newChapterTitle"
        )
        .value =
        "";


    document
        .getElementById(
            "newChapterContent"
        )
        .value =
        "";

}


// =========================================================
// CREAR CAPÍTULO
// =========================================================


async function createChapter() {

    if (!storyId) {

        return;

    }


    const title =
        document
            .getElementById(
                "newChapterTitle"
            )
            .value
            .trim();


    const content =
        document
            .getElementById(
                "newChapterContent"
            )
            .value;


    if (!title) {

        showStatus(
            "Escribe el título del capítulo.",
            "error"
        );

        return;

    }


    if (!content.trim()) {

        showStatus(
            "Escribe el contenido del capítulo.",
            "error"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "POST",

                    credentials:
                        "same-origin",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            title:
                                title,

                            content:
                                content
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo crear el capítulo."
            );

        }


        cancelNewChapter();


        showStatus(
            "Capítulo creado correctamente.",
            "success"
        );


        await loadChapters();


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    }

}


// =========================================================
// EDITAR CAPÍTULO
// =========================================================


async function editChapter(
    chapterId
) {

    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId,
                {
                    credentials:
                        "same-origin"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo cargar el capítulo."
            );

        }


        const chapter =
            data.chapter;


        const container =
            document
                .getElementById(
                    "chapterContent-" +
                    chapterId
                );


        if (!container) {

            return;

        }


        container.innerHTML =

            '<label>Título</label>' +

            '<input ' +
            'type="text" ' +
            'id="editTitle-' +
            chapterId +
            '" ' +
            'value="' +
            escapeAttribute(
                chapter.title
            ) +
            '">' +


            '<label>Contenido</label>' +

            '<textarea ' +
            'id="editContent-' +
            chapterId +
            '">' +
            escapeHtml(
                chapter.content
            ) +
            '</textarea>' +


            '<button class="green" ' +
            'onclick="saveChapter(' +
            chapterId +
            ')">' +
            'Guardar cambios' +
            '</button> ' +


            '<button class="secondary" ' +
            'onclick="loadChapters()">' +
            'Cancelar' +
            '</button>' +


            '<div id="images-' +
            chapterId +
            '">' +

                '<div class="upload-box">' +

                    '<strong>Imágenes del capítulo</strong>' +

                    '<br><br>' +

                    '<input ' +
                    'type="file" ' +
                    'id="imagesInput-' +
                    chapterId +
                    '" ' +
                    'accept="image/jpeg,image/png,image/webp,image/gif" ' +
                    'multiple>' +

                    '<br>' +

                    '<button class="blue" ' +
                    'onclick="uploadImages(' +
                    chapterId +
                    ')">' +
                    'Subir imágenes' +
                    '</button>' +

                '</div>' +

                '<div class="images" ' +
                'id="imageList-' +
                chapterId +
                '">' +

                '</div>' +

            '</div>';


        await loadImages(
            chapterId
        );


    } catch (error) {

        console.error(error);

        showStatus(

// =========================================================
// GUARDAR CAPÍTULO
// =========================================================


async function saveChapter(
    chapterId
) {

    const title =
        document
            .getElementById(
                "editTitle-" +
                chapterId
            )
            .value
            .trim();


    const content =
        document
            .getElementById(
                "editContent-" +
                chapterId
            )
            .value;


    if (!title) {

        showStatus(
            "El título es obligatorio.",
            "error"
        );

        return;

    }


    if (!content.trim()) {

        showStatus(
            "El contenido es obligatorio.",
            "error"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId,
                {
                    method: "PUT",

                    credentials:
                        "same-origin",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            title:
                                title,

                            content:
                                content
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudo actualizar el capítulo."
            );

        }


        showStatus(
            "Capítulo actualizado correctamente.",
            "success"
        );


        await loadChapters();


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    }

}

// =========================================================
// CARGAR IMÁGENES
// =========================================================


async function loadImages(
    chapterId
) {

    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId +
                "/images",
                {
                    credentials:
                        "same-origin"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "No se pudieron cargar las imágenes."
            );

        }


        renderImages(
            chapterId,
            data.images || []
        );


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    }

}


// =========================================================
// MOSTRAR IMÁGENES
// =========================================================


function renderImages(
    chapterId,
    images
) {

    const container =
        document
            .getElementById(
                "imageList-" +
                chapterId
            );


    if (!container) {

        return;

    }


    container.innerHTML =
        "";


    if (!images.length) {

        container.innerHTML =
            '<div class="empty">' +
            'No hay imágenes en este capítulo.' +
            '</div>';

        return;

    }


    images.forEach(
        function(image) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "image-item";


            item.innerHTML =

                '<img src="' +
                escapeAttribute(
                    image.image_url
                ) +
                '" alt="' +
                escapeAttribute(
                    image.filename ||
                    "Imagen"
                ) +
                '">' +


                '<div>' +
                escapeHtml(
                    image.filename ||
                    "Imagen"
                ) +
                '</div>' +


                '<button class="danger" ' +
                'onclick="deleteImage(' +
                image.id +
                ',' +
                chapterId +
                ')">' +
                'Eliminar' +
                '</button>';


            container.appendChild(
                item
            );

        }
    );

}


// =========================================================
// SUBIR IMÁGENES
// =========================================================


async function uploadImages(
    chapterId
) {

    const input =
        document
            .getElementById(
                "imagesInput-" +
                chapterId
            );


    if (
        !input ||
        !input.files.length
    ) {

        showStatus(
            "Selecciona una o más imágenes.",
            "error"
        );

        return;

    }


    try {

        let uploaded = 0;


        for (
            const file of input.files
        ) {

            const formData =
                new FormData();


            formData.append(
                "image",
                file
            );


            const response =
                await fetch(
                    "/api/chapters/" +
                    chapterId +
                    "/images",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "No se pudo subir " +
                    file.name
                );

            }


            uploaded++;

        }


        input.value =
            "";


        showStatus(
            uploaded +
            " imagen(es) subida(s) correctamente.",
            "success"
        );


        await loadImages(
            chapterId
        );


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    }

}

function showStatus(
    message,
    type
) {

    const status =
        document
            .getElementById(
                "status"
            );


    status.textContent =

    status.className =
        "status " +
        type;

        behavior: "smooth"
    });

}


// =========================================================
// ESCAPE HTML
// =========================================================


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =========================================================
// ESCAPE ATRIBUTO
// =========================================================


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );

}
