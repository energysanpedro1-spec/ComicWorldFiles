<script>

/* ==========================================
   VARIABLES
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    params.get("id");

let editingChapterId = null;

let contentBlocks = [];
let originalImageIds = [];

let currentUser = null;

let isAdmin = false;

let hasPermission = false;


/* ==========================================
   COMPROBAR ID
========================================== */

if (!storyId) {

    showError(
        "No se indicó ninguna historia."
    );

} else {

    initializePage();

}


/* ==========================================
   INICIALIZAR
========================================== */

async function initializePage() {

    /*
     * Primero comprobamos la sesión.
     * Después cargamos la historia.
     */

    const loggedIn =
        await checkCurrentUser();

    if (!loggedIn) {

        return;

    }


    await loadStory();

}


/* ==========================================
   COMPROBAR USUARIO ACTUAL
========================================== */

async function checkCurrentUser() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.loggedIn
        ) {

            window.location.href =
                "login.html";

            return false;

        }


        currentUser =
            data.user;


        /*
         * Comprobar si además es administrador.
         *
         * Esta ruta utiliza la comprobación
         * centralizada de worker/routes/admin.js
         */

        try {

            const adminResponse =
                await fetch(
                    "/api/admin/check",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );


            const adminData =
                await adminResponse.json();


            if (
                adminResponse.ok &&
                adminData.success &&
                adminData.loggedIn &&
                adminData.isAdmin
            ) {

                isAdmin = true;

            }

        } catch (adminError) {

            /*
             * Si falla la comprobación del admin,
             * seguimos funcionando como usuario normal.
             */

            console.error(
                "Error comprobando administrador:",
                adminError
            );

            isAdmin = false;

        }


        return true;


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo comprobar el usuario."
        );

        return false;

    }

}


/* ==========================================
   CARGAR HISTORIA
========================================== */

async function loadStory() {

    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo cargar la historia."
            );

            return;

        }


        const story =
            data.story;


        document.getElementById(
            "story-title"
        ).textContent =
            story.title;


        document.getElementById(
            "story-author"
        ).textContent =
            story.author || "Autor";


        document.getElementById(
            "story-description"
        ).textContent =
            story.description || "";


        document.getElementById(
            "story-genre"
        ).textContent =
            story.genre || "";


        /*
         * ADMINISTRADOR
         *
         * El administrador puede editar
         * cualquier publicación.
         */

        if (isAdmin) {

            hasPermission = true;

            loadChapters();

            return;

        }


        /*
         * AUTOR
         *
         * Un usuario normal solo puede editar
         * una historia cuyo user_id coincida
         * con su propio ID.
         */

        if (
            Number(currentUser.id) ===
            Number(story.user_id)
        ) {

            hasPermission = true;

            loadChapters();

            return;

        }


        /*
         * SIN PERMISO
         */

        hasPermission = false;


        showError(
            "No tienes permiso para editar esta historia."
        );


        document.querySelector(
            ".editor"
        ).style.display =
            "none";


        document.getElementById(
            "chapters-container"
        ).innerHTML =
            "<p>No tienes permiso para modificar los capítulos de esta historia.</p>";


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   CARGAR CAPÍTULOS
========================================== */

async function loadChapters() {

    const container =
        document.getElementById(
            "chapters-container"
        );


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            container.innerHTML =
                "<p>No se pudieron cargar los capítulos.</p>";

            return;

        }


        const chapters =
            data.chapters || [];


        if (chapters.length === 0) {

            container.innerHTML =
                "<p>Aún no hay capítulos.</p>";

            return;

        }


        container.innerHTML = "";


        chapters.forEach(
            function(chapter) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "chapter-card";


                const preview =
                    (chapter.content || "").length > 300
                        ? chapter.content.substring(
                            0,
                            300
                        ) + "..."
                        : (chapter.content || "");


                card.innerHTML =

                    '<div class="chapter-number">' +
                    'CAPÍTULO ' +
                    chapter.chapter_number +
                    '</div>' +

                    '<h3>' +
                    escapeHtml(
                        chapter.title || ""
                    ) +
                    '</h3>' +

                    '<div class="chapter-preview">' +
                    escapeHtml(
                        preview
                    ) +
                    '</div>' +

                    '<div class="chapter-actions">' +

                    '<button ' +
                    'class="edit-button" ' +
                    'onclick="editChapter(' +
                    chapter.id +
                    ')">' +
                    'Editar' +
                    '</button>' +

                    '<button ' +
                    'class="remove-button" ' +
                    'onclick="deleteChapter(' +
                    chapter.id +
                    ')">' +
                    'Eliminar' +
                    '</button>' +

                    '</div>';


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Error cargando capítulos.</p>";

    }

}

/* ==========================================
   BLOQUES DE CONTENIDO
========================================== */

function addTextBlock() {

    contentBlocks.push({
        type: "text",
        content: ""
    });

    renderBlocks();
}


function addImageBlock() {

    contentBlocks.push({
        type: "image",
        image_id: null,
        image_url: "",
        filename: "",
        file: null,
        preview: null
    });

    renderBlocks();
}


function removeBlock(index) {

    contentBlocks.splice(index, 1);

    renderBlocks();
}


function renderBlocks() {

    const container =
        document.getElementById(
            "blocks-container"
        );

    container.innerHTML = "";

    contentBlocks.forEach(
        function(block, index) {

            const element =
                document.createElement("div");

            element.className =
                "content-block";


            const header =
                document.createElement("div");

            header.className =
                "content-block-header";


            const title =
                document.createElement("div");

            title.className =
                "content-block-title";

            title.textContent =
                block.type === "image"
                    ? "🖼️ Imagen"
                    : "📝 Texto";


            const deleteButton =
                document.createElement("button");

            deleteButton.type =
                "button";

            deleteButton.className =
                "delete-block";

            deleteButton.textContent =
                "Eliminar";

            deleteButton.onclick =
                function() {

                    removeBlock(index);

                };


            header.appendChild(title);

            header.appendChild(
                deleteButton
            );

            element.appendChild(header);


            /* ==============================
               TEXTO
            ============================== */

            if (
                block.type === "text"
            ) {

                const textarea =
                    document.createElement(
                        "textarea"
                    );

                textarea.placeholder =
                    "Escribe el texto...";

                textarea.value =
                    block.content || "";

                textarea.oninput =
                    function() {

                        block.content =
                            textarea.value;

                    };

                element.appendChild(
                    textarea
                );

            }


            /* ==============================
               IMAGEN
            ============================== */

            if (
                block.type === "image"
            ) {

                const input =
                    document.createElement(
                        "input"
                    );

                input.type =
                    "file";

                input.accept =
                    "image/jpeg,image/png,image/webp,image/gif";


                input.onchange =
                    function(event) {

                        const file =
                            event.target.files[0];

                        if (!file) {
                            return;
                        }

                        block.file =
                            file;

                        block.image_id =
                            null;

                        block.image_url =
                            "";

                        block.filename =
                            file.name;


                        const reader =
                            new FileReader();


                        reader.onload =
                            function(e) {

                                block.preview =
                                    e.target.result;

                                renderBlocks();

                            };


                        reader.readAsDataURL(
                            file
                        );

                    };


                element.appendChild(
                    input
                );


                const src =
                    block.preview ||
                    block.image_url;


                if (src) {

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        src;

                    img.alt =
                        block.filename ||
                        "Imagen";

                    element.appendChild(
                        img
                    );

                }

            }


            container.appendChild(
                element
            );

        }
    );
}

/* ==========================================
   GUARDAR CAPÍTULO
========================================== */

async function saveChapter() {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const title =
        document.getElementById(
            "chapter-title"
        ).value.trim();


    {
    "version": 1,
    "blocks": [
        {
            "type": "text",
            "content": "Primer texto..."
        },
        {
            "type": "image",
            "image_id": 25,
            "image_url": "...",
            "filename": "imagen.jpg"
        },
        {
            "type": "text",
            "content": "Segundo texto..."
        }
    ]
}


    if (!title) {

        showError(
            "Escribe un título para el capítulo."
        );

        return;

    }


    if (!content.trim()) {

        showError(
            "Escribe el contenido del capítulo."
        );

        return;

    }


    try {

        let response;


        /* ==============================
           CREAR
        ============================== */

        if (!editingChapterId) {

            response =
                await fetch(
                    "/api/stories/" +
                    storyId +
                    "/chapters",
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                title:
                                    title,
                                content:
                                    content
                            })
                    }
                );

        }


        /* ==============================
           EDITAR
        ============================== */

        else {

            response =
                await fetch(
                    "/api/chapters/" +
                    editingChapterId,
                    {
                        method: "PUT",
                        credentials: "include",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                title:
                                    title,
                                content:
                                    content
                            })
                    }
                );

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo guardar el capítulo."
            );

            return;

        }


        showSuccess(
            editingChapterId
                ? "Capítulo actualizado correctamente."
                : "Capítulo creado correctamente."
        );


        clearEditor();

        loadChapters();


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   EDITAR CAPÍTULO
========================================== */

async function editChapter(
    chapterId
) {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/stories/" +
                storyId +
                "/chapters",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                "No se pudo cargar el capítulo."
            );

            return;

        }


        const chapter =
            data.chapters.find(
                function(item) {

                    return Number(item.id) ===
                        Number(chapterId);

                }
            );


        if (!chapter) {

            showError(
                "El capítulo no existe."
            );

            return;

        }


        editingChapterId =
            chapter.id;


        contentBlocks = parseContent(
    chapter.content
);

originalImageIds =
    contentBlocks
        .filter(function(block) {
            return (
                block.type === "image" &&
                block.image_id
            );
        })
        .map(function(block) {
            return Number(
                block.image_id
            );
        });

renderBlocks();


        document.getElementById(
            "chapter-title"
        ).value =
            chapter.title || "";


        document.getElementById(
            "chapter-content"
        ).value =
            chapter.content || "";


        document.getElementById(
            "cancel-button"
        ).style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo cargar el capítulo."
        );

    }

}

function parseContent(content) {

    if (!content) {
        return [];
    }

    if (Array.isArray(content)) {
        return content;
    }

    if (typeof content === "object") {

        if (Array.isArray(content.blocks)) {
            return content.blocks;
        }

        return [];
    }

    if (typeof content !== "string") {
        return [];
    }


    try {

        const parsed =
            JSON.parse(content);


        if (Array.isArray(parsed)) {
            return parsed;
        }


        if (
            parsed &&
            Array.isArray(parsed.blocks)
        ) {

            return parsed.blocks;

        }

    } catch (error) {

        /*
         * Compatibilidad con capítulos
         * antiguos que todavía tienen
         * contenido como texto plano.
         */

        return [
            {
                type: "text",
                content: content
            }
        ];

    }

    return [];
}


/* ==========================================
   ELIMINAR CAPÍTULO
========================================== */

async function deleteChapter(
    chapterId
) {

    if (!hasPermission) {

        showError(
            "No tienes permiso para modificar esta historia."
        );

        return;

    }


    const confirmed =
        confirm(
            "¿Seguro que quieres eliminar este capítulo?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/chapters/" +
                chapterId,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showError(
                data.error ||
                "No se pudo eliminar el capítulo."
            );

            return;

        }


        showSuccess(
            "Capítulo eliminado correctamente."
        );


        if (
            Number(editingChapterId) ===
            Number(chapterId)
        ) {

            clearEditor();

        }


        loadChapters();


    } catch (error) {

        console.error(error);

        showError(
            "No se pudo conectar con el servidor."
        );

    }

}


/* ==========================================
   CANCELAR EDICIÓN
========================================== */

function cancelEdit() {

    clearEditor();

}


/* ==========================================
   LIMPIAR EDITOR
========================================== */

function clearEditor() {

    editingChapterId =
        null;


    document.getElementById(
        "editor-title"
    ).textContent =
        "Agregar capítulo";


    document.getElementById(
        "chapter-title"
    ).value =
        "";


    document.getElementById(
        "chapter-content"
    ).value =
        "";


    document.getElementById(
        "cancel-button"
    ).style.display =
        "none";

}


/* ==========================================
   MENSAJES
========================================== */

function showError(message) {

    const element =
        document.getElementById(
            "error-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "success-message"
    ).style.display =
        "none";

}


function showSuccess(message) {

    const element =
        document.getElementById(
            "success-message"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    document.getElementById(
        "error-message"
    ).style.display =
        "none";


    setTimeout(
        function() {

            element.style.display =
                "none";

        },
        3000
    );

}


/* ==========================================
   SEGURIDAD HTML
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}

</script>
